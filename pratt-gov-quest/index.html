function topicRow(u,t){let a=state.attempts[t]||{n:0,c:0},acc=a.n?Math.round(a.c/a.n*100):null;let status=acc===null?'Not practiced':(acc<70?'Needs review':(acc>=85&&a.n>=3?'Strong':'Developing'));let cls=status==='Strong'?'good':status==='Needs review'?'bad':status==='Developing'?'warn':'';let sample=qBank.find(q=>q.topic===t);return `<div class="topic"><div class="topic-head"><div><strong>${esc(t)}</strong><div class="small muted">${a.n} answered · ${acc===null?'No accuracy yet':acc+'% accuracy'}</div></div><span class="mastery ${cls}">${status}</span></div><div class="progress" style="margin:8px 0"><span style="width:${acc||0}%"></span></div><details><summary>Targeted support</summary><div class="card" style="margin-top:10px"><p><strong>Sample question:</strong> ${sample?esc(sample.q):'No targeted item has been assigned yet.'}</p><div class="row">${sample?`<button class="btn" data-target-q="${sample.id}">Practice this question</button>`:''}<button class="btn secondary" data-go="shelf">Open Study Shelf</button></div><p class="small muted">Suggested review: revisit the unit concept, then complete a stimulus-based question and an FRQ part using the same skill.</p></div></details></div>`}
function nextSteps(){let weak=[];units.forEach(u=>u.topics.forEach(t=>{let a=state.attempts[t];if(a&&a.n>=1){let acc=Math.round(a.c/a.n*100);if(acc<70)weak.push([t,acc])}}));if(!weak.length)return `<strong>Build your baseline.</strong><p class="muted small">Take the Baseline Diagnostic. It samples all five units and creates the starting point for your Course Understanding bars.</p><button class="btn" data-start-baseline aria-label="Open the Baseline Diagnostic">Build my baseline</button>`;weak.sort((a,b)=>a[1]-b[1]);return `<strong>Focus on ${esc(weak[0][0])}</strong><p class="muted small">Current accuracy: ${weak[0][1]}%. Open the topic below for a targeted question and review sequence.</p><button class="btn" data-topic-focus="${esc(weak[0][0])}">Open focused review</button>`}
function shelf(){const tab=state.shelfTab||'documents';const tabs=[['documents','Foundational Documents'],['cases','Supreme Court Cases'],['amendments','Key Amendments'],['course','Course Breakdown'],['stimulus','Stimulus Shelf']];let body='';if(tab==='documents')body=`<div class="section"><h2>Required Foundational Documents</h2><div class="grid">${docs.map(d=>`<div class="card"><span class="pill">FOUNDATIONAL DOCUMENT</span><h3><button class="link-title" data-doc-open="${esc(docId(d[0]))}">${esc(d[0])}</button></h3><p class="muted">${esc(d[1])} · ${esc(d[2])}</p><div class="row"><button class="btn" data-doc-open="${esc(docId(d[0]))}">Study document →</button><a class="btn ghost" href="${esc(d[3])}" target="_blank" rel="noopener noreferrer">Open source ↗</a></div></div>`).join('')}</div></div>`;if(tab==='cases')body=`<div class="section"><div class="row" style="justify-content:space-between"><div><h2>Required Supreme Court Cases</h2><p class="muted small">Use the Casebook for facts, constitutional provisions, holdings, reasoning, excerpts, comparisons, and study notes.</p></div><button class="btn secondary" data-go="casebook">Open Casebook</button></div><div class="grid">${cases.map(c=>{const id=caseId(c[0]);return `<div class="card library-card"><div><span class="pill">REQUIRED CASE</span><h3><button class="link-title" data-case-open="${id}">${esc(c[0])} <span class="muted">(${c[1]})</span></button></h3><p class="muted">${esc(c[2])}</p></div><button class="btn ghost" data-case-open="${id}">Study case →</button></div>`}).join('')}</div></div>`;if(tab==='amendments')body=`<div class="section amendment-hero"><div class="eyebrow" style="color:#f5df8b">CONSTITUTIONAL CORE</div><h2 style="font:700 32px Georgia,serif;margin-top:8px">The Amendments You Need to Know</h2><p style="color:#e2eef6;max-width:900px;line-height:1.65">AP Government does not require memorizing every amendment equally. This dedicated reference focuses on the amendments most directly connected to civil liberties, civil rights, federalism, voting, presidential power, and the required Supreme Court cases.</p><div class="row" style="margin-top:14px"><span class="pill" style="background:#f0d77e;color:#173f63">16 high-value amendments</span><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">AP Gov connections</span><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">Case links</span></div></div><div class="amendment-grid">${amendments.map(a=>`<article class="amendment-card"><div class="amendment-number" aria-label="Amendment ${a.n}">${a.n}</div><h3>${esc(a.title)}</h3><p class="muted">${esc(a.short)}</p><div class="amendment-meta"><span>Ratified ${a.ratified}</span>${a.cases.length?`<span>${a.cases.length} case connection${a.cases.length>1?'s':''}</span>`:''}</div><details><summary>AP Gov: what to know</summary><p class="small muted">${esc(a.use)}</p>${a.cases.length?`<div class="source-row"><strong class="small">Case connections</strong><div class="review-links">${a.cases.map(c=>`<button class="btn ghost" data-case-open="${caseId(c)}">${esc(c)}</button>`).join('')}</div></div>`:''}</details><div class="source-row"><a class="text-link" href="${esc(a.source)}" target="_blank" rel="noopener noreferrer">Read the amendment text ↗</a></div></article>`).join('')}</div><div class="notice" style="margin-top:18px"><strong>Study strategy:</strong> Do not memorize amendments as isolated numbers. Practice pairing each amendment with the right constitutional principle, scenario, and case. The amendment reference is designed to support that kind of retrieval.</div>`;if(tab==='course')body=`<div class="section"><h2>College Board Course Breakdown</h2><p class="muted">Gov Quest uses the current College Board Course and Exam Description as its course-alignment reference. The topic labels below mirror the official CED sequence; question content is independently written for the prototype.</p>${units.map(u=>`<details class="unit"><summary>Unit ${u.id}: ${esc(u.name)} · ${u.weight}</summary><div class="unit-body">${u.topics.map((t,i)=>`<div class="topic"><strong>${esc(t)}</strong><div class="small muted">College Board topic sequence · subsection ${i+1}</div></div>`).join('')}</div></details>`).join('')}<a class="btn ghost" href="https://apcentral.collegeboard.org/courses/ap-united-states-government-and-politics" target="_blank" rel="noopener noreferrer">Open official AP Gov course page ↗</a></div>`;if(tab==='stimulus')body=`<div class="section"><h2>Advanced Stimulus Shelf</h2><p class="muted">Higher-difficulty practice uses source-based reasoning and original stimulus sets.</p><div class="grid">${advancedBank.map(q=>`<div class="card"><span class="pill">Advanced · Unit ${q.unit}</span><h3>${esc(q.topic)}</h3><p class="small muted">${esc(q.source||'Course-based analytical scenario')}</p><button class="btn" data-advanced-q="${q.id}">Practice this set</button></div>`).join('')}</div></div>`;return `<div class="hero"><div class="eyebrow">Reference Center</div><h1>Study Shelf</h1><p class="lead">A structured reference library for the evidence and constitutional knowledge behind AP U.S. Government and Politics.</p></div><div class="shelf-tabs" role="tablist" aria-label="Study Shelf sections">${tabs.map(([id,label])=>`<button class="shelf-tab ${tab===id?'active':''}" data-shelf-tab="${id}" role="tab" aria-selected="${tab===id}">${label}</button>`).join('')}</div>${body}`}

function caseId(title){return title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')}
function caseTitleFromRef(ref){const raw=String(ref||'');const byTitle=cases.find(c=>c[0]===raw);if(byTitle)return byTitle[0];const byId=cases.find(c=>caseId(c[0])===raw);return byId?byId[0]:null}
function docId(title){return title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')}
function docFromRef(ref){const raw=String(ref||'');return docs.find(d=>d[0]===raw)||docs.find(d=>docId(d[0])===raw)||null}
function documentDetail(ref){const d=docFromRef(ref);if(!d)return `<div class="card"><h2>Document not found</h2><p class="muted">This reference could not be matched to a required foundational document.</p><button class="btn" data-go="shelf">Return to Study Shelf</button></div>`;return `<div class="row" style="margin-bottom:14px"><button class="btn secondary" data-go="shelf">← Study Shelf</button><button class="btn ghost" data-doc-back>All required documents</button></div><div class="hero"><span class="pill">FOUNDATIONAL DOCUMENT</span><h1>${esc(d[0])}</h1><p class="lead">${esc(d[2])}</p><div class="row"><span class="pill">${esc(d[1])}</span><a class="btn" href="${esc(d[3])}" target="_blank" rel="noopener noreferrer">Open source ↗</a></div></div><div class="section two"><div class="card"><div class="eyebrow">Why it matters</div><h3>What to know</h3><p>${esc(d[2])}</p><p class="small muted">Use the source document to review the original language before returning to practice.</p></div><div class="card"><div class="eyebrow">Next step</div><h3>Practice the connection</h3><p class="muted">Return to the practice question or FRQ that sent you here, then try it again using the document as evidence.</p><button class="btn" data-go="practice">Return to Practice Lab</button></div></div>`}
function casebook(){return state.casebookId&&caseMeta[state.casebookId]?caseDetail(state.casebookId):`<div class="hero"><div class="eyebrow">Supreme Court Casebook</div><h1>Required Supreme Court Cases</h1><p class="lead">Study each case at your own pace. There is no forced sequence: move from facts to constitutional issue, holding, reasoning, and AP application when you are ready.</p></div><div class="section"><div class="grid">${cases.map(c=>{const id=caseId(c[0]),m=caseMeta[c[0]];return `<div class="card library-card"><div><span class="pill">${esc(m.unit)}</span><h3><button class="link-title" data-case-open="${id}">${esc(c[0])} <span class="muted">(${c[1]})</span></button></h3><p class="muted">${esc(m.clauses.join(' · '))}</p></div><button class="btn" data-case-open="${id}">Open case →</button></div>`}).join('')}</div></div>`}
function caseDetail(id){const m=caseMeta[id],prog=state.caseProgress[id]||{},done=Object.values(prog).filter(Boolean).length;const steps=[['facts','The Facts'],['issue','Constitutional Question'],['holding','The Holding'],['reason','The Court’s Reasoning'],['about','What the Case Is Really About'],['ap','AP Gov Connections']];return `<div class="row" style="margin-bottom:14px"><button class="btn secondary" data-go="shelf">← Study Shelf</button><button class="btn ghost" data-case-back>All required cases</button></div><div class="hero"><span class="pill">${esc(m.unit)}</span><h1>${esc(m.title||cases.find(c=>caseId(c[0])===id)?.[0]||id)} <span class="muted">(${esc((cases.find(c=>caseId(c[0])===id)||[])[1]||'')})</span></h1><p class="lead">${esc(m.clauses.join(' · '))}</p><div class="row"><span class="small muted">Constitutional provisions</span>${m.provisions.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div><div class="section two"><div><div class="card"><div class="eyebrow">Study map</div><h3>Your pace</h3><p class="small muted">Mark sections complete as you study. ${done} of ${steps.length} sections completed.</p>${steps.map(x=>`<label class="topic" style="display:block"><input type="checkbox" data-case-progress="${id}|${x[0]}" ${prog[x[0]]?'checked':''}> <strong>${x[1]}</strong></label>`).join('')}</div><div class="card" style="margin-top:14px"><div class="eyebrow">Knowledge checklist</div><h3>Notes you should leave with</h3>${m.notes.map((n,i)=>`<label class="topic" style="display:block"><input type="checkbox" data-case-note="${id}|${i}" ${(prog.notes||[]).includes(i)?'checked':''}> ${esc(n)}</label>`).join('')}</div></div><div><div class="card"><div class="eyebrow">Constitutional connections</div><h3>What to know</h3>${m.provisions.map(x=>`<div class="topic"><strong>${esc(x)}</strong></div>`).join('')}<div class="row" style="margin-top:10px">${m.clauses.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="eyebrow">Opinion excerpt</div><h3>Read the Court’s language</h3><p class="passage">${esc(m.excerpt)}</p><p class="small muted">Short public-domain excerpt or concise characterization of the Court’s language.</p></div></div></div><div class="section"><div class="card"><div class="eyebrow">1 · Facts</div><h2>The Facts</h2><p class="passage">${esc(m.facts)}</p></div></div><div class="section"><div class="grid"><div class="card"><div class="eyebrow">2 · Issue</div><h2>Constitutional Question</h2><p class="passage">${esc(m.issue)}</p></div><div class="card"><div class="eyebrow">3 · Holding</div><h2>The Holding</h2><p class="passage">${esc(m.holding)}</p></div><div class="card"><div class="eyebrow">4 · Reasoning</div><h2>The Court’s Reasoning</h2><p class="passage">${esc(m.reason)}</p></div><div class="card"><div class="eyebrow">5 · Meaning</div><h2>What the Case Is Really About</h2><p class="passage">${esc(m.about)}</p></div><div class="card"><div class="eyebrow">6 · AP Application</div><h2>AP Gov Connections</h2><p class="small muted">Use these as anchors when answering stimulus questions or comparing cases.</p><div class="row">${m.clauses.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div></div></div><div class="section"><div class="notice"><strong>Source note:</strong> The required-case list and AP-oriented holdings are based on the College Board Course and Exam Description. Case details are supplemented with the Supreme Court opinions. <a href="https://apcentral.collegeboard.org/courses/ap-united-states-government-and-politics" target="_blank" rel="noopener">College Board course page ↗</a> · <a href="https://www.supremecourt.gov/opinions/" target="_blank" rel="noopener">Supreme Court opinions ↗</a></div></div>`}

function argumentLab(){return `<div class="hero"><div class="eyebrow">Argumentation · AP Gov</div><h1>Argument Lab</h1><p class="lead">Study released Argument Essays, practice reading like an AP reader, then submit your own essay for a rubric-based coaching pass. The scoring framework below follows the College Board's six-point Argument Essay structure; the local coach is practice feedback, not an official AP score.</p><div class="row"><button class="btn" data-essay-mode="write">Write an Argument</button><button class="btn secondary" data-essay-mode="read">Released Essay Reader</button><button class="btn secondary" data-essay-mode="rubric">Rubric & Rebuttal</button></div></div><div id="essayArea" class="section">${essayWrite()}</div>`}
function essayWrite(){let saved=state.essays||{};return `<div class="section"><div class="essay-layout"><div><div class="card"><div class="eyebrow">Choose a unit</div><select id="essayUnit" style="width:100%;padding:10px;border:1px solid #cfd5dc;margin:8px 0 15px"><option value="">Select a unit prompt</option>${essayPrompts.map(e=>`<option value="${e.unit}">Unit ${e.unit}: ${esc(e.title)}</option>`).join('')}</select><div id="essayPrompt" class="notice">Select a prompt to begin. The five prompts are practice prompts organized by unit themes; released College Board questions are listed separately below.</div><textarea id="essayText" class="notes essay-box" placeholder="Write your full argument essay here..."></textarea><div class="row"><button class="btn" id="gradeEssay">Run rubric coach</button><button class="btn secondary" id="saveEssay">Save draft</button></div></div></div><div><div class="card"><div class="eyebrow">Reader checklist</div><div class="rubric-row"><h4>Row A · Claim/Thesis · 1 point</h4><div class="small muted">Does the response directly answer the prompt with a defensible claim and a clear line of reasoning?</div></div><div class="rubric-row"><h4>Row B · Evidence · 3 points</h4><div class="small muted">Does it use specific, relevant course evidence, including the required foundational-document evidence when the prompt requires it?</div></div><div class="rubric-row"><h4>Row C · Reasoning · 1 point</h4><div class="small muted">Does the response explain how its evidence supports the claim?</div></div><div class="rubric-row"><h4>Row D · Alternative Perspective · 1 point</h4><div class="small muted">Does it explain an alternative perspective and use rebuttal, refutation, or concession to strengthen the original argument?</div></div><div class="notice">The 2025 College Board scoring guidelines identify the Argument Essay as a 6-point question with these four reporting rows. Use the official scoring guide for final verification.</div></div></div></div><div id="essayResult" class="section"></div></div>`}
function essayReader(){return `<div class="card"><div class="eyebrow">Released materials</div><h2>College Board Argument Essay Reader</h2><p class="muted">Open the official prompt, scoring guidelines, and student sample. Then enter the score you think the sample earned before checking the published commentary.</p><div class="grid">${releasedEssays.map((e,i)=>`<div class="card library-card"><div><span class="pill">${esc(e.year)}</span><h3>${esc(e.title)}</h3><p class="small muted">The links below go to College Board's released materials.</p></div><div class="row"><a class="btn secondary" href="${e.url}" target="_blank" rel="noopener">Prompt / scoring</a><a class="btn" href="${e.sample}" target="_blank" rel="noopener">Student sample</a></div></div>`).join('')}</div></div><div class="notice" style="margin-top:14px">College Board releases only a limited set of recent materials publicly on AP Central; educators with AP Classroom access can access additional secure practice. Gov Quest links to the official materials rather than reproducing full copyrighted student essays.</div>`}
function essayRubric(){return `<div class="essay-layout"><div class="card"><div class="eyebrow">Rebuttal practice</div><h2>Build the alternative perspective</h2><p class="muted">Write an opposing or alternative perspective, then rebut, refute, or concede it in a way that returns to your original claim.</p><textarea id="rebuttalText" class="notes essay-box" placeholder="Some may argue... However... This supports my original claim because..."></textarea><button class="btn" id="gradeRebuttal">Check rebuttal</button><div id="rebuttalResult"></div></div><div class="card"><div class="eyebrow">Official scoring structure</div><div class="score-total">6 points</div><p class="small muted">Argument Essay</p><table class="table"><tr><th>Row</th><th>Practice target</th><th>Points</th></tr><tr><td>A</td><td>Claim / thesis</td><td>1</td></tr><tr><td>B</td><td>Evidence</td><td>3</td></tr><tr><td>C</td><td>Reasoning</td><td>1</td></tr><tr><td>D</td><td>Alternative perspective</td><td>1</td></tr></table><p class="small muted">These are concise practice descriptions of the College Board criteria; the official scoring guide should be used for final scoring decisions.</p></div></div>`}
function essayCoach(text){let clean=text.trim();if(!clean)return {score:0,items:[],chat:'Paste an essay first so the coach can analyze it.'};let sentences=clean.split(/(?<=[.!?])\s+/).filter(Boolean);let lower=clean.toLowerCase();let thesis=sentences.slice(0,3).some(x=>/(because|therefore|more effective|better|should|helps|hinders|benefits|harms|is more|is less)/i.test(x));let docTerms=['constitution','federalist','brutus','letter from birmingham','first amendment','fourteenth amendment','declaration of independence','articles of confederation'];let evidenceCount=docTerms.filter(t=>lower.includes(t)).length;let courseTerms=['federalism','checks and balances','separation of powers','judicial review','political socialization','public opinion','interest group','political party','media','voter turnout','campaign finance','equal protection','selective incorporation'];let conceptCount=courseTerms.filter(t=>lower.includes(t)).length;let reasoningSentences=sentences.filter(x=>/(because|therefore|thus|this shows|this demonstrates|which means|as a result|thereby|leads to|allows)/i.test(x));let altSentences=sentences.filter(x=>/(some may|opponents|critics|however|although|on the other hand|alternative|counterargument|concede|rebut|refute)/i.test(x));let score=0;let items=[];if(thesis){score++;items.push(['thesis','strong','A: A plausible thesis/line of reasoning appears early in the response.'])}else items.push(['thesis','miss','A: I could not identify a clear defensible claim with a line of reasoning.'])
let evidencePts=Math.min(3,(evidenceCount?2:0)+(conceptCount?1:0));score+=evidencePts;items.push(['evidence',evidencePts>=2?'strong':evidencePts===1?'partial':'miss',`B: Detected ${evidenceCount} foundational-document term(s) and ${conceptCount} course-concept term(s). Verify that each is specific, accurate, and actually supports the claim.`]);if(reasoningSentences.length){score++;items.push(['reasoning','strong','C: The essay contains explicit reasoning language connecting evidence to the argument.'])}else items.push(['reasoning','miss','C: I did not detect explicit reasoning that explains why the evidence proves the claim.'])
if(altSentences.length){score++;items.push(['alternative','strong','D: An alternative perspective/rebuttal pattern is present. Check that it is fully explained and returns to the original claim.'])}else items.push(['alternative','miss','D: I did not detect an alternative perspective followed by rebuttal, refutation, or concession.']);return {score,items,sentences,chat:`The coach found ${score}/6 rubric points worth investigating. The biggest next step is to inspect every highlighted sentence and make sure the evidence is specific, the reasoning explains the connection, and the alternative perspective is actually answered.`}}
function renderEssayFeedback(text,res){let spans=res.sentences.map(s=>{let l=s.toLowerCase();let cls='strong';if(/however|although|some may|opponents|critics|alternative|counterargument|concede|rebut|refute/.test(l))cls='strong';else if(/because|therefore|thus|this shows|this demonstrates|which means|as a result|thereby|leads to|allows/.test(l))cls='strong';else if(/constitution|federalist|brutus|amendment|federalism|checks and balances|judicial review|political socialization|public opinion|interest group|political party|media|voter turnout|campaign finance/.test(l))cls='partial';else cls='miss';return `<span class="hl ${cls}">${esc(s)}</span> `}).join('');return `<div class="card"><div class="row"><div><div class="eyebrow">Rubric coach</div><div class="score-total">${res.score}/6</div></div><div class="small muted">Practice estimate · not an official College Board score</div></div><div class="highlighted-essay" style="margin-top:12px">${spans}</div><div class="grid">${res.items.map(i=>`<div class="rubric-row"><h4>${esc(i[0].toUpperCase())} · ${i[1]==='strong'?'Potential credit':i[1]==='partial'?'Needs verification':'Likely missing'}</h4><div class="small">${esc(i[2])}</div></div>`).join('')}</div><div class="chat"><div class="bubble"><strong>Essay Coach:</strong> ${esc(res.chat)}</div><div class="bubble"><strong>Next revision:</strong> Turn the weakest highlighted sentence into a specific claim → evidence → reasoning chain. Then make your rebuttal explicitly answer the alternative perspective.</div></div></div>`}
function rebuttalCoach(text){let l=text.toLowerCase();let alt=/(some may|opponents|critics|although|however|alternative|counterargument)/.test(l);let response=/(however|but|yet|rebut|refut|although|nevertheless|this argument fails|this still)/.test(l);let score=(alt?1:0)+(response?1:0);return `<div class="feedback ${score===2?'good':'bad'}"><strong>Rebuttal check: ${score}/2 indicators present.</strong><p>${alt?'Alternative perspective detected.':'Start by clearly stating what someone on the other side would argue.'}</p><p>${response?'A response to the alternative is detected.':'Add a sentence that directly answers the alternative and explains why your original claim still stands.'}</p></div>`}
function about(){return `<div class="hero"><span class="pill">About & Help</span><h1 style="margin-top:10px">Gov Quest + the official AP framework</h1><p class="lead">Gov Quest is a local-first practice prototype that follows the public College Board AP U.S. Government and Politics framework. Use the official College Board pages below as the source of truth when the course framework or assessment information changes.</p><div class="section"><div class="card"><h3>Alignment snapshot</h3><div class="grid" style="margin-top:12px"><div class="lobby-card"><strong>Five course units</strong><p class="small muted">Foundations; Interactions Among Branches; Civil Liberties and Civil Rights; Political Ideologies and Beliefs; Political Participation.</p></div><div class="lobby-card"><strong>Five recurring skills</strong><p class="small muted">Concept Application, SCOTUS Application, Data Analysis, Source Analysis, and Argumentation.</p></div><div class="lobby-card"><strong>Current digital exam</strong><p class="small muted">55 multiple-choice questions plus 4 free-response questions. Gov Quest mirrors the public structure without copying secure test content.</p></div></div></div></div><div class="section"><h2>Official College Board resources</h2><div class="grid"><a class="card link-card" href="https://apcentral.collegeboard.org/courses/ap-united-states-government-and-politics" target="_blank" rel="noopener"><h3>AP Gov course page ↗</h3><p class="muted">Official course overview, unit weighting, skills, and course resources.</p></a><a class="card link-card" href="https://apcentral.collegeboard.org/pdf/ap-us-government-and-politics-course-and-exam-description.pdf" target="_blank" rel="noopener"><h3>Course & Exam Description ↗</h3><p class="muted">The detailed unit, topic, skill, and assessment framework used for alignment.</p></a><a class="card link-card" href="https://apcentral.collegeboard.org/instructional-resources/ap-classroom" target="_blank" rel="noopener"><h3>AP Classroom }

plore required Supreme Court cases, amendments, holdings, reasoning, and study checklists.',action:'Open Supreme Court Casebook',go:'casebook',checkpoint:null},courts:{title:'Checkpoint 6 · Court Cases',text:'Strengthen your ability to compare required Supreme Court cases and connect rulings to constitutional provisions.',scope:'cases',checkpoint:'courts'},ideology:{title:'Checkpoint 7 · Political Beliefs',text:'Connect political socialization, public opinion, ideology, and policy preferences.',unit:'4',checkpoint:'ideology'},modern:{title:'Modern America · Political Participation',text:'Finish the journey by connecting voting, parties, interest groups, media, campaigns, and elections.',action:'Practice Unit 5',go:'practice',unit:'5',checkpoint:null},participation:{title:'Checkpoint 8 · Political Participation',text:'Use the full course toolkit to analyze participation and political communication.',unit:'5',checkpoint:'participation'}}[id];if(!info)return;

function zoomMap(dir){const world=document.getElementById('mapWorld');if(!world)return;let z=Number(world.dataset.zoom||1);if(dir==='in')z=Math.min(1.8,z+.15);if(dir==='out')z=Math.max(.85,z-.15);if(dir==='reset')z=1;world.dataset.zoom=z;world.style.transform=`scale(${z})`;}

function speak(text){const status=document.getElementById('saveStatus');if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){if(status)status.textContent='Device voice is unavailable; all text remains visible.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.rate=.95;u.onstart=()=>{if(status)status.textContent='Playing device voice…'};u.onend=()=>{if(status)status.textContent='Ready'};u.onerror=()=>{if(status)status.textContent='Device voice could not play; use the visible text.'};speechSynthesis.speak(u)}
