ze:13px}.btn.secondary{background:#eef1f4;color:#344054}.btn.ghost{background:#fff;color:var(--blue);border:1px solid #b8c4d3}.btn.danger{color:#9b1c1c;border-color:#e5b7b7}.btn:disabled{opacity:.5;cursor:not-allowed}.link-title{background:none;color:var(--blue);padding:0;text-align:left;font-weight:800;font-size:16px}.link-title:hover{text-decoration:underline}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.section{margin-top:26px}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:8px;background:#e9edf2;border-radius:2px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--blue)}.unit{border:1px solid var(--line);border-radius:4px;background:#fff;margin:10px 0;overflow:hidden}.unit>summary{padding:15px;cursor:pointer;font-weight:800}.unit-body{padding:0 16px 16px}.topic{padding:13px 0;border-top:1px solid var(--line)}.topic-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.mastery{font-size:12px;font-weight:700}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:#b42318}.hidden{display:none!important}.question{font-size:18px;line-height:1.55}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cfd5dc;padding:12px;border-radius:3px;margin:8px 0}.choice:hover{border-color:#91a4bb;background:#fafcff}.choice.selected{border-color:var(--blue);background:var(--blue2)}.feedback{padding:13px;border-radius:3px;margin-top:14px;border:1px solid var(--line)}.feedback.good{background:#effaf6;border-color:#b7dfd0}.feedback.bad{background:#fff5f4;border-color:#efc1bd}.stimulus{background:#f8fafc;border:1px solid var(--line);padding:16px;border-radius:3px;line-height:1.65;white-space:pre-wrap}.barwrap{display:flex;align-items:end;gap:22px;height:190px;padding:16px;border:1px solid var(--line);border-radius:3px;background:#fff}.bar{width:48px;background:#5b78a5;border-radius:2px 2px 0 0;position:relative}.bar label{position:absolute;bottom:-25px;width:100%;text-align:center;font-size:10px}.bar b{position:absolute;top:-18px;width:100%;text-align:center;font-size:10px}.passage{background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px;line-height:1.8;user-select:text}.passage mark,.annotatable mark{background:#ffe08a;padding:1px 2px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.notes{width:100%;min-height:120px;border:1px solid #cfd5dc;border-radius:3px;padding:11px;resize:vertical}.annotation-tools{margin-top:6px}.annotation-bar{display:flex;align-items:center;gap:8px;min-height:28px}.annotation-select{border:0;background:transparent;color:#475467;font-size:12px;padding:4px 24px 4px 4px;border-radius:3px;cursor:pointer}.annotation-select:hover,.annotation-select:focus{background:#f2f4f7;color:var(--blue);outline:1px solid #cbd5e1}.annotation-status{font-size:11px;color:#98a2b3}.annotation-notes-link{border:0;background:transparent;color:#667085;font-size:11px;padding:4px;cursor:pointer}.annotation-notes-link:hover{color:var(--blue);text-decoration:underline}.annotation-tools details{margin-top:4px}.annotation-tools details summary{display:inline-block;color:#667085;font-size:11px;cursor:pointer;list-style:none}.annotation-tools details summary::-webkit-details-marker{display:none}.annotation-tools details summary:before{content:'▸ ';color:#98a2b3}.annotation-tools details[open] summary:before{content:'▾ ';}.annotation-tools .notes{min-height:72px;margin-top:6px}.annotation-note{border-left:2px solid #d9a441;padding:7px 0 7px 9px;margin:7px 0}.annotation-note .btn{padding:4px 7px;font-size:11px}.annotation-note mark{font-size:11px}.annotation-note{border-left:3px solid #e0a400;padding:9px 0 9px 10px;margin:9px 0}.annotation-note mark{display:inline-block;margin-bottom:6px}.annotatable{user-select:text;cursor:text}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.eyebrow{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.6px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.table th{background:#f7f8fa}.essay-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:16px}.essay-box{min-height:360px}.rubric-row{border:1px solid var(--line);padding:12px;margin:8px 0;background:#fff}.rubric-row h4{margin:0 0 5px}.highlighted-essay{font-size:15px;line-height:1.8;background:#fff;border:1px solid var(--line);padding:18px;white-space:normal}.hl{padding:2px 3px;border-radius:2px}.hl.miss{background:#ffd9d6;border-bottom:2px solid #c43d3d}.hl.partial{background:#fff0bd;border-bottom:2px solid #c08a00}.hl.strong{background:#dff4ea;border-bottom:2px solid #13795b}.score-total{font-size:28px;font-weight:800;color:var(--blue)}.source-tag{font-size:11px;color:var(--muted);margin-top:8px}.library-card{display:flex;flex-direction:column;justify-content:space-between;min-height:180px}.notice{background:#f7f8fa;border-left:3px solid var(--blue);padding:12px 14px;font-size:13px;line-height:1.5}.chart{border:1px solid var(--line);padding:16px;background:#fff;border-radius:3px}.chart svg{width:100%;height:auto;display:block}.chat{border:1px solid var(--line);background:#f7f8fa;padding:14px;min-height:160px}.chat .bubble{background:#fff;border:1px solid var(--line);padding:11px;margin:8px 0;max-width:95%;line-height:1.5}.chat .bubble.user{margin-left:auto;background:var(--blue2)}

/* Stage 5 visual polish: civic atlas / senior-level academic styling */
:root{--navy:#123b62;--ocean:#1f6d9d;--sky:#dceef8;--gold:#d5ae45;--parchment:#f5efe1;--ink2:#18354d}
.home-atlas{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#092a49 0%,#124e78 55%,#1d6f9a 100%);color:#fff;min-height:420px;padding:34px;box-shadow:0 18px 45px rgba(8,35,59,.22)}
.home-atlas:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 8% 15%,rgba(255,255,255,.9) 0 1px,transparent 2px),radial-gradient(circle at 19% 37%,rgba(255,255,255,.7) 0 1px,transparent 2px),radial-gradient(circle at 64% 17%,rgba(255,255,255,.85) 0 1px,transparent 2px),radial-gradient(circle at 82% 31%,rgba(255,255,255,.65) 0 1px,transparent 2px),radial-gradient(circle at 72% 62%,rgba(255,255,255,.75) 0 1px,transparent 2px);opacity:.8;pointer-events:none}
.home-atlas-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:24px;align-items:center;position:relative;z-index:1}
.home-eyebrow{display:inline-flex;align-items:center;gap:8px;font:800 11px/1.2 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#f4d984}
.home-eyebrow:before,.home-eyebrow:after{content:"✦";font-size:10px}
.home-title{font:700 clamp(34px,4vw,56px)/1.03 Georgia,serif;letter-spacing:-.025em;max-width:760px;margin:12px 0 14px;text-shadow:0 3px 18px rgba(0,0,0,.2)}
.home-sub{color:#e4f0f8;max-width:700px;font-size:16px;line-height:1.65}
.home-seal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;max-width:660px}
.home-seal-card{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);border-radius:12px;padding:12px 14px;min-height:92px}
.home-seal-card strong{display:block;color:#fff;font:700 16px Georgia,serif}.home-seal-card span{display:block;margin-top:6px;color:#cfe1ed;font-size:12px;line-height:1.4}
.home-art{position:relative;min-height:340px;border:1px solid rgba(255,255,255,.17);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));overflow:hidden}
.home-art .sun{animation:homeSun 7s ease-in-out infinite alternate;transform-origin:center}.home-art .star{animation:twinkle 3.2s ease-in-out infinite alternate}.home-art .star:nth-of-type(2){animation-delay:.6s}.home-art .star:nth-of-type(3){animation-delay:1.2s}.home-art .star:nth-of-type(4){animation-delay:1.8s}
.home-art .scroll{animation:floatScroll 5s ease-in-out infinite}.home-art .column{transform-box:fill-box;transform-origin:center bottom;animation:columnFloat 6s ease-in-out infinite}.home-art .column:nth-child(2n){animation-delay:.4s}
@keyframes homeSun{from{transform:translateY(4px) scale(.98);opacity:.78}to{transform:translateY(-7px) scale(1.04);opacity:1}}@keyframes twinkle{from{opacity:.25;transform:scale(.75)}to{opacity:1;transform:scale(1.15)}}@keyframes floatScroll{0%,100%{transform:translateY(2px) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@keyframes columnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.home-civic-strip{margin-top:16px;border:1px solid #d8e4ee;background:linear-gradient(90deg,#fff,#f7fbfd,#fff);border-radius:12px;padding:13px 15px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.home-civic-strip strong{font-family:Georgia,serif;color:var(--navy)}
.home-action-card{position:relative;overflow:hidden;border-radius:14px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.home-action-card:after{content:"";position:absolute;inset:auto -20px -34px auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#e5bc58 0,rgba(229,188,88,0) 70%);opacity:.25;pointer-events:none}.home-action-card:hover,.home-action-card:focus-within{transform:translateY(-3px);box-shadow:0 16px 30px rgba(19,59,93,.12);border-color:#9ec2d8}
.shelf-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#edf5fa;border:1px solid #d2e1eb;border-radius:12px;margin-top:18px}.shelf-tab{padding:10px 13px;border-radius:9px;background:transparent;color:#31556f;border:1px solid transparent;font-weight:800;font-size:12px;min-height:42px}.shelf-tab:hover{background:#fff;border-color:#c7dce8}.shelf-tab.active{background:#123b62;color:#fff;border-color:#123b62;box-shadow:0 5px 12px rgba(18,59,98,.16)}
.amendment-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0c3151,#1d6a94);color:#fff;border-radius:16px;padding:28px;border:1px solid #1a597f;box-shadow:0 14px 32px rgba(12,49,81,.16)}.amendment-hero:after{content:"✦  ✦  ✦  ✦  ✦";position:absolute;right:24px;top:18px;color:#edcf74;letter-spacing:12px;font-size:16px;opacity:.85}.amendment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px}.amendment-card{background:linear-gradient(180deg,#fff,#f8fbfd);border:1px solid #d5e1e9;border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(15,51,79,.06);transition:transform .18s ease,box-shadow .18s ease}.amendment-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,51,79,.1)}.amendment-number{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#e6c15c;color:#102f4b;font:800 17px Georgia,serif;box-shadow:0 0 0 4px #f8efd0}.amendment-card h3{font-family:Georgia,serif;font-size:17px;margin-top:13px;color:#123b62}.amendment-card p{line-height:1.55}.amendment-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.amendment-meta span{font-size:10px;font-weight:800;color:#47677d;background:#eaf3f8;border-radius:999px;padding:5px 7px}.amendment-card details{margin-top:11px;border-top:1px solid #e6edf2;padding-top:9px}.amendment-card summary{cursor:pointer;font-size:12px;font-weight:800;color:#1d5f91}.amendment-card .source-row{margin-top:9px}
@media(max-width:850px){.home-atlas-grid{grid-template-columns:1fr}.home-art{min-height:270px}.home-seal{grid-template-columns:1fr}.content{padding:18px}.home-atlas{padding:24px}.home-title{font-size:38px}}
@media(max-width:520px){.home-atlas{padding:18px}.home-title{font-size:32px}.home-art{min-height:220px}.home-civic-strip{align-items:flex-start}.shelf-tabs{overflow-x:auto;flex-wrap:nowrap}.shelf-tab{white-space:nowrap}}

/* Civic visual system */
.civic-banner{background:linear-gradient(110deg,#12355b 0%,#1d4f7a 48%,#b83b2d 100%);color:#fff;border-radius:6px;padding:24px;position:relative;overflow:hidden}.civic-banner:after{content:'★  ★  ★  ★  ★';position:absolute;right:22px;top:14px;font-size:18px;letter-spacing:8px;opacity:.25}.civic-illustration{display:flex;align-items:center;justify-content:center;min-height:145px;background:#f7f2e8;border:1px solid #e4d9c5;border-radius:4px;overflow:hidden}.home-card{position:relative;text-align:left;width:100%;transition:transform .16s,box-shadow .16s,border-color .16s}.home-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(18,53,91,.12);border-color:#9fb7cf}.home-card .card-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:#edf3f8}.home-card:nth-child(2) .card-icon{background:#f8eee9}.home-card:nth-child(3) .card-icon{background:#f4f0df}.home-card .small{color:#174b76;font-weight:700}.flag-stripe{height:5px;background:linear-gradient(90deg,#b83b2d 0 33%,#fff 33% 66%,#174b76 66%)}
/* Road to Independence */
.learning-road{position:relative;margin-top:24px;background:linear-gradient(180deg,#e9f2e5,#f7f1df);border:1px solid #cdd8c5;border-radius:6px;min-height:650px;overflow:hidden;padding:28px}.learning-road:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.7) 0 18px,transparent 19px),radial-gradient(circle at 82% 34%,rgba(255,255,255,.6) 0 24px,transparent 25px),radial-gradient(circle at 35% 78%,rgba(255,255,255,.55) 0 20px,transparent 21px);opacity:.7}.road-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.road-node{position:absolute;z-index:2;width:190px;background:#fff;border:2px solid #d6dbe1;border-radius:6px;padding:14px;box-shadow:0 5px 15px rgba(16,24,40,.1)}.road-node strong{display:block}.road-node .node-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800}.road-node.done{border-color:#2e7d5b}.road-node.current{border-color:#b83b2d;box-shadow:0 0 0 4px rgba(184,59,45,.12),0 7px 18px rgba(16,24,40,.12)}.road-node .node-bar{height:6px;background:#edf0f5;border-radius:6px;margin-top:9px;overflow:hidden}.road-node .node-bar span{display:block;height:100%;background:#2e7d5b}.road-start{left:4%;bottom:8%}.road-finish{right:2%;top:48%;background:#173f63;color:#fff;border-color:#173f63}.road-finish .node-label{color:#dbeafe}.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;font-size:12px;color:#475467}.map-legend span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#d6dbe1}.map-legend .lg-done:before{background:#2e7d5b}.map-legend .lg-current:before{background:#b83b2d}.map-title{position:relative;z-index:3;max-width:600px}.map-title h2{color:#173f63}.map-title p{color:#475467}
@media(max-width:850px){.sidebar{width:190px}.content{padding:18px}.two,.essay-layout{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.topbar{position:static}}


/* Advanced civic / historical map styling */

.independence-map{background:

}

.map-label{font-family:Georgia,'Times New Roman',serif;font-size:11px;letter-spacing:.14em;background:rgba(248,242,226,.86);border:1px solid rgba(147,122,73,.3);border-radius:3px;color:#3c4652;box-shadow:0 2px 5px rgba(62,50,30,.07)}
.map-toolbar{background:rgba(250,247,238,.96);border-color:#b9a878;border-radius:7px}

.landmark{width:96px;min-height:88px;color:#173f63}

.map-evolution .outer-frame{position:absolute;inset:0;background:

radial-gradient(circle at 86% 20%,rgba(244,226,159,.75) 0 2px,transparent 3px),

opacity:.7}

.map-evolution .sea{position:absolute;inset:0;background:
radial-gradient(ellipse at 16% 43%,rgba(98,151,178,.5) 0 15%,transparent 16%),
radial-gradient(ellipse at 88% 20%,rgba(98,151,178,.35) 0 11%,transparent 12%),

'Marbury v. Madison':{unit:'Unit 2',provisions:['Article III','Article VI / Supremacy'],clauses:['Judicial review','Separation of powers'],facts:'William Marbury was appointed a justice of the peace near the end of John Adams’s presidency, but his commission was not delivered before Thomas Jefferson took office. Marbury asked the Supreme Court to order Secretary of State James Madison to deliver it.',issue:'Whether the Court could issue a writ of mandamus to require delivery of the commission, and whether the relevant part of the Judiciary Act of 1789 was constitutional.',holding:'Marbury had a right to the commission, but the Supreme Court could not issue the requested writ because the statutory provision giving it original jurisdiction for that remedy conflicted with the Constitution.',reason:'Chief Justice John Marshall reasoned that the Constitution is supreme over ordinary legislation and that courts must apply the Constitution when a statute conflicts with it. This established judicial review.',about:'The case is really about the judiciary’s authority to enforce constitutional limits and thereby check the other branches.',excerpt:'“It is emphatically the province and duty of the judicial department to say what the law is.”',notes:['Explain the dispute over Marbury’s commission.','Explain why the Court could not grant the requested remedy.','Define judicial review.','Explain how judicial review functions as a check.','Connect the case to separation of powers.','Compare Marbury with McCulloch.']},
'McCulloch v. Maryland':{unit:'Unit 1 / Unit 2',provisions:['Article I, Section 8','Article VI'],clauses:['Necessary and Proper Clause','Supremacy Clause','Federalism'],facts:'Congress created the Second Bank of the United States. Maryland imposed a tax on the Baltimore branch, and James McCulloch, the bank’s cashier, refused to pay it.',issue:'Whether Congress had constitutional authority to create the bank and whether Maryland could tax the federal institution.',holding:'Congress could use implied powers under the Necessary and Proper Clause to create the bank, and Maryland could not tax it because valid federal law is supreme over conflicting state action.',reason:'The Court read the enumerated powers together with the Necessary and Proper Clause and held that a state may not interfere with a valid federal exercise of power.',about:'McCulloch combines implied powers and federal supremacy, making it central to AP Gov federalism questions.',excerpt:'“The power to tax involves the power to destroy.”',notes:['Explain why Congress created the bank.','Explain Maryland’s challenge.','Define implied powers.','Define federal supremacy.','Connect the case to federalism.','Compare McCulloch with United States v. Lopez.']},
'Schenck v. United States':{unit:'Unit 3',provisions:['First Amendment'],clauses:['Freedom of speech','Limits on speech'],facts:'Charles Schenck distributed leaflets opposing the military draft during World War I and was prosecuted under the Espionage Act.',issue:'Whether applying the Espionage Act to Schenck violated the First Amendment.',holding:'The Court upheld his conviction and concluded that speech creating a clear and present danger could be restricted under the circumstances.',reason:'The Court considered the context and likely consequences of the expression when evaluating whether the government could punish it.',about:'Schenck illustrates that First Amendment protections are not absolute and that the context of speech can matter.',excerpt:'The Court asked whether the words were used “in such circumstances and are of such a nature as to create a clear and present danger.”',notes:['Know the wartime context.','Know what Schenck was prosecuted for.','Explain why context mattered.','Connect the case to limits on First Amendment freedoms.','Compare Schenck with Tinker.']},
'Brown v. Board of Education':{unit:'Unit 3',provisions:['Fourteenth Amendment'],clauses:['Equal Protection Clause','Civil rights'],facts:'Black students and their families challenged state laws and policies requiring racial segregation in public schools.',issue:'Whether racial segregation in public schools violated the Equal Protection Clause of the Fourteenth Amendment.',holding:'Yes. The Court held that racial segregation in public schools violates equal protection.',reason:'The Court rejected the idea that legally separated public schools could provide equality consistent with the Constitution.',about:'Brown is a foundational civil-rights case connecting equal protection, the Fourteenth Amendment, and the judiciary’s role in enforcing rights.',excerpt:'“Separate educational facilities are inherently unequal.”',notes:['Identify the challenged segregation policy.','Identify the constitutional provision.','Explain the Equal Protection connection.','Explain the civil-rights significance.','Compare Brown with Shaw v. Reno.']},
'Baker v. Carr':{unit:'Unit 1 / Unit 2 / Unit 5',provisions:['Fourteenth Amendment'],clauses:['Equal Protection Clause','Judicial review','Redistricting'],facts:'Tennessee legislative districts had not been reapportioned for decades despite major population changes, and voters challenged the resulting inequality in representation.',issue:'Whether federal courts could hear challenges to state legislative apportionment or whether such disputes were nonjusticiable political questions.',holding:'The Court held that Equal Protection challenges to legislative apportionment could be heard in federal court.',reason:'The Court distinguished claims courts could adjudicate from political questions outside judicial competence.',about:'Baker is important for understanding judicial review of representation and the distinction between justiciability and the merits of a case.',excerpt:'The decision treated the justiciability question as distinct from whether the plaintiffs would ultimately prevail.',notes:['Know why population change mattered.','Define justiciable.','Explain the political-question issue.','Connect Baker to representation.','Compare Baker with Shaw.']},
'Engel v. Vitale':{unit:'Unit 3',provisions:['First Amendment'],clauses:['Establishment Clause','Religious liberty'],facts:'A New York public-school district authorized a short, non-denominational prayer for students to recite.',issue:'Whether government-sponsored prayer in public schools violated the Establishment Clause.',holding:'Yes. The Court held that public-school sponsorship of prayer violated the Establishment Clause.',reason:'The Court focused on government involvement in religious exercise, not simply whether the prayer was denominational.',about:'Engel demonstrates that the First Amendment limits government involvement with religion and helps distinguish Establishment from Free Exercise questions.',excerpt:'The Court treated government-sponsored prayer in public schools as inconsistent with the Establishment Clause.',notes:['Know who sponsored the prayer.','Identify the constitutional clause.','Explain Establishment versus Free Exercise.','Connect the case to public schools.','Compare Engel with Yoder.']},
'Gideon v. Wainwright':{unit:'Unit 3',provisions:['Sixth Amendment','Fourteenth Amendment'],clauses:['Right to counsel','Selective incorporation'],facts:'Clarence Gideon was charged with a felony in Florida and asked the trial court to appoint an attorney. The court declined under Florida’s then-existing rule.',issue:'Whether the Sixth Amendment right to counsel applied to defendants in state felony cases.',holding:'Yes. The Court held that the right to counsel for felony defendants is fundamental and applies to the states.',reason:'The decision relied on the fundamental nature of the right and the Fourteenth Amendment’s role in applying Bill of Rights protections to state governments.',about:'Gideon is a key selective-incorporation case showing how the Fourteenth Amendment can extend Bill of Rights protections to the states.',excerpt:'The Court treated counsel for an indigent felony defendant as fundamental to a fair trial.',notes:['Know what happened in Gideon’s trial court.','Identify the Sixth Amendment right.','Explain selective incorporation.','Explain why the Fourteenth Amendment matters.','Compare Gideon with McDonald.']},
'Tinker v. Des Moines':{unit:'Unit 3',provisions:['First Amendment'],clauses:['Freedom of speech','Student speech'],facts:'Students wore black armbands to school to express opposition to the Vietnam War. School officials prohibited the armbands and suspended students who wore them.',issue:'Whether the school’s restriction violated students’ First Amendment freedom of speech.',holding:'Yes. Public-school students retain First Amendment rights, and schools need more than an unsupported fear of disruption to suppress protected expression.',reason:'The Court distinguished protected expression from conduct that materially and substantially interferes with school operations.',about:'Tinker is about balancing individual liberty with institutional authority in public schools.',excerpt:'“Students do not shed their constitutional rights to freedom of speech or expression at the schoolhouse gate.”',notes:['Know what the armbands symbolized.','Identify the First Amendment protection.','Know the disruption standard.','Explain why the expression was protected.','Compare Tinker with Schenck.']},
'New York Times Co. v. United States':{unit:'Unit 3',provisions:['First Amendment'],clauses:['Freedom of the press','Prior restraint'],facts:'The federal government sought to prevent newspapers from publishing portions of a classified history of U.S. involvement in Vietnam.',issue:'Whether the government could stop publication in advance by invoking national security.',holding:'The Court rejected the government’s attempt to impose prior restraint on publication in this case.',reason:'The government faced a heavy burden when asking a court to block publication before it occurred.',about:'The case illustrates the constitutional tension between freedom of the press and claims of national security.',excerpt:'The Court recognized a “heavy presumption against” prior restraints on publication.',notes:['Define prior restraint.','Know what the government tried to prevent.','Explain the First Amendment connection.','Explain why prior restraint matters.','Compare this case with Schenck.']},
'Wisconsin v. Yoder':{unit:'Unit 3',provisions:['First Amendment'],clauses:['Free Exercise Clause','Religious liberty'],facts:'Amish parents objected to Wisconsin’s requirement that their children attend school beyond eighth grade because of religious beliefs and practices.',issue:'Whether applying the compulsory-attendance law violated the Free Exercise Clause.',holding:'The Court held that applying the requirement to these Amish families violated the Free Exercise Clause under the circumstances.',reason:'The Court weighed the state’s interest in compulsory education against the burden on sincere religious practice.',about:'Yoder is the required AP case for Free Exercise and should be contrasted with Establishment Clause cases such as Engel.',excerpt:'The Court considered the state’s education interest alongside the substantial burden imposed on religious practice.',notes:['Know the Amish religious objection.','Identify the Free Exercise Clause.','Contrast Yoder with Engel.','Explain the competing government interest.','Apply the principle to a new scenario.']},
'Shaw v. Reno':{unit:'Unit 3 / Unit 5',provisions:['Fourteenth Amendment'],clauses:['Equal Protection Clause','Redistricting'],facts:'North Carolina created a majority-Black congressional district after federal officials objected that minority voting strength had not been adequately protected. Voters challenged the unusually shaped district.',issue:'Whether voters could challenge a districting plan when race appeared to be the predominant factor in drawing the boundaries.',holding:'Yes. Voters could bring an Equal Protection challenge when race was the predominant factor in the district’s design.',reason:'The Court treated racial classifications in districting as subject to constitutional scrutiny.',about:'Shaw concerns the constitutional limits on race-conscious redistricting and connects equal protection to elections and representation.',excerpt:'The Court recognized that districting classifications based predominantly on race can trigger Equal Protection concerns.',notes:['Know why the district was unusual.','Identify the Fourteenth Amendment.','Explain the Equal Protection issue.','Connect race to redistricting.','Compare Shaw with Baker.']},
'United States v. Lopez':{unit:'Unit 1 / Unit 2',provisions:['Article I, Section 8'],clauses:['Commerce Clause','Enumerated powers','Federalism'],facts:'A high-school student was prosecuted under a federal law making possession of a gun in a school zone a federal crime.',issue:'Whether Congress had Commerce Clause authority to prohibit gun possession in a school zone.',holding:'No. The Court held that the law exceeded Congress’s Commerce Clause power.',reason:'The Court concluded that possessing a gun in a school zone was too weakly connected to interstate commerce for the claimed federal power.',about:'Lopez demonstrates that federal power has constitutional limits and provides an important counterpoint to McCulloch.',excerpt:'The Court rejected an unlimited reading of the Commerce Clause that could reach every activity with an indirect economic connection to interstate commerce.',notes:['Know what federal law was challenged.','Identify the constitutional source of congressional power.','Explain why the Court rejected the law.','Compare Lopez with McCulloch.','Explain the federalism connection.']},
'McDonald v. Chicago':{unit:'Unit 3',provisions:['Second Amendment','Fourteenth Amendment'],clauses:['Right to keep and bear arms','Selective incorporation'],facts:'Chicago residents challenged city restrictions on handgun possession for self-defense.',issue:'Whether the Second Amendment right to keep and bear arms applied to state and local governments.',holding:'Yes. The Court held that the Second Amendment right recognized in District of Columbia v. Heller applies to the states through the Fourteenth Amendment.',reason:'The Court treated the right as fundamental and applied it against state and local governments through incorporation.',about:'McDonald connects a substantive Second Amendment right with selective incorporation through the Fourteenth Amendment.',excerpt:'The Court applied the Second Amendment right to the states through the Fourteenth Amendment.',notes:['Know the local restriction being challenged.','Identify the Second Amendment right.','Explain incorporation.','Explain why the Fourteenth Amendment matters.','Compare McDonald with Gideon.']},
'Citizens United v. FEC':{unit:'Unit 5',provisions:['First Amendment'],clauses:['Freedom of speech','Campaign finance'],facts:'Citizens United sought to distribute and promote a film about a presidential candidate close to an election, implicating federal restrictions on certain corporate-funded election communications.',issue:'Whether the government could restrict independent political spending by corporations and associations under the First Amendment.',holding:'The Court held that the government could not prohibit corporations and unions from making independent expenditures for political speech on the basis of their corporate or union identity.',reason:'The majority treated independent political spending as protected speech and rejected speaker-based restrictions on that political expression.',about:'The case connects First Amendment doctrine to elections, campaign finance, political communication, and interest groups.',excerpt:'The majority treated political speech as protected regardless of whether the speaker was a corporation, union, or individual.',notes:['Know what Citizens United sought to distribute.','Identify the First Amendment issue.','Distinguish independent expenditures from direct contributions.','Connect the case to campaign finance.','Apply the principle to a new campaign-finance scenario.']}

nt power","The federal courts controlled state governments","Congress had unlimited authority over commerce"],"correct":0,"why":"The Articles created a weak central government that depended heavily on the states and lacked strong enforcement and taxation powers."},{"id":"u1x5","unit":1,"topic":"1.5 Ratification of the U.S. Constitution","type":"passage","passage":"Federalist supporters argue that the proposed Constitution creates a government strong enough to act nationally while still limiting that power through a written constitution and divided institutions.","q":"Which Federalist argument is most directly reflected?","a":["A stronger but constitutionally limited national government was needed","The states should retain complete sovereignty","A national government should be eliminated","Direct democracy should replace representation"],"correct":0,"why":"Federalists generally supported a stronger national government with constitutional limits and separated institutions."},{"id":"u1x6","unit":1,"topic":"1.6 Principles of American Government","type":"passage","passage":"Congress writes federal laws, the president executes them, and federal courts interpret whether those laws conform to the Constitution.","q":"Which principle is most directly represented?","a":["Separation of powers","Popular sovereignty only","State nullification","Direct democracy"],"correct":0,"why":"Separation of powers distributes governmental functions among the legislative, executive, and judicial branches."},{"id":"u1x7","unit":1,"topic":"1.7 Relationship Between the States and the Federal Government","type":"passage","passage":"A state and the national government both operate within the same constitutional system, with some powers assigned to each level and some powers shared.","q":"Which concept best describes this arrangement?","a":["Federalism","Judicial supremacy over all policy","Parliamentary government","Unitary government"],"correct":0,"why":"Federalism divides power between a national government and state governments within the same political system."},{"id":"u1x8","unit":1,"topic":"1.8 Constitutional Interpretations of Federalism","type":"passage","passage":"Congress creates an institution using a constitutional power that is not listed word-for-word but is reasonably related to one of Congress's enumerated powers.","q":"Which constitutional clause most directly supports this reasoning?","a":["Necessary and Proper Clause","Establishment Clause","Equal Protection Clause","Appointments Clause"],"correct":0,"why":"The Necessary and Proper Clause permits Congress to use implied powers to carry out its enumerated responsibilities."},{"id":"u1x9","unit":1,"topic":"1.9 Federalism in Action","type":"bar","q":"A policy is funded jointly by the national government and states, and the national government attaches conditions to receiving the funds. Which federalism concept is most directly illustrated?","a":["Conditional federal grants","Judicial review","Executive privilege","Bicameralism"],"correct":0,"why":"Conditional grants are federal funds provided to states with requirements the states must meet."},{"id":"u2x1","unit":2,"topic":"2.1 Congress: The Senate and the House of Representatives","type":"passage","passage":"A proposed revenue bill begins in the House of Representatives before moving through the legislative process.","q":"Which constitutional feature explains why this bill begins in the House?","a":["Revenue bills must originate in the House","Senators serve shorter terms","The Senate confirms all spending bills","The House appoints federal judges"],"correct":0,"why":"The Constitution requires bills for raising revenue to originate in the House of Representatives."},{"id":"u2x2","unit":2,"topic":"2.2 Structures, Powers, and Functions of Congress","type":"passage","passage":"A congressional committee conducts hearings and gathers information about an agency's implementation of a federal law.","q":"Which congressional function is most directly illustrated?","a":["Oversight","Judicial review","Treaty ratification by the courts","Executive privilege"],"correct":0,"why":"Congressional oversight allows Congress to monitor executive agencies and implementation of laws."},{"id":"u2x3","unit":2,"topic":"2.3 Congressional Behavior","type":"poll","q":"A representative votes for a policy favored by many constituents even though the representative personally disagrees with it. Which congressional behavior is most directly represented?","a":["Responsiveness to constituents","Judicial independence","Executive privilege","Bureaucratic adjudication"],"correct":0,"why":"Members of Congress may adjust their positions or votes to respond to constituent preferences."},{"id":"u2x4","unit":2,"topic":"2.4 Roles and Powers of the Presidency","type":"passage","passage":"The president directs executive agencies to implement and administer federal laws passed by Congress.","q":"Which presidential role is most directly illustrated?","a":["Chief executive","President pro tempore","Chief justice","Speaker of the House"],"correct":0,"why":"The president is the chief executive responsible for carrying out federal laws."},{"id":"u2x5","unit":2,"topic":"2.5 Checks on the Presidency","type":"passage","passage":"The Senate refuses to confirm a president's nominee for a federal position.","q":"Which constitutional check is being used?","a":["Senate advice and consent","Judicial review","The veto power","Impeachment by the Supreme Court"],"correct":0,"why":"The Senate shares the appointment power by providing advice and consent for many presidential nominations."},{"id":"u2x6","unit":2,"topic":"2.6 Expansion of Presidential Power","type":"passage","passage":"During a national crisis, a president takes unilateral executive action and argues that rapid action is necessary because Congress is not acting quickly.","q":"Which course concept is most relevant to analyzing this action?","a":["Expansion of presidential power","Bicameralism","Selective incorporation","Judicial review of state constitutions"],"correct":0,"why":"AP Gov asks students to evaluate how presidents have expanded or used executive power, especially during emergencies."},{"id":"u2x7","unit":2,"topic":"2.7 Presidential Communication","type":"poll","q":"A president uses televised remarks and social media to build public support for a proposed law before Congress votes on it. Which concept is most directly illustrated?","a":["Going public","Selective incorporation","Judicial restraint","Federal preemption"],"correct":0,"why":"Going public is the strategy of appealing directly to the public to build political support for presidential goals."},{"id":"u3x1","unit":3,"topic":"3.1 The Bill of Rights","type":"passage","passage":"A student is accused of a crime and argues that the government must follow constitutional protections during the criminal process.","q":"Which general constitutional feature is most directly relevant?","a":["The Bill of Rights and protections for individual liberties","The Electoral College","The Commerce Clause","The Necessary and Proper Clause"],"correct":0,"why":"The Bill of Rights protects individuals from particular forms of government action, including protections in criminal procedure."},{"id":"u3x2","unit":3,"topic":"3.2 First Amendment Freedoms","type":"passage","passage":"A public school allows peaceful political expression but restricts speech that materially disrupts school operations.","q":"Which required case provides the strongest connection?","a":["Tinker v. Des Moines","McCulloch v. Maryland","United States v. Lopez","Baker v. Carr"],"correct":0,"why":"Tinker addresses student speech and recognizes that schools may regulate expression in circumstances involving substantial disruption."},{"id":"u3x3","unit":3,"topic":"3.3 Second Amendment Rights","type":"passage","passage":"A city ordinance is challenged on the ground that it prevents individuals from possessing firearms for lawful self-defense.","q":"Which constitutional amendment is most directly implicated?","a":["Second Amendment","First Amendment","Fifth Amendment","Tenth Amendment"],"correct":0,"why":"The Second Amendment addresses the right to keep and bear arms."},{"id":"u3x4","unit":3,"topic":"3.5 Selective Incorporation","type":"passage","passage":"A constitutional protection originally contained in the Bill of Rights is applied to state and local governments through the Fourteenth Amendment.","q":"What process is being described?","a":["Selective incorporation","Prior restraint","Federalism","Senatorial courtesy"],"correct":0,"why":"Selective incorporation applies provisions of the Bill of Rights to the states through the Fourteenth Amendment."},{"id":"u3x5","unit":3,"topic":"3.7 Freedom of Religion","type":"passage","passage":"A public school requires students to participate in a government-composed prayer at the start of the school day.","q":"Which constitutional provision is most directly implicated?","a":["Establishment Clause","Second Amendment","Equal Protection Clause","Supremacy Clause"],"correct":0,"why":"The Establishment Clause limits government actions that establish or endorse religion."},{"id":"u3x6","unit":3,"topic":"3.11 Gender, Race, and Equal Protection","type":"passage","passage":"A state policy is challenged because it treats people differently based on race.","q":"Which constitutional provision is at the center of the challenge?","a":["Equal Protection Clause of the Fourteenth Amendment","Necessary and Proper Clause","Privileges and Immunities Clause of Article IV only","Appointments Clause"],"correct":0,"why":"The Fourteenth Amendment's Equal Protection Clause is central to challenges involving racial classifications by state governments."},{"id":"u4x1","unit":4,"topic":"4.1 American Attitudes About Government and Politics","type":"poll","q":"Two surveys show that most respondents support democratic institutions, but support for a particular policy changes after a major event. What is the best conclusion?","a":["Public attitudes can remain stable on broad values while changing on specific issues","Public opinion never changes","The event automatically caused the opinion shift","The surveys measure only voter turnout"],"correct":0,"why":"Americans can hold relatively stable general principles while changing views about specific policies or events."},{"id":"u4x2","unit":4,"topic":"4.2 Political Socialization","type":"passage","passage":"A student develops political attitudes influenced by family discussions, school experiences, peers, and major political events.","q":"Which process is most directly illustrated?","a":["Political socialization","Judicial review","Federal preemption","Bicameralism"],"correct":0,"why":"Political socialization is the process through which people develop and acquire political attitudes and beliefs."},{"id":"u4x3","unit":4,"topic":"4.3 Changes in Ideology","type":"poll","q":"A long-term survey shows that the distribution of ideological self-identification changes across generations. Which concept best fits the finding?","a":["Ideological change across time","Selective incorporation","Federalism","Judicial review"],"correct":0,"why":"Political ideology can shift across generations and historical periods."},{"id":"u4x4","unit":4,"topic":"4.4 Influence of Political Ideologies on Policy","type":"passage","passage":"One coalition favors a larger federal role in providing social programs, while another favors reducing the national government's role and emphasizing individual responsibility.","q":"What does the disagreement most directly demonstrate?","a":["Political ideologies can influence policy preferences","Judicial review determines all policy preferences","Federalism eliminates ideological disagreement","Campaign finance laws determine ideology"],"correct":0,"why":"Ideological beliefs influence how groups evaluate government action and preferred public policies."},{"id":"u4x5","unit":4,"topic":"4.5 Political Ideology and Economic Policy","type":"passage","passage":"A policymaker argues that lower taxes and reduced government spending will encourage private economic activity.","q":"Which broad ideological position is most consistent with this argument?","a":["A preference for a more limited government role in the economy","A preference for abolishing private markets","A preference for mandatory nationalization of all businesses","A requirement for direct democracy"],"correct":0,"why":"A preference for lower taxes and less government economic intervention is commonly associated with a more limited-government economic approach."},{"id":"u4x6","unit":4,"topic":"4.6 Political Ideology and Social Policy","type":"passage","passage":"A group argues that government should intervene to address unequal outcomes in society, while another emphasizes individual choice and limited government intervention.","q":"Which course concept is most directly illustrated?","a":["Ideological differences over social policy","Judicial review","Bicameralism","Federal supremacy"],"correct":0,"why":"Political ideologies help shape competing views about the proper government role in social policy."},{"id":"u4x7","unit":4,"topic":"4.1 American Attitudes About Government and Politics","type":"poll","q":"A poll reports that 58% favor a policy, but the result changes to 46% after respondents read a different description of the policy. Which factor is most relevant to evaluating the difference?","a":["Question wording and framing","Judicial review","The number of Supreme Court justices","The Electoral College"],"correct":0,"why":"Question wording and framing can affect measured public opinion."},{"id":"u4x8","unit":4,"topic":"4.5 Political Ideology and Economic Policy","type":"bar","q":"A graph shows support for a proposed tax increase is higher among respondents who identify with one ideological group than another. What can the graph support?","a":["An association between ideological identification and policy preference","Proof that ideology causes every individual vote","A conclusion about every American without considering the sample","Evidence about judicial review"],"correct":0,"why":"The graph can support an association in the measured population, but not automatically prove causation or universal behavior."},{"id":"u5x1","unit":5,"topic":"5.1 Voting Rights and Models of Voting Behavior","type":"passage","passage":"A voter compares the policy positions of candidates and chooses the candidate whose positions are closest to the voter's own views.","q":"Which model of voting behavior is most directly illustrated?","a":["Rational-choice or issue voting","Party-line voting only","Random voting","Judicial voting"],"correct":0,"why":"Issue voting involves choosing candidates based on their positions on policies that matter to the voter."},{"id":"u5x2","unit":5,"topic":"5.2 Voter Turnout","type":"poll","q":"A community has relatively high registration but much lower participation on Election Day. Which factor could help explain the turnout gap?","a":["Differences in motivation, convenience, or perceived importance of the election","The existence of judicial review","The Necessary and Proper Clause","The number of Supreme Court cases"],"correct":0,"why":"Registration alone does not guarantee turnout; motivation, barriers, and perceptions of the election can affect participation."},{"id":"u5x3","unit":5,"topic":"5.5 Interest Groups and Lobbying","type":"passage","passage":"An environmental organization provides research to legislators, meets with congressional staff, and asks supporters to contact their representatives.","q":"Which interest-group strategy is most directly illustrated?","a":["Lobbying combined with grassroots mobilization","Judicial review","Senate advice and consent","Executive privilege"],"correct":0,"why":"Interest groups can lobby officials directly while also mobilizing members and the public."},{"id":"u5x4","unit":5,"topic":"5.8 The Media","type":"passage","pas {id:'pool3',unit:1,topic:'1.4 Challenges of the Articles of Confederation',q:'Which weakness of the Articles of Confederation most directly limited the national government’s ability to address national financial problems?',a:['Congress lacked power to tax directly','The president could veto all state laws','The Supreme Court controlled state legislatures','Congress had unlimited power over commerce'],correct:0,why:'The Articles did not give Congress a dependable national taxing power, making revenue difficult to raise.'},
{id:'pool4',unit:1,topic:'1.5 Ratification of the U.S. Constitution',type:'passage',passage:'A Federalist argues that a large republic can make it harder for a single faction to dominate national policymaking because many interests will compete for influence.',q:'The argument most directly supports which idea?',a:['Pluralism can limit the influence of a single faction','Direct democracy always produces better policy','State governments should control foreign policy','The judiciary should select members of Congress'],correct:0,why:'Federalist arguments about competing interests describe pluralism as a way to prevent one faction from dominating.'},
{id:'pool5',unit:1,topic:'1.6 Principles of American Government',q:'Which constitutional principle is most directly demonstrated when voters can replace elected officials through regular elections?',a:['Popular sovereignty','Judicial review','Federal supremacy','Executive privilege'],correct:0,why:'Popular sovereignty means governmental authority ultimately rests with the people.'},
{id:'pool6',unit:1,topic:'1.8 Constitutional Interpretations of Federalism',q:'A federal law conflicts with a valid state law. Which constitutional principle supports giving the federal law controlling authority?',a:['Supremacy Clause','Establishment Clause','Equal Protection Clause','Speech or Debate Clause'],correct:0,why:'The Supremacy Clause establishes that the Constitution and valid federal laws take priority over conflicting state law.'},
{id:'pool7',unit:1,topic:'1.9 Federalism in Action',type:'poll',passage:'A state and the national government both fund a transportation project, while federal rules require the project to meet national standards.',q:'The arrangement most directly illustrates which feature of federalism?',a:['Intergovernmental cooperation','Judicial independence','Unitary government','Executive privilege'],correct:0,why:'Shared funding and overlapping responsibilities are examples of cooperative/intergovernmental federalism.'},
{id:'pool8',unit:2,topic:'2.1 Congress: The Senate and the House of Representatives',q:'Which difference between the House and Senate is most directly connected to their constitutional design?',a:['The House is based on population while each state has equal Senate representation','The Senate has two members per district while the House has one per state','Only the House can confirm judicial appointments','Only the Senate introduces revenue bills'],correct:0,why:'House representation is population-based, while the Senate gives each state equal representation.'},
{id:'pool9',unit:2,topic:'2.2 Structures, Powers, and Functions of Congress',q:'Which power is explicitly assigned to Congress by Article I?',a:['The power to tax','The power to declare laws unconstitutional','The power to appoint all federal judges','The power to command state militias in every circumstance'],correct:0,why:'Article I grants Congress enumerated powers including taxation.'},
{id:'pool10',unit:2,topic:'2.3 Congressional Behavior',q:'A member of Congress changes a position after hearing that constituents strongly oppose the proposal. Which model of representation is most directly reflected?',a:['Delegate representation','Judicial review','Federalism','Executive privilege'],correct:0,why:'A delegate follows the expressed preferences of constituents.'},
{id:'pool11',unit:2,topic:'2.4 Roles and Powers of the Presidency',q:'Which presidential action is an example of the president carrying out a law passed by Congress?',a:['Directing an executive agency to implement statutory requirements','Declaring a law unconstitutional','Ratifying a constitutional amendment alone','Electing members of the House'],correct:0,why:'The executive branch is responsible for enforcing and implementing federal law.'},
{id:'pool12',unit:2,topic:'2.5 Checks on the Presidency',q:'Why does Senate confirmation of executive appointments function as a check on presidential power?',a:['It gives another branch a role in approving key appointments','It allows the Senate to command the military','It lets Congress rewrite court opinions','It gives the president authority over state judges'],correct:0,why:'Advice and consent gives the Senate a constitutional role in approving major presidential appointments.'},
{id:'pool13',unit:2,topic:'2.6 Expansion of Presidential Power',q:'Which development can increase presidential influence over policymaking when Congress has not enacted a detailed statute?',a:['Use of executive actions within existing legal authority','Elimination of judicial review','Abolition of congressional oversight','Removal of federalism'],correct:0,why:'Presidents can use executive actions within existing legal authority, although courts and Congress can place limits.'},
{id:'pool14',unit:2,topic:'2.7 Presidential Communication',type:'passage',passage:'A president uses a televised address to frame a policy proposal as a response to a national concern and encourages citizens to contact their representatives.',q:'The communication most directly attempts to use the presidency’s role as a:',a:['Bully pulpit to shape public opinion','Judicial body to issue precedent','Legislative committee to mark up bills','State institution to administer elections'],correct:0,why:'The bully pulpit refers to using the visibility and communication power of the presidency to influence public opinion and policy.'},
{id:'pool15',unit:2,topic:'2.8 The Judicial Branch',q:'Which principle allows courts to invalidate a law that conflicts with the Constitution?',a:['Judicial review','Senate cloture','Executive privilege','Federal grants'],correct:0,why:'Judicial review is the authority of courts to determine whether government actions conform to the Constitution.'},
{id:'pool16',unit:2,topic:'2.10 The Court in Action',q:'Why might the Supreme Court choose to grant certiorari in a case involving a conflict among lower courts?',a:['To resolve an important legal disagreement with a national ruling','To write the federal budget','To appoint members of Congress','To conduct presidential elections'],correct:0,why:'The Court may hear cases when an important legal issue needs an authoritative resolution.'},
{id:'pool17',unit:2,topic:'2.11 Checks on the Judicial Branch',q:'Which action is a constitutional method of limiting federal judicial power?',a:['Congress can establish and regulate the jurisdiction of lower federal courts','The president can reverse any Supreme Court decision','States can remove federal judges by majority vote','The Court can veto congressional elections'],correct:0,why:'Congress has constitutional authority to establish lower federal courts and regulate aspects of their jurisdiction.'},
{id:'pool18',unit:2,topic:'2.12 The Bureaucracy',q:'Why do federal agencies often develop specialized expertise?',a:['They employ officials who focus on particular policy areas and administer complex programs','They are elected by the public every two years','They are exempt from congressional oversight','They replace all state governments'],correct:0,why:'Bureaucratic specialization allows agencies to develop expertise needed to implement complex policies.'},
{id:'pool19',unit:2,topic:'2.14 Holding the Bureaucracy Accountable',q:'Which congressional action is most directly an example of oversight?',a:['Holding a hearing to question an agency about how it implemented a law','Issuing a Supreme Court opinion','Electing a state governor','Ratifying a constitutional amendment without state action'],correct:0,why:'Oversight includes congressional review, hearings, and investigations of executive branch implementation.'},
{id:'pool20',unit:3,topic:'3.1 The Bill of Rights',q:'What is the main purpose of the Bill of Rights?',a:['To protect individual liberties from government infringement','To create the Electoral College','To establish political parties','To organize the executive departments'],correct:0,why:'The Bill of Rights lists protections for individual liberties and limits on government power.'},
{id:'pool21',unit:3,topic:'3.2 First Amendment: Freedom of Religion',q:'A public school prevents an official teacher-led prayer. Which constitutional principle is most directly implicated?',a:['The Establishment Clause','The Commerce Clause','The Supremacy Clause','The Takings Clause'],correct:0,why:'The Establishment Clause limits government actions that establish or endorse religion.'},
{id:'pool22',unit:3,topic:'3.3 First Amendment: Freedom of Speech',q:'Which standard is most relevant when government regulates protected expression based on its content?',a:['Content-based restrictions generally receive strict scrutiny','All content-based restrictions are automatically constitutional','Only economic speech is protected','The Tenth Amendment decides the issue'],correct:0,why:'Content-based restrictions on protected speech generally trigger strict scrutiny.'},
{id:'pool23',unit:3,topic:'3.4 First Amendment: Freedom of the Press',q:'Which action would most directly raise a First Amendment press concern?',a:['Government attempting to prevent publication before it occurs','A newspaper choosing its headline','A reporter interviewing a public official','A publisher correcting an error'],correct:0,why:'Prior restraint involves government blocking publication before it occurs and raises serious First Amendment concerns.'},
{id:'pool24',unit:3,topic:'3.7 Selective Incorporation',q:'What does selective incorporation refer to?',a:['Applying protections in the Bill of Rights to the states through the Fourteenth Amendment','Allowing Congress to remove Supreme Court justices','Giving states power to override federal law','Applying only Article I to local governments'],correct:0,why:'Selective incorporation used the Fourteenth Amendment to apply many Bill of Rights protections to the states.'},
{id:'pool25',unit:3,topic:'3.8 Amendments: Due Process and the Rights of the Accused',q:'Which amendment protects an accused person from being compelled to testify against themself in a criminal case?',a:['Fifth Amendment','Second Amendment','Ninth Amendment','Twenty-Fourth Amendment'],correct:0,why:'The Fifth Amendment includes protection against compelled self-incrimination.'},
{id:'pool26',unit:3,topic:'3.10 Social Movements and Equal Protection',type:'passage',passage:'A student group challenges a policy that treats people differently based on race and argues that government must justify the classification under constitutional equality principles.',q:'Which constitutional provision is most directly relevant?',a:['Equal Protection Clause of the Fourteenth Amendment','Third Amendment','Appointments Clause','Origination Clause'],correct:0,why:'The Equal Protection Clause prohibits states from denying equal protection of the laws.'},
{id:'pool27',unit:3,topic:'3.12 Balancing Minority and Majority Rights',q:'Why can judicial review be important in protecting minority rights?',a:['Courts can enforce constitutional protections even when a majority-supported law infringes them','Courts can replace all elected officials','Courts can create taxes without legislation','Courts can eliminate federalism'],correct:0,why:'Judicial review can require government to comply with constitutional protections even when a law has majority support.'},
{id:'pool28',unit:4,topic:'4.2 Political Socialization',q:'Which institution is commonly identified as an important agent of political socialization?',a:['Family','The Federal Reserve only','The Supreme Court alone','A federal jury only'],correct:0,why:'Family is a major early influence on political attitudes, along with school, peers, media, and other institutions.'},
{id:'pool29',unit:4,topic:'4.5 Measuring Public Opinion',q:'A poll uses a random sample designed to represent the population. What is the main benefit?',a:['It can reduce selection bias and improve generalizability','It guarantees every person will agree','It eliminates sampling error completely','It converts opinions into constitutional law'],correct:0,why:'Representative random sampling can improve the ability to generalize poll findings to the broader population.'},
{id:'pool30',unit:4,topic:'4.6 Evaluating Public Opinion Data',type:'poll',passage:'Poll A reports 52% support with a margin of error of ±3 percentage points. Poll B reports 57% support with the same margin of error.',q:'Which conclusion is most defensible from the reported results?',a:['The estimates overlap enough that the polls do not establish a certain five-point difference','Poll B proves the policy has majority support','Poll A has no sampling error','The two polls must have used identical respondents'],correct:0,why:'With the same ±3 margin of error, the plausible ranges overlap, so the reported difference should be interpreted cautiously.'},

{id:'pool32',unit:4,topic:'4.10 Ideology and Social Policy',q:'Which issue is most directly an example of social policy?',a:['Government rules concerning marriage, education, or abortion','The length of a Senate term','The number of Supreme Court justices','The location of the Capitol'],correct:0,why:'Social policy concerns government responses to social issues and relationships in society.'},
{id:'pool33',unit:5,topic:'5.1 Voting Rights and Models of Voting Behavior',q:'A voter supports a candidate mainly because the voter approves of the candidate’s recent performance in office. Which voting model is most directly illustrated?',a:['Retrospective voting','Random voting','Judicial voting','Federalist voting'],correct:0,why:'Retrospective voting evaluates candidates based on their past performance.'},

{id:'pool35',unit:5,topic:'5.3 Political Parties',q:'Which function is commonly performed by political parties?',a:['Recruiting candidates and organizing voters','Issuing Supreme Court decisions','Administering federal courts','Writing constitutional amendments alone'],correct:0,why:'Political parties recruit candidates, mobilize voters, coordinate campaigns, and organize government.'},
{id:'pool36',unit:5,topic:'5.6 Interest Groups Influencing Policymaking',q:'Why might an interest group provide information to lawmakers?',a:['To influence policy by supplying specialized knowledge and arguments','To replace congressional elections','To appoint federal judges','To enforce criminal laws'],correct:0,why:'Interest groups use lobbying, research, and information to influence policymakers.'},

{id:'pool40',unit:5,topic:'5.11 Campaign Finance',q:'What is one constitutional issue commonly associated with campaign finance?',a:['Balancing regulation of political spending with First Amendment protections','Determining the number of senators per state','Choosing Supreme Court justices by popular vote','Applying the Third Amendment to elections'],correct:0,why:'Campaign finance regulation raises questions about political expression and First Amendment rights.'},
{id:'pool41',unit:5,topic:'5.12 The Media',type:'passage',passage:'A news organization gives substantial coverage to one political issue over several weeks, increasing the amount of attention the public gives to that issue.',q:'Which concept is most directly illustrated?',a:['Agenda setting','Federalism','Selective incorporation','Judicial restraint'],correct:0,why:'Agenda setting describes the media’s influence over which issues receive public attention.'},
{id:'pool42',unit:5,topic:'5.13 Changing Media',q:'How has the growth of digital media changed political communication?',a:['It allows information to circulate quickly through many decentralized sources','It requires every message to pass through one national broadcaster','It eliminates political polarization','It prevents citizens from creating political content'],correct:0,why:'Digital media allows rapid, decentralized creation and distribution of political information.'},

function seededShuffle(arr,seed){const a=[...arr];let x=seed>>>0;for(let i=a.length-1;i>0;i--){x=(x*1664525+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildExamForms(){
 const all=[...qBank,...advancedBank,...examExtraBank,...examGeneratedBank].filter((q,i,a)=>a.findIndex(z=>z.id===q.id)===i);
 const pools={1:all.filter(q=>String(q.unit)==='1'),2:all.filter(q=>String(q.unit)==='2'),3:all.filter(q=>String(q.unit)==='3'),4:all.filter(q=>String(q.unit)==='4'),5:all.filter(q=>String(q.unit)==='5')};
 const counts=[10,17,8,6,14]; const forms={}; const used={1:new Set(),2:new Set(),3:new Set(),4:new Set(),5:new Set()};
 Object.keys(versionNamesForForms()).forEach((letter,fi)=>{
   const mcq=[];
   [1,2,3,4,5].forEach((u,idx)=>{
     const need=counts[idx]; const candidates=seededShuffle(pools[u].filter(q=>!used[u].has(q.id)),(fi+1)*1000+u*97);
     const take=candidates.slice(0,need); take.forEach(q=>used[u].add(q.id)); mcq.push(...take);
   });
   forms[letter]={name:versionNamesForForms()[letter],mcq,frq:examGeneratedFrqs.slice(fi*4,fi*4+4)};
 });
 return forms;
}

function buildCustomSession(){const topics=(state.customPath&&state.customPath.topics)||[];if(!topics.length){go('path');setTimeout(()=>document.getElementById('customPathBuilder')?.scrollIntoView({behavior:'smooth'}),40);return;}const selectedUnits=[...new Set(topics.map(k=>String(k.split('::')[0])))];const all=[...qBank,...advancedBank].filter((q,i,a)=>a.findIndex(z=>z.id===q.id)===i);const exact=all.filter(q=>topics.includes(`${q.unit}::${q.topic}`));const sameUnits=all.filter(q=>selectedUnits.includes(String(q.unit))&&!exact.some(x=>x.id===q.id));const bridge=all.filter(q=>!selectedUnits.includes(String(q.unit))&&!exact.some(x=>x.id===q.id)&&!sameUnits.some(x=>x.id===q.id));const recent=new Set((state.practiceHistory||[]).slice(-24));const fresh=group=>{const f=group.filter(q=>!recent.has(q.id));return f.length?f:group};let pool=[...shuffle(fresh(exact)),...shuffle(fresh(sameUnits)),...shuffle(fresh(bridge))];let mcq=pool.slice(0,25);if(mcq.length<25){const fallback=shuffle(all.filter(q=>!mcq.some(x=>x.id===q.id)));mcq=[...mcq,...fallback];}mcq=mcq.slice(0,25);let frqPool=frqs.filter(f=>selectedUnits.includes(String(f.unit)));let frq=[...shuffle(frqPool),...shuffle(frqs.filter(f=>!selectedUnits.includes(String(f.unit))))];const seenFrq=new Set();frq=frq.filter(f=>!seenFrq.has(f.id)&&seenFrq.add(f.id)).slice(0,3);if(frq.length<2)frq=[...frqs].slice(0,3);customSession={stage:'mcq',mcq,frq,frqResults:{},index:0,totalMcq:mcq.length,mcqAnswered:0,mcqScore:0,started:false,savedResult:false};practiceMode='custom';practiceReady=true;selected=null;practiceIndex=0;go('practice');practiceArea();}
function customPracticeCard(){if(!customSession)return `<div class="practice-lobby"><h2>Ready?</h2><p class="muted">Your custom exam will mix multiple-choice and FRQ work from the topics you selected.</p><button class="btn primary" data-begin-custom>Set up my custom exam →</button></div>`;if(!customSession.started)return `<div class="practice-lobby"><div class="lobby-grid"><div><span class="pill">CUSTOM PRACTICE EXAM</span><h2 style="margin-top:10px">Ready to begin?</h2><p class="lead">Your personalized review is prepared from the subsections you selected.</p><div class="custom-exam-summary"><div><strong>25</strong><span>multiple-choice questions</span></div><div><strong>${customSession.frq.length}</strong><span>free-response questions</span></div><div><strong>${(state.customPath&&state.customPath.topics||[]).length}</strong><span>targeted subsections</span></div></div><div class="practice-note"><strong>How this works:</strong> targeted questions come first, followed by related course questions so you can practice connections rather than memorize one subsection in isolation.</div><div class="row" style="margin-top:16px"><button class="btn primary" data-begin-custom-run aria-label="Begin my custom practice exam">Begin my custom practice exam →</button><button class="btn secondary" data-go="path">Edit my path</button></div></div><div class="lobby-card custom-ready-card"><div class="eyebrow">BEFORE YOU START</div><h3>Clear the page. Focus on one response at a time.</h3><p class="muted">Questions stay hidden until you press Begin. You will move through 25 MCQs and then your FRQs.</p><div class="ready-rule"><span></span><span></span><span></span></div></div></div></div>`;if(customSession.stage==='mcq'){const x=customSession.mcq[customSession.index];if(!x){customSession.stage='frq';customSession.index=0;return customPracticeCard();}return `<div class="assessment-frame"><div class="assessment-top"><div class="qnum">Custom exam · MCQ ${customSession.index+1} of ${customSession.mcq.length}</div><span class="pill">${esc(x.topic)}</span></div><div class="assessment-body"><main class="assessment-main"><div class="question-label">Question</div><div class="question">${esc(x.q)}</div>${x.passage?`<div class="stimulus" style="margin-top:14px">${esc(x.passage)}</div>`:''}<div style="margin-top:14px">${x.a.map((a,i)=>`<button class="choice ap-choice ${selected===i?'selected':''}" data-custom-choice="${i}"><span class="choice-letter">${String.fromCharCode(65+i)}.</span><span>${esc(a)}</span></button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn" data-custom-check>Check answer</button><button class="btn secondary" data-custom-next>Next</button></div><div id="customFeedback"></div></main><aside class="assessment-side"><div class="eyebrow">CUSTOM ROUTE</div><h3>You chose</h3><div class="path-summary">${((state.customPath&&state.customPath.topics)||[]).slice(0,8).map(k=>`<span class="path-chip">${esc(k.split('::')[1])}</span>`).join('')}</div><p class="small muted">The set mixes your selected topics so you can practice connections instead of memorizing one subsection in isolation.</p></aside></div></div>`;}const f=customSession.frq[customSession.index];if(!f){const frqEntries=Object.values(customSession.frqResults||{}).map(x=>x.result||x);const frqTotal=frqEntries.reduce((n,r)=>n+(r.total||0),0);const frqMax=frqEntries.reduce((n,r)=>n+(r.max||0),0);const mcqPct=customSession.totalMcq?Math.round((customSession.mcqScore||0)/customSession.totalMcq*100):0;if(!customSession.savedResult){state.customExamResults=state.customExamResults||[];state.customExamResults.push({date:new Date().toISOString(),mcqScore:customSession.mcqScore||0,mcqMax:customSession.totalMcq||25,frqScore:frqTotal,frqMax,topics:(state.customPath&&state.customPath.topics)||[]});state.customExamResults=state.customExamResults.slice(-10);customSession.savedResult=true;save();}return `<div class="card"><span class="pill">CUSTOM EXAM COMPLETE</span><h2 style="margin-top:10px">You finished your custom review.</h2><p class="lead">Your results are now recorded on this device so you can compare practice performance over time.</p><div class="custom-exam-summary"><div><strong>${customSession.mcqScore||0}/${customSession.totalMcq}</strong><span>MCQ score · ${mcqPct}%</span></div><div><strong>${frqTotal}/${frqMax||0}</strong><span>FRQ practice points recorded</span></div><div><strong>${(state.customPath&&state.customPath.topics||[]).length}</strong><span>targeted subsections</span></div></div><div class="row" style="margin-top:16px"><button class="btn" data-go="progress">View Learning &amp; Progress →</button><button class="btn secondary" data-go="path">Return to Learning Path</button></div></div>`;}const saved=customSession.frqResults[f.id]||{};return `<div class="frq-studio"><div class="card"><span class="pill">CUSTOM EXAM · FRQ ${customSession.index+1} of ${customSession.frq.length}</span><h2 style="margin-top:10px">${esc(f.title)}</h2><p class="muted">Complete all parts, then submit when you are ready.</p></div>${f.parts.map(p=>`<details class="frq-part" ${p[0]==='A'?'open':''}><summary><strong>Part ${p[0]}</strong> · ${esc(p[1])}</summary><div class="frq-part-body"><p>${esc(p[1])}</p><textarea class="notes frq-response" data-custom-frq="${p[0]}" placeholder="Write your response here...">${esc(saved.responses?.[p[0]]||'')}</textarea></div></details>`).join('')}<div class="frq-submit-bar"><button class="btn" data-custom-frq-submit>Submit FRQ</button><button class="btn secondary" data-custom-frq-next>Next FRQ</button></div><div id="customFrqFeedback">${saved.result?renderFrqResults(saved.result):''}</div></div>`;}
function buildBaselineSession(){
 const all=[...qBank,...advancedBank].filter((q,i,a)=>a.findIndex(z=>z.id===q.id)===i);
 const selectedByUnit=[];
 units.forEach(u=>{const pool=shuffle(all.filter(q=>String(q.unit)===String(u.id)));selectedByUnit.push(...pool.slice(0,4));});
 const mcq=shuffle(selectedByUnit).slice(0,20);
 const frq=shuffle(frqs).slice(0,2);
 baselineSession={stage:'mcq',mcq,frq,index:0,correct:0,answered:0,unitStats:{},frqResults:{},started:false,saved:false};
 practiceMode='baseline';practiceReady=true;practiceIndex=0;selected=null;
 go('practice');practiceArea();
}
function completeBaselineFrq(){
 const f=baselineSession&&baselineSession.frq&&baselineSession.frq[baselineSession.index];
 if(!f)return;
 const responses={};
 f.parts.forEach(p=>{const el=document.querySelector(`[data-baseline-frq="${p[0]}"]`);responses[p[0]]=el?el.value:''});
 if(baselineSession.frqResults[f.id])return;
 const result={f,total:0,max:f.parts.length,parts:{}};
 f.parts.forEach(p=>{const g=gradeFrqPart(f,p,responses[p[0]]);result.parts[p[0]]=g;result.total+=g.score});
 baselineSession.frqResults[f.id]={result,responses};
}
function finishBaseline(){
 const total=baselineSession.mcq.length,correct=baselineSession.correct,overall=total?Math.round(correct/total*100):0;
 const unitScores=Object.fromEntries(units.map(u=>{const a=baselineSession.unitStats[String(u.id)]||{n:0,c:0};return [String(u.id),a.n?Math.round(a.c/a.n*100):0]}));
 const frqEntries=Object.values(baselineSession.frqResults||{}).map(x=>x.result||x);
 const frqTotal=frqEntries.reduce((n,r)=>n+(r.total||0),0),frqMax=frqEntries.reduce((n,r)=>n+(r.max||0),0);
 if(!baselineSession.saved){
  const entry={date:new Date().toISOString(),mcqScore:correct,mcqMax:total,overall,unitScores,frqScore:frqTotal,frqMax};
  state.baselineHistory=Array.isArray(state.baselineHistory)?state.baselineHistory:[];
  state.baselineHistory.push(entry);
  if(!state.baseline)state.baseline=entry;
  state.baselineHistory=state.baselineHistory.slice(-10);
  baselineSession.saved=true;save();
 }
 return `<div class="card"><span class="pill">BASELINE COMPLETE</span><h2 style="margin-top:10px">Your starting point is recorded.</h2><p class="lead">This diagnostic now feeds the Course Understanding bars in Learning &amp; Progress. Your first completed baseline remains the reference point even if you retake the diagnostic later.</p><div class="custom-exam-summary"><div><strong>${correct}/${total}</strong><span>MCQ score · ${overall}%</span></div><div><strong>${frqTotal}/${frqMax||0}</strong><span>FRQ diagnostic points</span></div><div><strong>${Object.keys(unitScores).length}</strong><span>units measured</span></div></div><div class="section"><h3>Course Understanding</h3><div class="baseline-bars">${units.map(u=>{const v=unitScores[String(u.id)]||0;return `<div class="baseline-bar-row"><div class="row" style="justify-content:space-between"><strong>Unit ${u.id} · ${esc(u.name)}</strong><strong>${v}%</strong></div><div class="progress"><span style="width:${v}%"></span></div></div>`}).join('')}</div></div><div class="row" style="margin-top:18px"><button class="btn" data-go="progress">View Learning &amp; Progress →</button><button class="btn secondary" data-mode="baseline">Return to baseline</button></div></div>`;
}
function baselineQuestionCard(){

}

raBank])));if(!sourceBank.length)return `<div class="card"><h2>No questions available yet</h2><p class="muted">This practice mode is ready for more items.</p></div>`;if(practiceIndex>=sourceBank.length){const m=mixedSession||{};const pct=m.size?Math.round((m.correct/m.size)*100):0;return `<div class="card"><span class="pill">MIXED PRACTICE COMPLETE</span><h2 style="margin-top:10px">You finished this review set.</h2><div class="custom-exam-summary"><div><strong>${m.correct||0}/${m.size||sourceBank.length}</strong><span>correct</span></div><div><strong>${pct}%</strong><span>accuracy</span></div><div><strong>${m.size||sourceBank.length}</strong><span>questions</span></div></div><div class="row" style="margin-top:16px"><button class="btn" data-mode="test">Choose another length</button><button class="btn secondary" data-go="progress">View progress →</button></div></div>`;}const x=sourceBank[Math.min(practiceIndex,sourceBank.length-1)];const anns=(state.annotations&&state.annotations[x.id])||[];let stimulus='';

function recallLev(a,b){a=String(a||'');b=String(b||'');if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<cur.length;j++)prev[j]=cur[j]}return prev[b.length]}
