<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Trek: Decisions That Made History</title>
<style>
  :root{
    color-scheme: light;
    --cream:#F5EDE0; --card:#FBF6EE; --brown:#3D2B1F; --brown-soft:#6B5847;
    --clay:#C6704F; --clay-dark:#A85A3D; --clay-darker:#8C4830; --sage:#7A8B69; --sage-dark:#4F5F42; --gold:#D4A24C;
    --radius:20px; --shadow:0 4px 14px rgba(61,43,31,0.12); font-size:16px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,"Segoe UI Rounded","Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--cream); color:var(--brown); min-height:100vh; padding-bottom:78px; }
  h1,h2,h3{ font-weight:800; line-height:1.2; margin:0 0 .4em; }
  p{ line-height:1.5; } button{ font-family:inherit; cursor:pointer; } a{ color:var(--clay-dark); }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    background:var(--card); border-bottom:2px solid #EADFCB; position:sticky; top:0; z-index:10; }
  header.top .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1rem; }
  header.top .brand-mark{ width:36px;height:36px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--clay)); display:flex;align-items:center;justify-content:center;font-size:1.2rem; }
  main{ max-width:780px; margin:0 auto; padding:20px 16px 40px; }
  .screen{ display:none; } .screen.active{ display:block; animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .card{ background:var(--card); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); margin-bottom:18px; }
  nav.tabbar{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:2px solid #EADFCB;
    display:flex; justify-content:space-around; padding:6px 4px; z-index:20; }
  nav.tabbar button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--brown-soft); font-size:.7rem; padding:6px 4px; border-radius:14px; min-width:44px; min-height:44px; flex:1; }
  nav.tabbar button .ic{ font-size:1.3rem; }
  nav.tabbar button.active{ color:var(--brown); background:#F3E2D3; font-weight:700; }
  nav.tabbar button:focus-visible, button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible{ outline:3px solid var(--sage); outline-offset:2px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; justify-content:center; background:var(--clay-dark); color:#fff;
    border:none; border-radius:999px; padding:14px 26px; font-size:1rem; font-weight:700; min-height:48px; box-shadow:var(--shadow); }
  .btn:hover{ background:var(--clay-darker); }
  .btn.secondary{ background:var(--sage-dark); }
  .btn.secondary:hover{ background:#3F4C35; }
  .btn.ghost{ background:transparent; color:var(--clay-darker); border:2px solid var(--clay); box-shadow:none; }
  .btn.small{ padding:8px 14px; font-size:.85rem; min-height:40px; }
  .btn:disabled{ opacity:.5; }
  .speak-btn{ background:#EFE3D1; border:none; border-radius:999px; width:44px; height:44px; display:inline-flex;
    align-items:center; justify-content:center; font-size:1.1rem; color:var(--clay-dark); }
  .speak-row{ display:flex; align-items:center; gap:10px; margin:10px 0; }
  .hero{ text-align:center; padding:26px 10px 10px; }
  .hero .scene{ width:150px; height:150px; margin:0 auto 14px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, var(--gold), var(--clay) 70%); display:flex; align-items:center;
    justify-content:center; font-size:4rem; box-shadow:0 0 0 8px #F3E2D3, var(--shadow); animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:0 0 0 8px #F3E2D3, var(--shadow);} 50%{ box-shadow:0 0 0 14px #F3E2D3, var(--shadow);} }
  .trail{ position:relative; padding:10px 0 10px 30px; }
  .trail::before{ content:""; position:absolute; left:14px; top:10px; bottom:10px; width:4px;
    background:repeating-linear-gradient(var(--sage) 0 8px, transparent 8px 14px); border-radius:4px; }
  .stop{ position:relative; margin-bottom:22px; }
  .stop .node{ position:absolute; left:-30px; top:2px; width:28px; height:28px; border-radius:50%; background:var(--sage-dark);
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; box-shadow:0 0 0 4px var(--cream); }
  .stop.locked .node{ background:#C9BEA9; color:var(--brown); } .stop.done .node{ background:var(--gold); color:var(--brown); }
  .stop-card{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .stop-card .meta{ font-size:.8rem; color:var(--brown-soft); }
  .badge-pill{ display:inline-block; background:#EDE7D8; color:var(--brown-soft); border-radius:999px; padding:2px 10px; font-size:.72rem; font-weight:700; margin-top:4px; }
  .grade-chips{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px; }
  .chip{ background:var(--card); border:2px solid #EADFCB; border-radius:999px; padding:6px 14px; font-size:.8rem; font-weight:700; color:var(--brown-soft); min-height:36px; }
  .chip.active{ background:var(--clay-dark); color:#fff; border-color:var(--clay-dark); }
  .choice-btn{ display:block; width:100%; text-align:left; background:var(--card); border:2px solid #EADFCB;
    border-radius:16px; padding:14px 16px; margin-bottom:10px; font-size:.98rem; color:var(--brown); }
  .choice-btn:hover{ border-color:var(--clay); } .choice-btn.tried{ border-color:var(--gold); }
  .clue-chip{ display:inline-flex; align-items:center; gap:6px; background:#EFE3D1; border:none; border-radius:14px;
    padding:10px 14px; margin:4px 6px 4px 0; font-size:.9rem; min-height:44px; }
  .clue-chip.seen{ background:var(--sage-dark); color:#fff; }
  .clue-detail{ background:#FBF6EE; border-left:4px solid var(--sage); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:.9rem; }
  .scene-box{ border-radius:16px; padding:16px; margin-top:12px; overflow:hidden; }
  .scene-box.best{ background:#E7EEE0; border:2px solid var(--sage); }
  .scene-box.mixed{ background:#FBF0DC; border:2px solid var(--gold); }
  .scene-box.poor{ background:#F6E4D8; border:2px solid var(--clay); }
  .scene-line{ opacity:0; animation:reveal .5s ease forwards; margin:0 0 8px; }
  .ripple-wrap{ margin:12px 0; }
  .ripple-label{ display:flex; justify-content:space-between; font-size:.72rem; color:var(--brown-soft); font-weight:700; margin-bottom:4px; }
  .ripple-track{ background:#EADFCB; border-radius:999px; height:10px; overflow:hidden; }
  .ripple-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--sage),var(--clay)); width:0; transition:width 1.1s ease .3s; }
  .counterfactual{ background:#FBF6EE; border:2px dashed var(--brown-soft); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:.9rem; }
  .attempt-note{ font-size:.78rem; color:var(--brown-soft); margin-top:6px; }
  @keyframes reveal{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .artifact-tile{ background:var(--card); border:2px solid #EADFCB; border-radius:16px; padding:14px; text-align:center; font-size:.85rem; }
  .badge-empty{ display:inline-block; width:1.1em; height:1.1em; border:2px solid #D8CBB0; border-radius:6px; vertical-align:middle; }
  .artifact-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; }
  .placeholder-note{ font-size:.85rem; color:var(--brown-soft); }
  .teacher-note{ background:#EFE7D6; border:2px dashed var(--brown-soft); border-radius:14px; padding:10px 14px; margin:10px 0; font-size:.85rem; }
  .save-flag{ font-size:.75rem; color:var(--sage-dark); font-weight:700; }
  .step-dots{ display:flex; gap:6px; margin-bottom:14px; }
  .step-dots span{ width:9px; height:9px; border-radius:50%; background:#EADFCB; }
  .step-dots span.on{ background:var(--clay); }
  textarea{ width:100%; border-radius:12px; border:2px solid #EADFCB; padding:10px; font-family:inherit; font-size:.95rem; background:#fff; color:var(--brown); }
  /* Play hub */
  .play-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:560px){ .play-grid{ grid-template-columns:1fr 1fr; } }
  .play-card{ background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); text-align:left; border:2px solid transparent; }
  .play-card:hover{ border-color:var(--clay); }
  .play-card .play-icon{ font-size:1.8rem; }
  .play-card h3{ margin:6px 0 4px; font-size:1.05rem; }
  .play-card p{ font-size:.85rem; color:var(--brown-soft); margin:0 0 10px; }
  .category-tag{ display:inline-block; background:#EDE7D8; color:var(--brown-soft); border-radius:999px; padding:2px 10px; font-size:.68rem; font-weight:700; margin-bottom:8px; }
  .play-badge-earned{ font-size:.72rem; color:var(--sage-dark); font-weight:700; }
  .section-label{ font-weight:800; margin:20px 0 10px; font-size:1rem; }
  /* Timer */
  .timer-wrap{ margin:10px 0; }
  .timer-track{ background:#EADFCB; border-radius:999px; height:14px; overflow:hidden; }
  .timer-fill{ height:100%; background:linear-gradient(90deg,var(--sage),var(--gold)); transition:width 0.4s linear; }
  .timer-label{ font-size:.8rem; font-weight:700; color:var(--brown-soft); margin-bottom:4px; display:flex; justify-content:space-between; }
  /* Stepper */
  .stepper{ display:inline-flex; align-items:center; gap:10px; background:var(--card); border:2px solid #EADFCB; border-radius:999px; padding:4px 8px; }
  .stepper button{ background:var(--clay-dark); color:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:1.2rem; font-weight:800; }
  .stepper button:disabled{ opacity:.4; }
  .stepper .qty{ min-width:24px; text-align:center; font-weight:800; }
  /* Reorder list */
  .reorder-list{ display:flex; flex-direction:column; gap:8px; }
  .reorder-item{ display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid #EADFCB; border-radius:14px; padding:10px 12px; }
  .reorder-item .re-icon{ font-size:1.4rem; }
  .reorder-item .re-text{ flex:1; font-size:.92rem; }
  .reorder-item .re-btns{ display:flex; flex-direction:column; gap:4px; }
  .reorder-item .re-btns button{ background:#EFE3D1; border:none; border-radius:8px; width:40px; height:36px; font-size:1rem; color:var(--clay-dark); }
  /* Map */
  .map-wrap{ position:relative; width:100%; padding-top:65%; border-radius:16px; overflow:hidden;
    background:linear-gradient(160deg,#E8DCC0,#D9C9A3); border:3px solid #C9B98E; margin:12px 0; }
  .map-hotspot{ position:absolute; transform:translate(-50%,-50%); background:rgba(251,246,238,.9); color:var(--brown); border:2px solid var(--brown-soft);
    border-radius:14px; padding:8px 10px; font-size:.8rem; display:flex; flex-direction:column; align-items:center; min-width:56px; min-height:44px; justify-content:center; }
  .map-hotspot .mh-icon{ font-size:1.4rem; }
  .map-hotspot.found{ border-color:var(--sage); background:#E7EEE0; }
  /* Scene / hunt grid */
  .scene-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
  .scene-obj{ background:var(--card); border:2px solid #EADFCB; border-radius:14px; padding:14px 4px; text-align:center; font-size:1.6rem; min-height:64px; }
  .scene-obj.found{ border-color:var(--sage); background:#E7EEE0; }
  .scene-obj.checked-empty{ opacity:.45; }
  .scene-obj .so-label{ display:block; font-size:.62rem; margin-top:4px; color:var(--brown-soft); }
  /* Gallery / museum */
  .artifact-pick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin:12px 0; }
  .artifact-pick{ background:var(--card); color:var(--brown); border:2px solid #EADFCB; border-radius:14px; padding:12px 8px; text-align:center; font-size:.78rem; min-height:44px; }
  .artifact-pick.selected{ border-color:var(--clay); background:#F3E2D3; }
  .artifact-pick .ap-icon{ font-size:1.8rem; display:block; }
  .gallery-wall{ display:flex; flex-direction:column; gap:14px; margin:14px 0; }
  .gallery-frame{ background:#FBF6EE; border:6px solid var(--brown-soft); border-radius:10px; padding:16px; text-align:center; }
  .gallery-frame .gf-icon{ font-size:2.2rem; }
  /* Compare / then-vs-now */
  .compare-cols{ display:grid; grid-template-columns:1fr; gap:14px; margin:12px 0; }
  @media (min-width:560px){ .compare-cols{ grid-template-columns:1fr 1fr; } }
  .compare-card{ background:var(--card); border-radius:16px; padding:16px; border:2px solid #EADFCB; }
  .compare-card.now{ border-color:var(--sage); }
  .compare-card h4{ margin:0 0 8px; }
  .compare-card ul{ margin:0; padding-left:18px; font-size:.88rem; }
  /* Vote */
  .vote-btn{ display:block; width:100%; text-align:left; background:var(--card); color:var(--brown); border:2px solid #EADFCB; border-radius:14px;
    padding:12px 16px; margin-bottom:8px; font-size:.92rem; }
  .vote-btn:hover{ border-color:var(--clay); }
  .vote-btn:disabled{ color:var(--brown-soft); opacity:.75; }
  .perspective-quote{ background:#FBF6EE; border-left:4px solid var(--gold); border-radius:10px; padding:8px 12px; margin:6px 0; font-size:.85rem; font-style:italic; }
  /* Drawing canvas */
  .draw-wrap{ margin:12px 0; }
  .draw-canvas{ width:100%; max-width:320px; height:200px; background:#fff; border-radius:12px; border:2px solid #EADFCB; touch-action:none; display:block; }
  .swatch-row{ display:flex; gap:8px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  .swatch{ width:40px; height:40px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 2px #EADFCB; }
  .swatch.active{ box-shadow:0 0 0 2px var(--clay); }
  .journal-entry{ background:var(--card); border-radius:14px; border:2px solid #EADFCB; padding:12px; margin-bottom:10px; }
  .journal-entry img{ max-width:160px; border-radius:8px; margin-top:6px; display:block; }
  @media (min-width:640px){ main{ padding-top:28px; } .hero .scene{ width:180px; height:180px; font-size:5rem; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark">⏳</span> Time Trek</div>
  <button class="speak-btn" id="muteToggle" aria-pressed="false" aria-label="Turn narration on or off">🔊</button>
</header>
<main id="app"></main>
<nav class="tabbar" aria-label="Main sections">
  <button data-screen="home" class="active"><span class="ic">🏠</span>Home</button>
  <button data-screen="path"><span class="ic">🗺️</span>Path</button>
  <button data-screen="play"><span class="ic">🎲</span>Play</button>
  <button data-screen="resources"><span class="ic">📚</span>Resources</button>
  <button data-screen="progress"><span class="ic">🎖️</span>Progress</button>
  <button data-screen="about"><span class="ic">❓</span>About</button>
</nav>
<script>
/* ================= Sample educational content (fictional/sample only) ================= */
const MISSIONS = [
{ id:"river", grade:"G3", subject:"Settlements & Location", title:"River Town Rescue", place:"A river valley with a hill and a forest nearby",
   icon:"🏞️", skill:"Smart Settler", minutes:8,
   steps:[
    {type:"observe", text:"Three guides know this land well. Tap each one to hear their clue before you choose where to build.",
     clues:[
      {icon:"🦫",label:"By the river",detail:"\"The river floods every spring when the snow melts!\""},
      {icon:"🦅",label:"On the hill",detail:"\"It's windy up here, and dry — you'd need a well.\""},
      {icon:"🦉",label:"In the forest",detail:"\"Plenty of wood, but the river is a long walk away.\""}
     ]},
    {type:"decide", prompt:"Where should the town be built?",
     choices:[
      {text:"Right on the floodplain, next to the river.", outcome:"poor",
       consequence:["Spring arrives. Snow melts far upstream, and the river swells past its banks.","The water creeps up — then floods. Three houses have to be dragged to higher ground before they float away.","The flood line was always there. The guide's clue said so."],
       ripple:{now:25, later:90},
       counterfactual:"If the town were built on the hill instead, this same flood would pass by harmlessly below it.",
       reteach:"Remember the clue: rivers like this one flood every spring. Building right on the flood line is risky, even though the water is closer."},
      {text:"On the hill, away from the water.", outcome:"mixed",
       consequence:["The spring flood passes safely below the hill.","But by summer, the well runs dry. Villagers haul buckets up from the river every day, and one spills on the way."],
       ripple:{now:20, later:45},
       counterfactual:"A floodplain town would have kept flood-free water close by all summer — but risked the spring flood instead.",
       reteach:null},
      {text:"In the forest, near the trees.", outcome:"mixed",
       consequence:["Plenty of wood for building all year.","But water is a long daily walk away, and the path gets dangerous once wolves start prowling it at dusk."],
       ripple:{now:20, later:40},
       counterfactual:"A hill town would trade the wolf-watched path for a dry well instead — every site has a tradeoff.",
       reteach:null}
     ]},
    {type:"decide", prompt:"Twist: this year is a drought, not a flood year. Where should the NEXT town go?",
     choices:[
      {text:"By the river again — the water source is reliable.", outcome:"best",
       consequence:["The dry season stretches on. The river drops low but never disappears — this town's crops survive.","The hill town's well fails completely, and families are hauling water in from far away."],
       ripple:{now:15, later:15},
       counterfactual:"In a flood year the river site was the risky one — in a drought year it's the safest. Context changes everything.",
       reteach:null},
      {text:"On the hill — it's safer overall.", outcome:"poor",
       consequence:["The dry season stretches on, and the hill's well runs completely dry.","Families have to haul water in from far away, week after week."],
       ripple:{now:30, later:70},
       counterfactual:"The riverside town's water never fully disappeared, even in the drought.",
       reteach:"There's no single \"safest\" spot forever — a hill is safer in a flood year, but a river is safer in a drought year."}
     ]},
    {type:"create", prompt:"A good place to build a town is…", starter:"A good place to build a town is… because…", badge:"Smart Settler"}
   ]},
{ id:"symbols", grade:"G3", subject:"Civic Symbols", title:"Symbol Detective", place:"The town square",
   icon:"🔎", skill:"Civic Designer", minutes:6,
   steps:[
    {type:"observe", text:"Tap each symbol in the town square to learn what it stands for.",
     clues:[
      {icon:"🚩",label:"The town flag",detail:"Its blue stripe stands for the river that gives the town water."},
      {icon:"🌾",label:"The courthouse seal",detail:"Wheat stalks on the seal stand for the farms that feed the town."},
      {icon:"🤝",label:"The statue",detail:"Two clasped hands stand for a friendship treaty with a neighboring town."}
     ]},
    {type:"decide", prompt:"The town wants to celebrate its harvest with a symbol. Which one fits best?",
     choices:[
      {text:"The wheat seal.", outcome:"best",
       consequence:["Everyone recognizes it right away — the wheat has meant \"farming\" here for generations."],
       ripple:{now:10, later:10}, counterfactual:"The flag's river stripe is about water, not farming — close, but not quite the harvest symbol.", reteach:null},
      {text:"The clasped-hands statue.", outcome:"poor",
       consequence:["People are confused — the statue is about the friendship treaty, not the harvest."],
       ripple:{now:15, later:15}, counterfactual:"The wheat seal already means \"farming\" to everyone in town.",
       reteach:"Each symbol carries its own specific meaning. The clasped hands stand for friendship, not farming — the wheat does."}
     ]},
    {type:"decide", prompt:"You're designing a brand-new town seal. Which set of symbols best captures the whole town — its river, its farms, and its friendship treaty?",
     choices:[
      {text:"River stripe + wheat + clasped hands, all three together.", outcome:"best",
       consequence:["The new seal tells the whole story of the town in one image — water, food, and friendship."],
       ripple:{now:10, later:10}, counterfactual:"Leaving any one symbol out would leave part of the town's story untold.", reteach:null},
      {text:"Just the wheat, since farming matters most.", outcome:"mixed",
       consequence:["The seal looks clean and simple, but visitors have no way to know about the river or the treaty."],
       ripple:{now:10, later:20}, counterfactual:"Adding the river stripe and clasped hands would tell the town's full story, not just one part of it.", reteach:null}
     ]},
    {type:"create", prompt:"Why did you choose the symbols you did for the new seal?", starter:"I chose these symbols because…", badge:"Civic Designer"}
   ]},
 { id:"marketday", grade:"G3", subject:"Economics: Needs & Wants", title:"Market Day Mayhem", place:"A village market square",
   icon:"🧺", skill:"Market Master", minutes:8,
   steps:[
    {type:"observe", text:"Look over your stall before the market opens. Some of your goods are needs, some are wants.",
     clues:[
      {icon:"🍞",label:"Bread",detail:"A need — people must buy food no matter what."},
      {icon:"🍬",label:"Honey candy",detail:"A want — sweet, but nobody needs it to get through the day."},
      {icon:"🧵",label:"Wool blankets",detail:"A need in cold months — people will pay more for warmth."}
     ]},
    {type:"decide", prompt:"How should you price your stall today?",
     choices:[
      {text:"Set prices high — every sale earns more.", outcome:"poor",
       consequence:["Morning turns to afternoon, and shoppers keep walking right past your stall.","By closing time, your baskets are still full and the coins in your box barely jingle."],
       ripple:{now:20, later:40}, counterfactual:"A fair, balanced price would have brought in steady customers all day.",
       reteach:"When prices are too high, shoppers simply buy from someone else. A fair price brings in more sales overall, even if each one earns a little less."},
      {text:"Set prices very low — sell everything fast.", outcome:"mixed",
       consequence:["A crowd rushes in, and your stall is empty before noon.","But when you count your coins, the pile is small — barely enough to cover next week's goods."],
       ripple:{now:10, later:30}, counterfactual:"A balanced price would have sold nearly as fast, with a much bigger coin pile at the end.", reteach:null},
      {text:"Set a fair, balanced price.", outcome:"best",
       consequence:["Customers come steadily all day, and your baskets empty out by late afternoon.","Your coin box is heavier than it's ever been."],
       ripple:{now:10, later:10}, counterfactual:"Pricing too high would have left your baskets full and your coin box light.", reteach:null}
     ]},
    {type:"decide", prompt:"A neighbor arrives — she doesn't have enough coins for bread her family needs. What do you do?",
     choices:[
      {text:"Lower the price for her today.", outcome:"mixed",

 { id:"neighborhoodheroes", grade:"G3", subject:"Civics: Helpers & Rules", title:"Neighborhood Heroes", place:"A busy neighborhood block",
   icon:"🚒", skill:"Community Builder", minutes:7,
   steps:[
    {type:"observe", text:"Three problems are happening around the neighborhood right now. Tap each to see what's going on.",
     clues:[
      {icon:"🔥",label:"A small fire",detail:"Smoke is rising from a trash can behind the bakery."},
      {icon:"🐕",label:"A lost dog",detail:"A dog without a collar is wandering near the school, looking scared."},
      {icon:"💡",label:"A broken streetlight",detail:"The light on Elm Street has been flickering and just went dark."}
     ]},
    {type:"decide", prompt:"The fire is spreading behind the bakery. Who should you call?",
     choices:[
      {text:"The city worker who fixes streetlights.", outcome:"poor",
       consequence:["The streetlight crew arrives with a ladder — but no way to put out a fire.","By the time the right call is made, the smoke has spread further."],
       ripple:{now:20, later:35}, counterfactual:"Calling the firefighters right away would have put the fire out before it spread.",
       reteach:"Each helper has a specific job. Firefighters are trained and equipped for fires — that's who to call first."},
      {text:"The firefighters.", outcome:"best",
       consequence:["The fire truck arrives quickly, and the fire is out within minutes.","No one is hurt, and the bakery reopens the next day."],
       ripple:{now:10, later:10}, counterfactual:"Calling a city worker instead would have wasted precious time while the fire grew.", reteach:null}
     ]},
    {type:"decide", prompt:"A classmate says: \"There's no running in the hallway\" and \"cars must stop at red lights.\" Are these the same kind of thing?",
     choices:[
      {text:"Yes — they're both just rules everyone follows.", outcome:"poor",
       consequence:["A student running in the hall gets a reminder from a teacher.","A driver running a red light gets pulled over by police — that's a very different kind of consequence."],
       ripple:{now:10, later:15}, counterfactual:"Recognizing the difference helps explain why some consequences involve a teacher, and others involve the police.",
       reteach:"A school rule (no running) is enforced by the school. A law (stop at red lights) is enforced by police and applies to everyone in town, not just one building."},
      {text:"No — one is a school rule, the other is a law.", outcome:"best",
       consequence:["That's exactly right. Rules are made by a group, like a school or a family. Laws apply to the whole town or country and are enforced by police."],
       ripple:{now:10, later:10}, counterfactual:"Treating them as the same thing would blur why breaking one gets a reminder and breaking the other gets a ticket.", reteach:null}

    {type:"decide", prompt:"Your class is writing one new playground rule. Which one should you propose?",
     choices:[
      {text:"\"No one may use the swings, ever.\"", outcome:"poor",

       ripple:{now:15, later:15}, counterfactual:"A rule about taking turns would keep the swings safe and let everyone still enjoy them.",
       reteach:"A good rule solves the actual problem without taking away something everyone should get to enjoy."},
      {text:"\"Everyone gets a turn on the swings — 2 minutes each.\"", outcome:"best",
       consequence:["Kids line up and take turns fairly.","No one gets hurt, and everyone still gets to swing."],
       ripple:{now:10, later:10}, counterfactual:"Banning the swings completely would have been simpler to write, but far less fair.", reteach:null}
     ]},
    {type:"create", prompt:"Why do neighborhoods need both helpers and rules?", starter:"Neighborhoods need helpers and rules because…", badge:"Community Builder"}
   ]},
 { id:"timecapsule", grade:"G3", subject:"Change Over Time", title:"Time Capsule Detective", place:"A kitchen from the year 1900",

      {icon:"🧺",label:"The washboard",detail:"Clothes were scrubbed by hand against its ridges, one piece at a time."}

{ id:"explorer", grade:"G4", subject:"Early Exploration & Trade", title:"Explorer's Log", place:"A merchant ship, about to set sail",
   icon:"⛵", skill:"Fearless Navigator", minutes:9,
   steps:[
    {type:"observe", text:"Before you pack the ship, learn what this voyage requires.",
     clues:[
      {icon:"🌬️",label:"Winds",detail:"The winds only blow the right direction for about 8 weeks — the voyage has to fit that window."},
      {icon:"🌊",label:"Currents",detail:"Ocean currents will carry the ship faster on the return trip than on the way out."},
      {icon:"📦",label:"Cargo hold",detail:"There's only room for 10 crates: choose between food, water, tools, trade goods, and medicine."}
     ]},
    {type:"decide", prompt:"How should you load the cargo hold for 8 weeks at sea?",
     choices:[
      {text:"A balanced load: food, water, tools, and trade goods.", outcome:"best",
       consequence:["Supplies last the whole voyage with a little room to spare.","There's still enough trade goods left to barter well at landfall."],
       ripple:{now:10, later:10}, counterfactual:"An all-trade-goods load would have run out of water long before landfall.", reteach:null},
      {text:"Mostly trade goods — you can buy supplies along the way.", outcome:"poor",
       consequence:["By week 6, the water barrels are nearly empty.","A sailor collapses from thirst, and the ship has to make an emergency stop, trading away goods just to restock water."],
       ripple:{now:15, later:55}, counterfactual:"A balanced load would have kept enough water on board for the whole 8 weeks.",
       reteach:"There's nowhere to restock water in the open ocean. Food and water have to last the entire voyage, not just get you started."},
      {text:"Mostly food and water, only a little trade goods.", outcome:"mixed",
       consequence:["The crew stays healthy and well-fed the whole way.","But at landfall, there's little to trade — you end up bartering away some of your tools instead."],
       ripple:{now:10, later:20}, counterfactual:"A balanced load would have left tools untouched and traded goods instead.", reteach:null}
     ]},
    {type:"decide", prompt:"A storm hits in week 3. Do you sail through it or wait it out?",
     choices:[
      {text:"Sail through it.", outcome:"mixed",
       consequence:["The ship pitches hard, and a loose barrel breaks free, spilling some supplies overboard.","But you stay on schedule and reach land on time."],
       ripple:{now:20, later:15}, counterfactual:"Waiting out the storm would have kept every barrel secure, but cost three days.", reteach:null},
      {text:"Wait it out in a sheltered cove.", outcome:"best",
       consequence:["The ship rides out the storm safely with nothing lost.","The delay costs a few days, but the crew and cargo arrive in full."],
       ripple:{now:10, later:10}, counterfactual:"Sailing through would have kept you on schedule, at the cost of some lost supplies.", reteach:null}
     ]},
    {type:"create", prompt:"Write your captain's log entry for the voyage.", starter:"We survived because we packed ___ and chose to ___", badge:"Fearless Navigator"}
   ]},
{ id:"regions", grade:"G4", subject:"Geographic Regions", title:"Region Riddle", place:"The Plains region",
   icon:"🌾", skill:"Regional Expert", minutes:7,
   steps:[
    {type:"observe", text:"Learn what each landscape produces before you plan your region's economy.",
     clues:[
      {icon:"🏔️",label:"Mountains",detail:"Rich in minerals and lumber, but hard to farm."},
      {icon:"🌊",label:"Coast",detail:"Full of fish, and easy for ships to reach for trade."},
      {icon:"🌾",label:"Plains",detail:"Wide, flat, and full of rich soil — perfect for growing grain."}
     ]},
    {type:"decide", prompt:"Your region is the wide-open Plains. What should its main way of living be?",
     choices:[
      {text:"Growing grain on the wide, flat fields.", outcome:"best",
       consequence:["The flat land and rich soil make the Plains one of the best grain-growing regions around.","Silos fill up every harvest season."],
       ripple:{now:10, later:10}, counterfactual:"Mining would need mountains the Plains simply don't have.", reteach:null},
      {text:"Mining for minerals.", outcome:"poor",
       consequence:["Workers dig for weeks and find almost nothing — the Plains has no mineral deposits at all."],
       ripple:{now:15, later:20}, counterfactual:"Growing grain uses exactly what the Plains' flat, rich soil is good for.",
       reteach:"Each region's economy grows out of its landscape. The Plains' flat, rich soil is built for farming, not mining."}
     ]},
    {type:"decide", prompt:"Your region has no fish, but people want some. What do you do?",
     choices:[
      {text:"Trade grain with the Coastal region for fish.", outcome:"best",
       consequence:["The Coastal region is glad to trade — they need grain, and you need fish.","Both regions end up with more variety than either had alone."],
       ripple:{now:10, later:10}, counterfactual:"Trying to fish a landlocked pond would have left the town mostly without fish anyway.", reteach:null},
      {text:"Try fishing in a small nearby pond.", outcome:"poor",
       consequence:["The pond barely has enough fish for a few families, let alone the whole town."],
       ripple:{now:15, later:25}, counterfactual:"Trading grain for fish with the Coastal region would have easily met the town's needs.",
       reteach:"No single region has everything it needs. Trading with a region that has what you lack is usually far more reliable than trying to force your land to provide it."}
     ]},
    {type:"create", prompt:"Describe how your region and a neighboring region depend on each other.", starter:"My region thrives because we trade ___ for ___", badge:"Regional Expert"}
   ]},
 { id:"treaty", grade:"G4", subject:"Contact, Trade & Treaties", title:"Treaty at the River", place:"A river valley, first contact between a tribal nation and newcomers",
   icon:"🕊️", skill:"Honest Historian", minutes:10,
   note:"This activity is designed to be paired with class discussion. It presents treaties honestly — many were unequal, and many were later broken.",
   steps:[
    {type:"observe", text:"Meet the river council before any decisions are made. Learn what matters most to this community.",
     clues:[
      {icon:"🌊",label:"The river",detail:"It provides fish, fresh water, and a route for canoes — central to daily life."},
      {icon:"🌲",label:"The hunting grounds",detail:"Generations have hunted here; the land is known in careful, practiced detail."},
      {icon:"🏕️",label:"The village",detail:"Homes, elders, and children all depend on this specific stretch of land."}
     ]},
    {type:"decide", prompt:"A ship has arrived. The newcomers want to trade. What do you offer first?",
     choices:[
      {text:"Metal tools, like knives and hoes.", outcome:"best",
       consequence:["Both sides benefit — the tools are useful for daily work, and the newcomers receive furs and food in return.","Trust builds slowly between the two groups."],
       ripple:{now:10, later:10}, counterfactual:"Trading guns instead would have shifted the balance of power in a far riskier direction.", reteach:null},
      {text:"Cloth and glass beads.", outcome:"mixed",
       consequence:["The trade goes smoothly and everyone is satisfied for now.","But it doesn't change much for either side in the long run."],
       ripple:{now:10, later:10}, counterfactual:"Tools would have been just as fair, and more useful for daily life on both sides.", reteach:null},
      {text:"Guns.", outcome:"poor",
       consequence:["The trade brings a burst of goods both ways — but word spreads fast, and other groups nearby grow uneasy.","Within a season, the balance of power in the region has shifted in a way no one fully controls."],
       ripple:{now:15, later:55}, counterfactual:"Trading tools instead would have built the same trust without shifting the region's balance of power.",
       reteach:"Some trades carry consequences far beyond the moment. Trading weapons changed the balance of power for everyone nearby, not just the two groups trading."}
     ]},
    {type:"decide", prompt:"The newcomers now offer a treaty: they want the land along the river in exchange for goods and a promise of peace. What does the council decide?",
     choices:[
      {text:"Accept the land deal.", outcome:"mixed",
       consequence:["The immediate goods and promised peace ease tension right away.","But over the following years, the map shows the village's land shrinking again and again as more settlers arrive."],
       ripple:{now:10, later:60}, counterfactual:"Refusing might have meant conflict sooner — but many nations who accepted similar deals still lost their land over time.", reteach:null},
      {text:"Ask for more time before deciding.", outcome:"mixed",
       consequence:["The council buys a season to think and consult with elders.","But more settlers arrive during that time, and the pressure to accept only grows stronger."],
       ripple:{now:15, later:45}, counterfactual:"Accepting right away would have secured the promised goods sooner, before more settlers arrived.", reteach:null},
      {text:"Refuse the treaty entirely.", outcome:"mixed",
       consequence:["The council holds its ground and keeps its land — for now.","Tensions with the newcomers rise, and both sides brace for what comes next."],
       ripple:{now:25, later:40}, counterfactual:"Accepting the deal might have eased tension immediately, at the cost of the land itself.", reteach:null}
     ]},
    {type:"create", prompt:"Every choice in this mission had a real cost. Why is fairness so hard in a moment like this?", starter:"Fairness is hard here because…", badge:"Honest Historian"}
   ]},
 { id:"capitolhill", grade:"G4", subject:"State Government", title:"Capitol Hill Hop", place:"The state capitol building",
   icon:"🏛️", skill:"Lawmaker", minutes:8,
   steps:[
    {type:"observe", text:"Your town has a problem. Learn what's happening before you write a law about it.",
     clues:[
      {icon:"🗑️",label:"Litter",detail:"Trash is piling up in the park, and nobody's in charge of cleaning it."},
      {icon:"🐕",label:"Stray dogs",detail:"Dogs without owners are wandering the streets, and a few families are worried."},
      {icon:"📋",label:"Town hall notes",detail:"Residents have been asking their representative to do something about one of these."}
     ]},
    {type:"decide", prompt:"You decide to write a law about litter in the park. How strict should it be?",
     choices:[
      {text:"A $500 fine for dropping even a single leaf.", outcome:"poor",
       consequence:["A kid gets fined for a leaf that blew off a tree.","Families are furious, and the law gets mocked all over town before it's even a week old."],
       ripple:{now:20, later:30}, counterfactual:"A reasonable fine for actual litter would have solved the problem without punishing innocent people.",
       reteach:"A law that's too strict often punishes people unfairly and loses public support fast — even if the original goal was reasonable."},
      {text:"A small fine only for littering trash, with a warning first.", outcome:"best",
       consequence:["People start using trash cans more carefully, and the park is noticeably cleaner within a month.","Most residents feel the law is fair."],
       ripple:{now:10, later:10}, counterfactual:"An extreme fine would have caused public anger without necessarily cleaning the park any faster.", reteach:null},
      {text:"No fine at all — just a friendly sign asking people to clean up.", outcome:"mixed",
       consequence:["A few people take the sign seriously.","But most keep littering exactly as before — nothing really changes."],
       ripple:{now:5, later:25}, counterfactual:"A small fine with a warning first would have actually changed people's behavior.", reteach:null}
     ]},
    {type:"decide", prompt:"A senator on the committee objects to your bill, saying the fine is unfair to families with young kids. What do you do?",
     choices:[
      {text:"Compromise — lower the fine and add a first-time warning.", outcome:"best",
       consequence:["The senator agrees to support the bill.","It moves forward, a little weaker than you first wrote it, but with real support behind it."],
       ripple:{now:10, later:10}, counterfactual:"Refusing to budge might have kept your original law, but it likely would have died in committee.", reteach:null},
      {text:"Argue that the fine should stay exactly as written.", outcome:"mixed",
       consequence:["The debate drags on for weeks in a crowded, noisy committee room.","The bill eventually stalls — not defeated, just stuck."],
       ripple:{now:20, later:25}, counterfactual:"A small compromise would have kept the bill moving instead of stuck in committee.", reteach:null},
      {text:"Withdraw the bill rather than change it.", outcome:"poor",
       consequence:["The bill dies completely.","The park stays just as littered as before, and nothing changes for the town."],
       ripple:{now:15, later:35}, counterfactual:"A small compromise would have kept the core idea alive and actually helped the park.",
       reteach:"In lawmaking, a compromise that keeps most of your goal usually helps people more than holding out for a perfect version that never passes."}
     ]},
    {type:"create", prompt:"Why do lawmakers so often have to compromise?", starter:"Lawmakers compromise because…", badge:"Lawmaker"}
   ]},
 { id:"goldrush", grade:"G4", subject:"Westward Expansion", title:"Gold Rush or Bust", place:"The trail west, headed for gold country",
   icon:"⛏️", skill:"Forty-Niner", minutes:10,
   steps:[
    {type:"observe", text:"Before you leave, learn what this journey will demand.",
     clues:[
      {icon:"🛒",label:"Wagon weight",detail:"A heavier wagon moves slower and struggles on mountain trails."},
      {icon:"🍞",label:"Food supply",detail:"The trail takes months — running low on food partway through is dangerous."},
      {icon:"⛏️",label:"Gold claims",detail:"Most claims turn up very little gold — most miners who struck it rich sold supplies, not gold."}
     ]},
    {type:"decide", prompt:"How should you pack the wagon?",
     choices:[
      {text:"Load up on gear and tools — more is better.", outcome:"poor",
       consequence:["The heavy wagon crawls up every hill.","Halfway through the trail, an axle breaks under the extra weight, costing days of repair."],
       ripple:{now:20, later:35}, counterfactual:"A balanced load would have moved faster and put less strain on the wagon.",
       reteach:"An overloaded wagon moves slower and breaks down more easily. Trail families packed only what they truly needed."},
      {text:"Pack light on food to save weight.", outcome:"poor",
       consequence:["The wagon moves quickly at first.","But two months in, food runs low, and the family goes hungry before reaching the next trading post."],
       ripple:{now:15, later:40}, counterfactual:"A balanced load would have kept enough food for the whole journey.",
       reteach:"The trail takes months. Packing too little food doesn't show its cost right away — it shows up weeks later, when there's no way to turn back for more."},
      {text:"Pack a balanced load of food, tools, and spare parts.", outcome:"best",
       consequence:["The wagon moves at a steady pace, and supplies last the whole way.","The family arrives tired, but whole."],
       ripple:{now:10, later:10}, counterfactual:"Overloading with gear would have slowed the wagon and risked a breakdown.", reteach:null}
     ]},
    {type:"decide", prompt:"You reach a river crossing. Do you pay the ferry, or try to ford the river with the wagon?",
     choices:[
      {text:"Try to ford the river yourself.", outcome:"poor",
       consequence:["The wagon tips partway across, and the current sweeps away a barrel of supplies before you can grab it."],
       ripple:{now:25, later:20}, counterfactual:"Paying the ferry operator would have crossed the same river safely, for a small fee.",
       reteach:"Fording an unfamiliar river with a loaded wagon was one of the most dangerous parts of the trail — paying for the ferry was usually worth the cost."},
      {text:"Pay the ferry operator to cross safely.", outcome:"best",
       consequence:["The ferry gets your wagon across without incident.","It costs a little money, but everyone and everything arrives dry."],
       ripple:{now:10, later:10}, counterfactual:"Fording the river yourself would have saved the fee, but risked losing supplies or worse.", reteach:null}
     ]},
    {type:"decide", prompt:"After months of panning, you strike a small amount of gold. What do you do with your earnings?",
     choices:[
      {text:"Buy a mining claim and keep digging for more gold.", outcome:"poor",
       consequence:["Most claims nearby have already been picked over.","You spend your earnings and months of work turn up almost nothing more."],
       ripple:{now:20, later:45}, counterfactual:"Opening a supply store would have earned steady money from every miner who needed goods, gold or no gold.",
       reteach:"During the Gold Rush, most miners didn't get rich from gold — the storekeepers who sold food, tools, and supplies to miners often did better, steadily, no matter who struck gold."},
      {text:"Open a small store selling supplies to other miners.", outcome:"best",
       consequence:["Every miner in the area needs food, tools, and boots — whether or not they find gold.","Your store brings in steady money, month after month."],
       ripple:{now:10, later:10}, counterfactual:"Betting everything on a new mining claim would have been a gamble with poor odds.", reteach:null}
     ]},
    {type:"create", prompt:"Why did so many people believe gold mining was easy money, when it usually wasn't?", starter:"Easy money is… because…", badge:"Forty-Niner"}
   ]},
{ id:"colonycountdown", grade:"G5", subject:"Causes of the Revolution", title:"Colony Countdown", place:"A colonial town, on the eve of the Stamp Act",
   icon:"📜", skill:"Cause & Effect Detective", minutes:9,
   steps:[
    {type:"observe", text:"Meet three colonists who will each feel this new tax differently.",
     clues:[
      {icon:"🌾",label:"The farmer",detail:"Feels the tax through higher prices on everyday goods bought with crop money."},
      {icon:"⚓",label:"The merchant",detail:"Pays the tax directly on every shipment of goods sold."},
      {icon:"🔨",label:"The apprentice",detail:"Has no land and no vote, but still pays the tax on paper goods he buys."}
     ]},
    {type:"decide", prompt:"Parliament passes the Stamp Tax on paper goods. What does the town do?",
     choices:[
      {text:"Comply and pay the tax quietly.", outcome:"mixed",
       consequence:["Life goes on peacefully for now.","Six months later, Parliament passes another tax — resistance looked cheap, so why not add one more?"],
       ripple:{now:5, later:45}, counterfactual:"A boycott would have cost more right now, but sent a clear signal Parliament couldn't ignore.", reteach:null},
      {text:"Boycott British goods until the tax is repealed.", outcome:"best",
       consequence:["Shops selling stamped goods sit empty. Merchants in England start losing money.","Parliament responds by sending more troops — the boycott worked, but it wasn't free."],
       ripple:{now:25, later:20}, counterfactual:"Quiet compliance would have avoided the troops, but taught Parliament that resistance was cheap.", reteach:null},
      {text:"Riot in the streets.", outcome:"poor",
       consequence:["A window breaks, and soldiers are called in.","Moderate colonists who might have supported a boycott pull away — the anger got attention, but it also handed the other side an excuse."],
       ripple:{now:35, later:40}, counterfactual:"A boycott would have hurt British merchants' profits without giving Parliament an excuse to crack down.",
       reteach:"Anger gets attention, but it can also cost support. A boycott pressured Parliament economically without turning moderate colonists against the cause."}
     ]},
    {type:"decide", prompt:"At the town meeting, what action does the town formally choose?",
     choices:[
      {text:"Sign a petition asking Parliament to reconsider.", outcome:"mixed",
       consequence:["The petition is polite and widely signed — and mostly ignored back in London."],
       ripple:{now:5, later:20}, counterfactual:"Joining the boycott would have applied real economic pressure, not just words.", reteach:null},
      {text:"Join the boycott of British goods.", outcome:"best",
       consequence:["Word spreads to other towns, and the boycott grows into a movement that Parliament can't ignore."],
       ripple:{now:15, later:15}, counterfactual:"A petition alone rarely changed Parliament's mind — economic pressure did far more.", reteach:null}
     ]},
    {type:"create", prompt:"Trace the chain of cause and effect: the tax led to your town's choice, which led to Parliament's response, which fed into the Revolution. Explain the chain in your own words.", starter:"The tax led to ___, which caused Parliament to ___, which eventually led to…", badge:"Cause & Effect Detective"}
   ]},
{ id:"declaration", grade:"G5", subject:"Primary Sources", title:"Declaration Detective", place:"Reading the Declaration of Independence",
   icon:"🖋️", skill:"Founding Voice", minutes:8,
   steps:[
    {type:"observe", text:"Read three grievances from the Declaration, in simplified language.",
     clues:[
      {icon:"📜",label:"Grievance 1",detail:"\"He has imposed taxes on us without our consent.\""},
      {icon:"📜",label:"Grievance 2",detail:"\"He has kept armies among us in times of peace, without our approval.\""},
      {icon:"📜",label:"Grievance 3",detail:"\"He has obstructed the administration of justice.\""}
     ]},
    {type:"decide", prompt:"Which grievance matches the Stamp Tax you saw colonists react to?",
     choices:[
      {text:"\"He has imposed taxes on us without our consent.\"", outcome:"best",

 { id:"convention", grade:"G5", subject:"The Constitutional Convention", title:"Convention Compromise", place:"Independence Hall, Philadelphia, 1787",
   icon:"🖋️", skill:"Framer", minutes:10,
   note:"This activity is designed to be paired with class discussion, especially the Three-Fifths Compromise step, which the app addresses honestly and without minimizing the injustice involved.",
   steps:[
    {type:"observe", text:"Delegates from big states and small states disagree about representation. Learn both sides before the debate begins.",
     clues:[
      {icon:"🏛️",label:"Virginia Plan",detail:"Favored by big states — representation in Congress based on population."},
      {icon:"⚖️",label:"New Jersey Plan",detail:"Favored by small states — equal representation for every state, no matter its size."},
      {icon:"🗳️",label:"The deadlock",detail:"Neither side will budge, and the entire convention risks falling apart."}
     ]},
    {type:"decide", prompt:"As a small-state delegate, the big states refuse to accept equal representation. What do you do?",
     choices:[
      {text:"Hold firm — refuse any plan based on population.", outcome:"poor",
       consequence:["Talks break down. Several delegates threaten to walk out entirely.","The convention comes close to collapsing before a single compromise is found."],
       ripple:{now:25, later:30}, counterfactual:"Proposing a two-house compromise would have kept both sides at the table instead of walking away.",
       reteach:"A convention this important couldn't survive if either side simply refused to move. The eventual solution combined both ideas instead of choosing only one."},
      {text:"Propose a two-house Congress — one based on population, one with equal votes per state.", outcome:"best",
       consequence:["Both sides see something they wanted in the plan.","It isn't a perfect win for anyone, but it keeps the convention together."],
       ripple:{now:10, later:10}, counterfactual:"Holding firm on equal representation alone would have left the big states unwilling to sign at all.", reteach:null}
     ]},
    {type:"decide", prompt:"This two-house solution became known as the Great Compromise. Which part of Congress did it create to satisfy the small states specifically?",
     choices:[
      {text:"The House of Representatives, based on population.", outcome:"poor",
       consequence:["That part actually favored the bigger states, who wanted representation tied to population."],
       ripple:{now:10, later:15}, counterfactual:"The Senate — equal votes per state, no matter the size — is what reassured the small states.",
       reteach:"The House of Representatives is based on population, which favored bigger states. The Senate, with two seats per state regardless of size, is what protected the small states."},
      {text:"The Senate, with two seats per state.", outcome:"best",
       consequence:["Exactly — every state, big or small, gets equal footing in the Senate. That balance is still part of Congress today."],
       ripple:{now:10, later:10}, counterfactual:"The House alone, based on population, would have left small states with far less voice.", reteach:null}
     ]},
    {type:"decide", prompt:"Southern delegates then raised a painful question: should enslaved people count toward a state's population for representation? The convention's actual answer — the Three-Fifths Compromise — counted each enslaved person as three-fifths of a person for this purpose. Which statement is historically accurate about this decision?",
     choices:[
      {text:"It was a fair way to balance the interests of every state equally.", outcome:"poor",
       consequence:["This wasn't a fair balance — it was a bargain that treated enslaved human beings as partial persons to increase Southern political power, while enslaved people themselves had no rights or voice at all."],
       ripple:{now:10, later:20}, counterfactual:"Recognizing this compromise as unjust — even while understanding why it happened — is the historically accurate view most historians hold today.",
       reteach:"The Three-Fifths Compromise is widely recognized by historians as a deeply unjust bargain. It increased the political power of slaveholding states while denying enslaved people any rights at all — some delegates at the time even said so."},
      {text:"It was a deeply unjust bargain that treated enslaved people as less than full persons, made to keep Southern states in the union.", outcome:"best",
       consequence:["That's the honest reading of this moment. Some delegates at the convention knew this compromise was wrong even as they voted for it.","This decision deepened the divide between free and enslaved states — a divide that grew for decades and helped lead toward the Civil War."],
       ripple:{now:10, later:10}, counterfactual:"Calling it simply \"fair\" would erase the real injustice it caused to millions of enslaved people.", reteach:null}
     ]},
    {type:"create", prompt:"The Constitution included compromises that helped the country form — and compromises that caused deep harm. Why might people today disagree about how to remember the Constitutional Convention?", starter:"People might disagree because…", badge:"Framer"}
   ]},
 { id:"northstar", grade:"G5", subject:"The Underground Railroad", title:"North Star: A Journey to Freedom", place:"A network of hidden routes toward the free states",

    {type:"create", prompt:"Even reaching a free state didn't always mean safety — a law called the Fugitive Slave Act allowed enslaved people to be recaptured even in the North, which is why many continued on to Canada. Knowing this, what does the word \"freedom\" mean to you after this journey?", starter:"Freedom was…", badge:"North Star"}

 { id:"supplyline", grade:"G5", subject:"Revolutionary War Logistics", title:"The General's Supply Line", place:"An encampment near Valley Forge, winter 1777",

      {icon:"🐎",label:"Supply wagons",detail:"Wagons from other colonies are weeks away and depend on weather and roads."}

    {type:"decide", prompt:"Winter is closing in and supplies are low. How do you get more food for the army?",

      {text:"Pay local farmers a fair price for their surplus.", outcome:"best",

       ripple:{now:15, later:10}, counterfactual:"Simply taking supplies without payment would have angered the very communities the army depends on.", reteach:null},
      {text:"Requisition supplies from farms by order, paying little or nothing.", outcome:"poor",

       ripple:{now:10, later:45}, counterfactual:"Paying farmers fairly would have gotten similar supplies without turning local support against the army.",
       reteach:"An army fighting far from home depends on the goodwill of nearby communities. Taking supplies without fair payment can win a short-term need at a long-term cost."},

       ripple:{now:15, later:50}, counterfactual:"A balanced supply of food, shoes, and blankets together would have kept far more soldiers healthy through the winter.",
       reteach:"Soldiers needed more than food to survive Valley Forge's winter — shoes and blankets prevented frostbite and sickness that thinned the army just as much as hunger did."},
      {text:"Split the supplies evenly across food, shoes, and blankets.", outcome:"best",
       consequence:["No one has plenty of anything, but the balance keeps most soldiers fed, warm enough, and on their feet.","The army makes it to spring in fighting shape."],
       ripple:{now:15, later:10}, counterfactual:"Focusing only on food would have left the camp vulnerable to frostbite and illness.", reteach:null}
     ]},
    {type:"create", prompt:"Why might keeping an army supplied matter just as much as winning battles?", starter:"Supplies matter because…", badge:"Quartermaster"}
   ]},

 { id:"hammurabi", grade:"G6", subject:"Ancient Law & Justice", title:"Hammurabi's Courtroom", place:"A courtroom in ancient Babylon",
   icon:"⚖️", skill:"Lawgiver", minutes:8,
   steps:[
    {type:"observe", text:"Before you judge any cases, study three laws from Hammurabi's Code.",
     clues:[

      {icon:"🌾",label:"Law on farmers",detail:"If someone floods a neighbor's field through carelessness, they must repay the lost grain."},
      {icon:"⚖️",label:"\"An eye for an eye\"",detail:"Many punishments in the code mirror the harm done — a strict, exact kind of justice."}
     ]},
    {type:"decide", prompt:"A farmer accidentally lets water flood into a neighbor's field, ruining the crop. The neighbor demands the farmer's own house be destroyed in return. Is this a fair punishment?",
     choices:[
      {text:"Yes — destroy the farmer's house in return.", outcome:"poor",
       consequence:["The farmer's family loses their home over an accident, not an intentional act.","The village sees this as too harsh, and even neighbors call it unjust."],
       ripple:{now:20, later:25}, counterfactual:"Requiring the farmer to repay the value of the lost grain would fit the actual harm done.",
       reteach:"Hammurabi's actual code called for repaying the value of the damage in cases like this — a punishment that matches the harm, not one that goes far beyond it."},
      {text:"No — the farmer should repay the value of the lost grain instead.", outcome:"best",
       consequence:["The farmer pays back what the neighbor lost.","Both families move on, and the punishment matches the actual harm done."],
       ripple:{now:10, later:10}, counterfactual:"Destroying the farmer's house would have been a punishment far more severe than the accidental harm caused.", reteach:null}
     ]},
    {type:"decide", prompt:"Here's the uncomfortable part: Hammurabi's Code punished the same crime differently depending on whether the victim was a noble or a commoner. A noble who injured a commoner paid a small fine — but a commoner who injured a noble faced much harsher punishment. Was this system fair?",
     choices:[
      {text:"Yes — nobles were more important to society, so the law reflected that.", outcome:"poor",

       ripple:{now:15, later:20}, counterfactual:"A single standard of justice for everyone would have treated the same crime the same way, no matter who committed it.",
       reteach:"A legal system that punishes the same act differently based on someone's class is treating people unequally under the law — a problem many societies, including Babylon, struggled with."},
      {text:"No — the same crime should carry the same punishment no matter who's involved.", outcome:"best",
       consequence:["That's the modern idea of equal justice under the law — one that Hammurabi's own code didn't fully practice, even though it was one of the first written law codes in history."],
       ripple:{now:10, later:10}, counterfactual:"Accepting different punishments by class would excuse a real unfairness built into the system.", reteach:null}
     ]},
    {type:"create", prompt:"Write one law for your classroom. Keep the punishment proportional to the problem it solves.", starter:"My classroom law is… and the consequence is… because…", badge:"Lawgiver"}
   ]},

/* ================= State ================= */
const state = Object.assign({completed:{}, journal:{}, missionProgress:{}, lastActivity:null, voiceOn:true,
    playCompleted:{}, playBadges:{}, playBest:{}, journalEntries:[]},
  JSON.parse(localStorage.getItem("timetrek_state") || "null") || {});
let saveFlagTimer;
function saveState(){
  localStorage.setItem("timetrek_state", JSON.stringify(state));
  const flag = document.getElementById("saveFlag");
  if(flag){ flag.textContent = "✓ Progress saved"; clearTimeout(saveFlagTimer);
    saveFlagTimer = setTimeout(()=>{ if(flag) flag.textContent=""; }, 2200); }
}
function missionState(id){
  if(!state.missionProgress[id]) state.missionProgress[id] = {step:0, attempts:{}, journal:state.journal[id]||""};
  return state.missionProgress[id];
}

/* ================= Narration ================= */
function speak(text){
  if(!state.voiceOn || !("speechSynthesis" in window)) return;
  try{ window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate=0.95; window.speechSynthesis.speak(u); }catch(e){}
}
document.getElementById("muteToggle").addEventListener("click",(e)=>{
  state.voiceOn=!state.voiceOn; saveState();
  e.target.textContent = state.voiceOn?"🔊":"🔇"; e.target.setAttribute("aria-pressed", String(!state.voiceOn));
  if(!state.voiceOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
});
function speakRow(text){
  const ok = "speechSynthesis" in window;
  return `<div class="speak-row"><button class="speak-btn" aria-label="Play narration for this text" ${ok?"":"disabled title=\"Narration not supported on this device\""} onclick='speak(${JSON.stringify(text)})'>▶️</button>
    <span class="placeholder-note">${ok?"Tap to hear this read aloud.":"Narration isn't available on this device — text is shown below."}</span></div>`;
}

/* ================= Router ================= */
let currentMissionId = null;
let currentPlayId = null;
let playSession = {};
function clearPlayTimer(){
  if(playSession && playSession.timerId){ clearInterval(playSession.timerId); playSession.timerId = null; }
}
function openPlayActivity(id){
  clearPlayTimer();
  playSession = {};
  go("playActivity", {playId:id});
}
function go(screen, opts={}){
  clearPlayTimer();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav.tabbar button").forEach(b=>b.classList.remove("active"));
  if(opts.missionId) currentMissionId = opts.missionId;
  if(opts.playId) currentPlayId = opts.playId;
  render(screen);
  const navMap = {activity:"path", results:"path", playActivity:"play"};
  const navBtn = document.querySelector(`nav.tabbar button[data-screen="${navMap[screen]||screen}"]`);
  if(navBtn) navBtn.classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll("nav.tabbar button").forEach(b=> b.addEventListener("click", ()=> go(b.dataset.screen)));

function render(screen){
  const app = document.getElementById("app");
  const fns = {home:renderHome, path:renderPath, activity:renderActivity, results:renderResults, resources:renderResources, progress:renderProgress, about:renderAbout, play:renderPlay, playActivity:renderPlayActivity};
  app.innerHTML = `<div class="screen active" id="screen-${screen}"></div>`;
  (fns[screen]||renderHome)(document.getElementById(`screen-${screen}`));
}

/* ================= Home ================= */
function renderHome(el){
  const inProgress = MISSIONS.find(m => state.missionProgress[m.id] && state.missionProgress[m.id].step>0 && !state.completed[m.id]);
  el.innerHTML = `
    <div class="hero"><div class="scene" aria-hidden="true">⏳</div><h1>Time Trek</h1><p>Decisions That Made History</p>
      ${speakRow("Welcome to Time Trek. Step into the time machine and make the choices that shaped history.")}
      <button class="btn" id="startBtn" style="margin-top:10px;">Start Your Journey</button></div>
    <div class="card">
      ${inProgress ? `<h3>Continue where you left off</h3><p>You're partway through <strong>${inProgress.title}</strong>.</p>
        <button class="btn secondary" onclick="go('activity',{missionId:'${inProgress.id}'})">Resume Mission</button>`
        : `<h3>Welcome back</h3><p class="placeholder-note">No sign-in needed. Your progress saves automatically on this device.</p>`}
      <p class="save-flag" id="saveFlag" style="margin-top:8px;"></p>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", ()=> go("path"));
}

/* ================= Path ================= */
const GRADE_ORDER = ["G3","G4","G5","G6"];
function isGradeUnlocked(grade){
  const rank = GRADE_ORDER.indexOf(grade);
  for(let i=0; i<rank; i++){
    const priorGrade = GRADE_ORDER[i];
    const priorMissions = MISSIONS.filter(m=>m.grade===priorGrade);
    if(!priorMissions.every(m=>state.completed[m.id])) return false;
  }
  return true;
}
let gradeFilter = "ALL";
function renderPath(el){
  const grades = ["ALL","G3","G4","G5","G6"];
  const chips = grades.map(g=>`<button class="chip ${gradeFilter===g?"active":""}" onclick="gradeFilter='${g}'; go('path');">${g==="ALL"?"All Grades":g.replace("G","Grade ")}</button>`).join("");
  const visible = MISSIONS.filter(m=> gradeFilter==="ALL" || m.grade===gradeFilter);
  const rows = visible.map((m,i)=>{
    const idxAll = MISSIONS.indexOf(m);
    const done = !!state.completed[m.id];
    const ms = state.missionProgress[m.id];
    const midway = ms && ms.step>0 && !done;
    const status = done?"done":(isGradeUnlocked(m.grade)?"":"locked");
    const label = done?"Replay":midway?"Resume":status==="locked"?"Locked":"Begin";
    const lockNote = status==="locked" ? `<div class="meta" style="margin-top:2px;">Unlocks after finishing all of Grade ${GRADE_ORDER[GRADE_ORDER.indexOf(m.grade)-1].slice(1)}</div>` : "";
    return `<div class="stop ${status}"><div class="node">${done?"✓":idxAll+1}</div>
      <div class="card stop-card"><div><h3 style="margin-bottom:2px;">${m.icon} ${m.title}</h3>
        <div class="meta">${m.place} · ~${m.minutes} min</div>
        <span class="badge-pill">${m.grade.replace("G","Grade ")} · ${m.skill}</span>${lockNote}</div>
        <button class="btn small ${status==="locked"?"ghost":""}" ${status==="locked"?"disabled":""} onclick="go('activity',{missionId:'${m.id}'})">${label}</button></div></div>`;
  }).join("") || `<p class="placeholder-note">No missions yet for this grade — check back soon.</p>`;
  el.innerHTML = `<h2>Learning Path</h2><p>Follow the trail through history. Complete each mission to unlock the next.</p>
    <div class="grade-chips">${chips}</div><div class="trail">${rows}</div>`;
}

/* ================= Activity engine ================= */
function renderActivity(el){
  const m = MISSIONS.find(x=>x.id===currentMissionId) || MISSIONS[0];
  const ms = missionState(m.id);
  const step = m.steps[ms.step];
  const dots = m.steps.map((s,i)=>`<span class="${i<=ms.step?"on":""}"></span>`).join("");
  let body = "";
  if(step.type==="observe") body = renderObserveStep(m, step);
  else if(step.type==="decide") body = renderDecideStep(m, step, ms);
  else if(step.type==="create") body = renderCreateStep(m, step, ms);
  const teacherNote = (m.note && ms.step===0) ? `<div class="teacher-note">👩‍🏫 <strong>For your teacher:</strong> ${m.note}</div>` : "";
  el.innerHTML = `<h2>${m.icon} ${m.title}</h2><div class="step-dots">${dots}</div>
    <div class="card"><p class="meta placeholder-note">${m.place}</p>${teacherNote}<div id="stepBody">${body}</div></div>
    <p class="save-flag" id="saveFlag"></p>`;
}

function renderObserveStep(m, step){
  const clues = step.clues.map((c,i)=>`<button class="clue-chip" id="clue-${i}" onclick="revealClue(${i})">${c.icon} ${c.label}</button><div id="clueDetail-${i}" class="clue-detail" style="display:none;">${c.detail}</div>`).join("");
  return `<p>${step.text}</p>${speakRow(step.text)}
    <div id="clueBox">${clues}</div>
    <button class="btn" id="nextObsBtn" style="margin-top:14px;" disabled onclick="advanceStep('${m.id}')">Continue</button>
    <p class="placeholder-note" id="clueHint">Tap every clue to unlock Continue.</p>`;
}
window._seenClues = {};
function revealClue(i){
  document.getElementById(`clueDetail-${i}`).style.display="block";
  document.getElementById(`clue-${i}`).classList.add("seen");
  speak(document.getElementById(`clueDetail-${i}`).textContent);
  window._seenClues[i]=true;
  const total = document.querySelectorAll(".clue-chip").length;
  if(Object.keys(window._seenClues).length>=total){
    document.getElementById("nextObsBtn").disabled=false;
    document.getElementById("clueHint").textContent="All clues collected — ready to continue.";
  }
}
function advanceStep(id){
  const ms = missionState(id); ms.step++; saveState(); render("activity");
}

function renderDecideStep(m, step, ms){
  const stepIdx = ms.step;
  const attempt = ms.attempts[stepIdx] || {tried:[]};
  const triedList = attempt.tried.map(i=> step.choices[i].text).join("; ");
  const choices = step.choices.map((c,i)=>`<button class="choice-btn ${attempt.tried.includes(i)?"tried":""}" onclick="chooseOption('${m.id}',${stepIdx},${i})">${c.text}</button>`).join("");
  const priorNote = attempt.tried.length ? `<p class="attempt-note">You already tried: ${triedList}. You can pick a different path, or try that one again to review what happens.</p>` : "";
  return `<h3>${step.prompt}</h3>${speakRow(step.prompt)}<div id="choices">${choices}</div>${priorNote}<div id="sceneArea"></div>`;
}

function chooseOption(missionId, stepIdx, choiceIdx){
  const m = MISSIONS.find(x=>x.id===missionId);
  const ms = missionState(missionId);
  const step = m.steps[stepIdx];
  const choice = step.choices[choiceIdx];
  if(!ms.attempts[stepIdx]) ms.attempts[stepIdx] = {tried:[]};
  if(!ms.attempts[stepIdx].tried.includes(choiceIdx)) ms.attempts[stepIdx].tried.push(choiceIdx);
  saveState();
  const later = choice.ripple.later, now = choice.ripple.now;
  const lines = choice.consequence.map((l,i)=>`<p class="scene-line" style="animation-delay:${i*0.45}s;">${l}</p>`).join("");
  const canContinue = choice.outcome!=="poor";
  const box = document.getElementById("sceneArea");
  box.innerHTML = `<div class="scene-box ${choice.outcome}">
      ${lines}
      <div class="ripple-wrap"><div class="ripple-label"><span>Now</span><span>Later</span></div>
        <div class="ripple-track"><div class="ripple-fill" id="rippleFill"></div></div></div>
      ${choice.reteach ? `<p><em>${choice.reteach}</em></p>` : ""}
      <button class="btn small ghost" onclick="toggleCounterfactual(this)">Watch the other path</button>
      <div class="counterfactual" style="display:none;">${choice.counterfactual}</div>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        ${canContinue ? `<button class="btn secondary" onclick="advanceStep('${m.id}')">Continue</button>` : `<button class="btn" onclick="renderActivity(document.getElementById('screen-activity'))">Try Again</button>`}
      </div></div>`;
  speak(choice.consequence.join(" ") + (choice.reteach ? (" " + choice.reteach) : ""));
  setTimeout(()=>{ const f=document.getElementById("rippleFill"); if(f) f.style.width = Math.max(now, later) + "%"; }, 60);
}
function toggleCounterfactual(btn){
  const box = btn.nextElementSibling;
  const showing = box.style.display==="block";
  box.style.display = showing ? "none" : "block";
  btn.textContent = showing ? "Watch the other path" : "Hide the other path";
}

function renderCreateStep(m, step, ms){
  return `<h3>Time Journal</h3><p>${step.prompt}</p>${speakRow(step.prompt)}
    <p class="placeholder-note">Sentence starter: "${step.starter}"</p>
    <textarea id="journalBox" rows="3" placeholder="Write your thoughts here...">${ms.journal||""}</textarea>
    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" onclick="completeMission('${m.id}','${step.badge}')">Complete Mission</button>
    </div>`;
}
function completeMission(id, badge){
  const ms = missionState(id);
  ms.journal = document.getElementById("journalBox").value;
  state.journal[id] = ms.journal;
  state.completed[id] = true; state.lastActivity = id;
  saveState();
  go("results", {missionId:id});
}

/* Skill-mastery mapping used by the Teacher View below. Each mission and Play
   activity is tagged with the one core skill area it practices most, using the
   four areas named in the project spec (geography, chronology, civics, cause &
   effect). A couple of general-purpose activities (like the open-ended Journal
   and the mixed-topic Trivia Dash) intentionally sit outside all four, since
   they cut across every skill rather than building one specifically. */
const SKILL_CATEGORIES = ["Geography","Chronology","Civics","Cause & Effect"];
const SKILL_CATEGORY_MAP = {
  river:"Geography", explorer:"Geography", regions:"Geography", nile:"Geography",
  silkroad:"Geography", aqueduct:"Geography", mapmissions:"Geography",
  timecapsule:"Chronology", northstar:"Chronology", firelight:"Chronology",
  artifacthunt:"Chronology", museum:"Chronology", timeline:"Chronology",
  mysteryartifact:"Chronology", thenvsnow:"Chronology",
  symbols:"Civics", neighborhoodheroes:"Civics", treaty:"Civics", capitolhill:"Civics",
  declaration:"Civics", townmeeting:"Civics", convention:"Civics", hammurabi:"Civics",
  civicscorner:"Civics",
  marketday:"Cause & Effect", goldrush:"Cause & Effect", colonycountdown:"Cause & Effect",
  supplyline:"Cause & Effect", civbuilder:"Cause & Effect", tradetycoon:"Cause & Effect"
};
function computeSkillMastery(){
  const result = {};
  SKILL_CATEGORIES.forEach(c=> result[c] = {done:0, total:0, missing:[]});
  MISSIONS.forEach(m=>{
    const cat = SKILL_CATEGORY_MAP[m.id];
    if(!cat) return;
    result[cat].total++;
    if(state.completed[m.id]) result[cat].done++; else result[cat].missing.push(m.title);
  });
  PLAY_ACTIVITIES.forEach(a=>{
    const cat = SKILL_CATEGORY_MAP[a.id];
    if(!cat) return;
    result[cat].total++;
    if(state.playCompleted[a.id]) result[cat].done++; else result[cat].missing.push(a.title);
  });
  return result;
}
function renderProgress(el){
  const doneCount = Object.keys(state.completed).length;
  const byGrade = GRADE_ORDER.map(g=>{
    const missions = MISSIONS.filter(m=>m.grade===g);
    const tiles = missions.map(m=>`<div class="artifact-tile">${state.completed[m.id]?"🏅":'<span class="badge-empty"></span>'}<br>${m.skill}</div>`).join("");
    const gradeDone = missions.filter(m=>state.completed[m.id]).length;
    return `<h3 style="margin-top:14px;">${g.replace("G","Grade ")} <span class="placeholder-note">(${gradeDone}/${missions.length})</span></h3>
      <div class="artifact-grid">${tiles}</div>`;
  }).join("");
  const playBadgeCount = Object.keys(state.playBadges).length;
  const playTiles = PLAY_ACTIVITIES.map(pa=>{
    const earned = state.playCompleted[pa.id];
    return `<div class="artifact-tile">${earned?"🏅":'<span class="badge-empty"></span>'}<br>${pa.title}</div>`;
  }).join("");
  const mastery = computeSkillMastery();
  const skillRows = SKILL_CATEGORIES.map(cat=>{
    const {done, total, missing} = mastery[cat];
    const pct = total ? Math.round((done/total)*100) : 0;
    let note;
    if(pct >= 80) note = `Strong footing in ${cat.toLowerCase()}.`;
    else if(pct >= 40) note = `Building steadily in ${cat.toLowerCase()} — a few more activities will round this out.`;
    else note = `Could use more practice in ${cat.toLowerCase()}.`;
    const nextUp = missing.length ? `Not yet tried: ${missing.slice(0,3).join(", ")}${missing.length>3?", …":""}` : "Every activity in this area is complete.";
    return `<div style="margin-bottom:16px;">
      <div class="timer-label"><span><strong>${cat}</strong></span><span>${done}/${total}</span></div>
      <div class="timer-track"><div class="timer-fill" style="width:${pct}%;"></div></div>
      <p class="placeholder-note" style="margin:4px 0 0;">${note} ${nextUp}</p>
    </div>`;
  }).join("");
  el.innerHTML = `<h2>My Progress</h2><div class="card"><p>${doneCount} of ${MISSIONS.length} missions complete.</p>${byGrade}</div>
    <div class="card"><h3 style="margin-top:0;">🎲 Play Badges</h3><p>${playBadgeCount} of ${PLAY_ACTIVITIES.length} Play badges earned.</p>
      <div class="artifact-grid">${playTiles}</div></div>
    <div class="card"><h3 style="margin-top:0;">🍎 Teacher View</h3>
      <p class="placeholder-note">A skill-by-skill mastery summary for this device's learner, combining every mission and Play activity completed so far — so you know exactly where to reteach.</p>
      ${skillRows}
      <p class="placeholder-note">This is a single-device sample. It reflects whoever has been playing on this device, not a full class roster.</p>
    </div>`;
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}
