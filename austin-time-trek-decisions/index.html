function journalInitCanvas(){
  const canvas = document.getElementById("journalCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(playSession.drawingData){ const img = new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src = playSession.drawingData; }
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height)};
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle = playSession.color; ctx.lineWidth = 4; ctx.lineCap="round"; ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; playSession.drawingData = canvas.toDataURL(); }
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function journalSetColor(c, btn){
  playSession.color = c;
  document.querySelectorAll("#playBody .swatch").forEach(s=>{ s.classList.remove("active"); s.setAttribute("aria-pressed","false"); });
  if(btn){ btn.classList.add("active"); btn.setAttribute("aria-pressed","true"); }
}
function journalClearCanvas(){
  const canvas = document.getElementById("journalCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  playSession.drawingData = null;
}
function journalNewStarter(){
  playSession.draftText = document.getElementById("journalToolBox").value;
  playSession.starterIdx = Math.floor(Math.random()*JOURNAL_STARTERS.length);
  rerenderPlayActivity();
}
function journalSaveEntry(){
  const text = document.getElementById("journalToolBox").value.trim();
  if(!text) return;
  state.journalEntries.push({text, drawing: playSession.drawingData || null, ts: Date.now()});
  awardPlayBadge("journaltool","Time Traveler");
  playSession.draftText = ""; playSession.drawingData = null;
  saveState();
  rerenderPlayActivity();
}

const CIV_EVENTS = [
  {name:"Good Rains", food:2, note:"Steady rain helped every crop planted this season."},
  {name:"Dry Spell", food:-2, note:"A dry spell meant your farmers got a smaller harvest than hoped."},
  {name:"Traveling Traders Arrive", prosperity:2, note:"Traders passed through, trading goods for a boost in prosperity."},
  {name:"Raiders Spotted", defenseNeed:true, note:"Raiders were seen near the settlement — defenses were tested."},

function civStepperHtml(key,label,icon,totalUsed,cap){
  const val = playSession.workers[key];
  return `<div class="stepper" style="margin:6px 8px 6px 0;">
    <button onclick="civAdjust('${key}',-1)" ${val<=0?"disabled":""} aria-label="Fewer ${label} workers">−</button>
    <span class="qty">${icon} ${val}</span>
    <button onclick="civAdjust('${key}',1)" ${totalUsed>=cap?"disabled":""} aria-label="More ${label} workers">+</button>
  </div>`;
}
function renderCivBuilder(el, a){
  if(playSession.season === undefined){
    playSession.season = 1;
    playSession.workers = {farm:2, build:2, defend:2};
    playSession.stats = {population:10, food:6, prosperity:4, defense:4};
    playSession.log = [];
  }
  const w = playSession.workers, s = playSession.stats;
  const total = w.farm+w.build+w.defend;
  const logHtml = playSession.log.length ? `<div class="card">${playSession.log.map(l=>`<p class="scene-line">${l}</p>`).join("")}</div>` : "";
  el.innerHTML = `<h3>${a.icon} Build a Civilization</h3>
    <p class="placeholder-note">Season ${playSession.season} of 3 · Population ${s.population} · Food ${s.food} · Prosperity ${s.prosperity} · Defense ${s.defense}</p>
    <p>You have <strong>6 workers</strong> to assign this season. Where should they go?</p>
    <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; margin:12px 0;">
      <div><div class="placeholder-note">🌾 Farming</div>${civStepperHtml("farm","farming","🌾",total,6)}</div>
      <div><div class="placeholder-note">🏘️ Building &amp; Trade</div>${civStepperHtml("build","building","🏘️",total,6)}</div>
      <div><div class="placeholder-note">🛡️ Defense</div>${civStepperHtml("defend","defense","🛡️",total,6)}</div>
    </div>
    <p class="placeholder-note">Workers assigned: ${total} / 6</p>
    <button class="btn" style="margin-top:10px;" ${total!==6?"disabled":""} onclick="civAdvanceSeason()">Advance Season</button>
    ${logHtml}`;
}
function civAdjust(key, delta){
  const w = playSession.workers;
  const total = w.farm+w.build+w.defend;
  if(delta>0 && total>=6) return;
  if(delta<0 && w[key]<=0) return;
  w[key] += delta;
  rerenderPlayActivity();
}
function civAdvanceSeason(){
  const w = playSession.workers, s = playSession.stats;
  const event = CIV_EVENTS[Math.floor(Math.random()*CIV_EVENTS.length)];
  let food = s.food + w.farm*2 - Math.round(s.population*0.4) + (event.food||0);
  let prosperity = s.prosperity + w.build*2 + (event.prosperity||0);
  let defense = s.defense + w.defend*2 - 2;
  let population = s.population;
  let notes = [`<strong>Season ${playSession.season} event:</strong> ${event.name} — ${event.note}`];
  if(event.defenseNeed && defense < 6){
    population = Math.max(4, population - 2);
    notes.push("Defenses weren't strong enough, and the raid cost the settlement some people and supplies.");
  } else if(event.defenseNeed){
    notes.push("Your defenses held strong, and the raid was turned away!");
  }
  if(food > s.food + 2){ population += 2; notes.push("With plenty of food, your settlement grew — new families arrived!"); }
  else if(food < 2){ population = Math.max(4, population - 1); notes.push("Food ran short, and a few families moved on to find better land."); food = Math.max(0, food); }
  s.food = Math.max(0, food); s.prosperity = Math.max(0, prosperity); s.defense = Math.max(0, defense); s.population = population;
  playSession.log = notes;
  playSession.season++;
  playSession.workers = {farm:2, build:2, defend:2};
  if(playSession.season > 3){
    const total = s.population + s.prosperity + s.defense;
    let tier = "Steady Village";
    if(total > 34) tier = "Thriving Kingdom"; else if(total < 20) tier = "Humble Outpost";
    awardPlayBadge("civbuilder", tier);
    renderPlayComplete(document.getElementById("playBody"), PLAY_ACTIVITIES.find(x=>x.id==="civbuilder"), tier,
      `After three seasons, your settlement became a ${tier.toLowerCase()} — population ${s.population}, prosperity ${s.prosperity}, defense ${s.defense}. Every choice about where to send workers shaped what happened next.`);
    return;
  }
  rerenderPlayActivity();
}

/* ---- 8. Trade Route Tycoon ---- */
const TRADE_STOPS = [
  { name:"Chang'an Market", note:"Chinese silk and paper begin their journey west here.", prices:{Silk:6, Spices:3, Tea:2} },
  { name:"Desert Oasis Bazaar", note:"Camel caravans rest and trade at oases like this one.", prices:{Silk:9, Spices:4, Tea:3} },
  { name:"Samarkand Crossroads", note:"Ideas, religions, and inventions mixed here as much as goods.", prices:{Silk:8, Spices:7, Tea:5} },
  { name:"Mediterranean Port", note:"Goods are loaded onto ships bound for Europe.", prices:{Silk:13, Spices:10, Tea:6} }
];
const TRADE_GOODS = ["Silk","Spices","Tea"];
function renderTradeTycoon(el, a){
  if(playSession.stopIdx===undefined){
    playSession.stopIdx = 0; playSession.cash = 20;
    playSession.inventory = {Silk:0,Spices:0,Tea:0};
    playSession.phase = "buy";
  }
  const stop = TRADE_STOPS[playSession.stopIdx];
  const isLast = playSession.stopIdx === TRADE_STOPS.length-1;
  const invSummary = TRADE_GOODS.map(g=>`${g}: ${playSession.inventory[g]}`).join(" · ");

  if(playSession.phase === "sell"){
    const rows = TRADE_GOODS.map(g=>{
      const have = playSession.inventory[g];
      const price = stop.prices[g];
      return `<div class="card"><p><strong>${g}</strong> — you have ${have}, sells here for 🪙${price} each</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn small" onclick="tradeSell('${g}',1)" ${have<=0?"disabled":""}>Sell 1</button>
          <button class="btn small ghost" onclick="tradeSell('${g}','all')" ${have<=0?"disabled":""}>Sell All</button>
        </div></div>`;
    }).join("");
    el.innerHTML = `<h3>${a.icon} Trade Route Tycoon</h3>
      <p class="placeholder-note">Stop ${playSession.stopIdx+1} of ${TRADE_STOPS.length}: ${stop.name} · 🪙 ${playSession.cash} coins</p>
      <p>${stop.note}</p>${speakRow(stop.note)}
      <p class="placeholder-note">Your cargo: ${invSummary}</p>
      <h4 style="margin-top:10px;">Sell your goods here</h4>${rows}
      <button class="btn" style="margin-top:12px;" onclick="tradeGoToBuy()">${isLast ? "See Final Results" : "Continue to Buying"}</button>`;
    return;
  }

  const rows = TRADE_GOODS.map(g=>{
    const price = stop.prices[g];
    const afford = Math.floor(playSession.cash / price);
    return `<div class="card"><p><strong>${g}</strong> — costs 🪙${price} each here</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" onclick="tradeBuy('${g}')" ${afford<1?"disabled":""}>Buy 1</button>
      </div></div>`;
  }).join("");
  el.innerHTML = `<h3>${a.icon} Trade Route Tycoon</h3>
    <p class="placeholder-note">Stop ${playSession.stopIdx+1} of ${TRADE_STOPS.length}: ${stop.name} · 🪙 ${playSession.cash} coins</p>
    <p>${stop.note}</p>${speakRow(stop.note)}
    <p class="placeholder-note">Your cargo: ${invSummary}</p>
    <h4 style="margin-top:10px;">Buy goods to carry to the next stop</h4>${rows}
    <button class="btn" style="margin-top:12px;" onclick="tradeNextStop()">Travel to Next Stop</button>`;
}
function tradeBuy(g){
  const stop = TRADE_STOPS[playSession.stopIdx];
  const price = stop.prices[g];
  if(playSession.cash < price) return;
  playSession.cash -= price;
  playSession.inventory[g]++;
  rerenderPlayActivity();
}
function tradeSell(g, amount){
  const stop = TRADE_STOPS[playSession.stopIdx];
  const price = stop.prices[g];
  const qty = amount === "all" ? playSession.inventory[g] : Math.min(1, playSession.inventory[g]);
  playSession.inventory[g] -= qty;
  playSession.cash += qty*price;
  rerenderPlayActivity();
}
function tradeGoToBuy(){
  if(playSession.stopIdx >= TRADE_STOPS.length-1){ tradeFinish(); return; }
  playSession.phase = "buy";
  rerenderPlayActivity();
}
function tradeNextStop(){
  playSession.stopIdx++;
  playSession.phase = "sell";
  rerenderPlayActivity();
}
function tradeFinish(){
  const profit = playSession.cash - 20;
  let tier = "Apprentice Trader";
  if(profit >= 15) tier = "Master Trader"; else if(profit >= 5) tier = "Savvy Trader";
  awardPlayBadge("tradetycoon", tier);
  renderPlayComplete(document.getElementById("playBody"), PLAY_ACTIVITIES.find(x=>x.id==="tradetycoon"), tier,
    `You started with 🪙20 and finished the route with 🪙${playSession.cash} — buying low, selling high, and learning how supply and demand shift prices from stop to stop.`);
}

      {icon:"🔨", label:"Blacksmith's Ledger", text:"The blacksmith's ledger lists a delivery of 'old bell metal' the same week the bell disappeared."},
      {icon:"🗣️", label:"Neighbor's Account", text:"A neighbor recalled hearing the bell was cracked and rang poorly for months before it vanished."},
      {icon:"🕵️", label:"Empty Bell Tower", text:"The bell tower shows no signs of forced entry — the ropes were removed carefully, not cut."}
    ],
    question:"What does the evidence best support?",
    choices:[
      {text:"The town intentionally melted the old, cracked bell to make a new one", correct:true},
      {text:"Raiders stole the bell in the night", correct:false},
      {text:"The bell simply disappeared with no explanation", correct:false},
      {text:"An animal carried the bell away", correct:false}
    ],
    explain:"The town record, the blacksmith's ledger, and the careful (not forced) removal all point to a planned, ordinary town decision — not a mystery at all once you connect every clue."
  }
];
function renderMysteryArtifact(el, a){
  if(playSession.caseIdx===undefined){
    el.innerHTML = `<h3>${a.icon} Mystery of the Missing Artifact</h3><p>Choose a case to investigate.</p>
      <div class="play-grid">${MYSTERY_CASES.map((c,i)=>`<div class="play-card"><h3>${c.title}</h3><p>${c.intro}</p><button class="btn" onclick="mysteryPick(${i})">Investigate</button></div>`).join("")}</div>`;
    return;
  }
  const c = MYSTERY_CASES[playSession.caseIdx];
  if(playSession.stage === "clues"){
    const revealed = playSession.revealed || {};
    const allRevealed = c.clues.every((_,i)=>revealed[i]);
    const grid = c.clues.map((clue,i)=>`<button class="scene-obj ${revealed[i]?"found":""}" onclick="mysteryReveal(${i})">${revealed[i]?"🔎":clue.icon}<span class="so-label">${clue.label}</span></button>`).join("");
    const selected = playSession.selectedClue!==undefined ? c.clues[playSession.selectedClue] : null;
    el.innerHTML = `<h3>${a.icon} ${c.title}</h3><p>${c.intro}</p>${speakRow(c.intro)}
      <div class="scene-grid">${grid}</div>
      ${selected ? `<div class="card"><p><strong>${selected.label}:</strong> ${selected.text}</p></div>` : ""}
      <button class="btn" style="margin-top:12px;" ${allRevealed?"":"disabled"} onclick="mysteryGoSolve()">Solve the Mystery</button>`;
    return;
  }
  if(playSession.stage === "solve"){
    el.innerHTML = `<h3>${a.icon} ${c.title}</h3><p><strong>${c.question}</strong></p>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
        ${c.choices.map((ch,i)=>`<button class="vote-btn" onclick="mysterySolve(${i})">${ch.text}</button>`).join("")}
      </div>`;
    return;
  }
  if(playSession.stage === "result"){
    const picked = c.choices[playSession.pickedChoice];
    el.innerHTML = `<h3>${a.icon} Case ${picked.correct ? "Solved!":"Review"}</h3>
      <div class="card"><p>${picked.correct ? "🎉 You solved it! " : "Not quite — here's what the evidence really shows: "}${c.explain}</p></div>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" onclick="mysteryFinish()">Continue</button>
      </div>`;
  }
}
function mysteryPick(i){ playSession.caseIdx=i; playSession.stage="clues"; playSession.revealed={}; rerenderPlayActivity(); }
function mysteryReveal(i){ playSession.revealed[i]=true; playSession.selectedClue=i; rerenderPlayActivity(); }
function mysteryGoSolve(){ playSession.stage="solve"; rerenderPlayActivity(); }
function mysterySolve(i){ playSession.pickedChoice=i; playSession.stage="result"; rerenderPlayActivity(); }
function mysteryFinish(){
  awardPlayBadge("mysteryartifact","Junior Detective");
  renderPlayComplete(document.getElementById("playBody"), PLAY_ACTIVITIES.find(x=>x.id==="mysteryartifact"), "Junior Detective",
    "You gathered clues and reasoned through a historical mystery like a real detective!");
}

/* ---- 10. Civics Corner ---- */
const CIVICS_SCENARIOS = [
  { issue:"Should the town spend its savings on a new well, or a new schoolhouse?",
    options:[
      {text:"Build the well — clean water first", pct:54, outcome:"The town votes for the well. Families no longer have to walk far for clean water, though the schoolhouse will have to wait another year."},
      {text:"Build the schoolhouse — education first", pct:46, outcome:"The town votes for the schoolhouse. More children can attend school, though the town keeps relying on the old, distant well a while longer."}
    ]},
  { issue:"A new road would help trade but would cut through a farmer's best field. Should the town build it?",
    options:[
      {text:"Build the road on the planned route", pct:38, outcome:"The road is built as planned. Trade becomes easier, but the farmer loses valuable land and the town debates whether to repay them."},
      {text:"Reroute the road around the field, even though it costs more", pct:62, outcome:"The town pays extra to reroute the road. It takes longer to build, but the farmer keeps their field and trust in the council grows."}
    ]},
  { issue:"Should the town require every shop to close on the same day each week for a shared day of rest?",
    options:[
      {text:"Yes — require a shared closing day", pct:58, outcome:"Shops close together one day a week. Families get more time together, though some shop owners worry about lost sales."},
      {text:"No — let each shop owner choose their own hours", pct:42, outcome:"Shops keep their own schedules. Owners have more freedom, but it's harder for families to plan a day when everyone is off together."}
    ]}
];
function renderCivicsCorner(el, a){
  if(playSession.scenIdx===undefined){ playSession.scenIdx=0; }
  if(playSession.scenIdx >= CIVICS_SCENARIOS.length){
    awardPlayBadge("civicscorner","Community Voter");
    renderPlayComplete(document.getElementById("playBody"), a, "Community Voter",
      "You voted on every town issue and saw how community decisions ripple out to real people.");
    return;
  }
  const s = CIVICS_SCENARIOS[playSession.scenIdx];
  if(playSession.voted){
    const opt = s.options[playSession.votedIdx];
    el.innerHTML = `<h3>${a.icon} Civics Corner</h3>
      <p><strong>${s.issue}</strong></p>
      <div class="card"><p>Town vote result: <strong>${opt.pct}%</strong> in favor of "${opt.text}"</p>
      <p class="perspective-quote">${opt.outcome}</p></div>
      <button class="btn" style="margin-top:12px;" onclick="civicsNext()">${playSession.scenIdx<CIVICS_SCENARIOS.length-1?"Next Issue":"See Results"}</button>`;
    return;
  }
  el.innerHTML = `<h3>${a.icon} Civics Corner</h3>
    <p class="placeholder-note">Town Issue ${playSession.scenIdx+1} of ${CIVICS_SCENARIOS.length}</p>
    <p><strong>${s.issue}</strong></p>${speakRow(s.issue)}
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
      ${s.options.map((o,i)=>`<button class="vote-btn" onclick="civicsVote(${i})">${o.text}</button>`).join("")}
    </div>`;
}
function civicsVote(i){ playSession.voted=true; playSession.votedIdx=i; rerenderPlayActivity(); }
function civicsNext(){ playSession.scenIdx++; playSession.voted=false; rerenderPlayActivity(); }

/* ---- 11. Then vs. Now ---- */
const THEN_NOW_TOPICS = [
  { topic:"School", then:["One-room schoolhouse for all ages","Slate boards instead of paper","Long walks to get to school","Learned mostly reading, writing, and arithmetic"],
    now:["Separate classrooms by grade","Laptops, tablets, and paper","Buses or short rides to school","Wide range of subjects, art, and technology"]},
  { topic:"Food", then:["Grew or hunted most of your own food","No refrigeration — food preserved by salting or drying","Cooking over an open fire","Ate mostly what was in season locally"],
    now:["Buy food from grocery stores","Refrigerators and freezers keep food fresh","Stoves, microwaves, and ovens","Foods shipped in from all over the world, any season"]},
  { topic:"Travel", then:["Walked or rode horses and wagons","A trip of 50 miles could take days","Ships took weeks or months to cross oceans","News traveled only as fast as a horse or ship"],
    now:["Cars, trains, and planes","A trip of 50 miles takes under an hour","Planes cross oceans in hours","News travels instantly, worldwide"]},
  { topic:"Communication", then:["Letters could take weeks to arrive","News spread by town criers or newspapers","Only in-person or written conversations","Messages depended on someone traveling"],
    now:["Instant messages and video calls","News spreads in seconds online","Can talk to anyone, anywhere, instantly","Messages travel without anyone physically moving"]}
];
function renderThenVsNow(el, a){
  if(playSession.topicIdx===undefined){
    el.innerHTML = `<h3>${a.icon} Then vs. Now</h3><p>Choose a topic to compare across eras.</p>
      <div class="play-grid">${THEN_NOW_TOPICS.map((t,i)=>`<div class="play-card"><h3>${t.topic}</h3><button class="btn" onclick="thenNowPick(${i})">Compare</button></div>`).join("")}</div>`;
    return;
  }
  const t = THEN_NOW_TOPICS[playSession.topicIdx];
  if(!playSession.reflecting){
    el.innerHTML = `<h3>${a.icon} ${t.topic}: Then vs. Now</h3>
      <div class="compare-cols">
        <div class="compare-card"><h4>🕰️ Then</h4><ul>${t.then.map(li=>`<li>${li}</li>`).join("")}</ul></div>
        <div class="compare-card now"><h4>📱 Now</h4><ul>${t.now.map(li=>`<li>${li}</li>`).join("")}</ul></div>
      </div>
      <button class="btn" style="margin-top:12px;" onclick="thenNowReflect()">Reflect</button>`;
    return;
  }
  el.innerHTML = `<h3>${a.icon} ${t.topic}: Reflect</h3>
    <p class="placeholder-note">Sentence starter: "About ${t.topic.toLowerCase()} long ago, what I'd miss most about today is…"</p>
    <textarea id="thenNowBox" rows="3" placeholder="Write your reflection here...">${playSession.reflectionText||""}</textarea>
    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn ghost" onclick="thenNowBack()">Back to Comparison</button>
      <button class="btn" onclick="thenNowSave()">Save &amp; Continue</button>
    </div>`;
}
function thenNowPick(i){ playSession.topicIdx=i; playSession.reflecting=false; rerenderPlayActivity(); }
function thenNowReflect(){ playSession.reflecting=true; rerenderPlayActivity(); }
function thenNowBack(){
  const box = document.getElementById("thenNowBox");
  playSession.reflectionText = box ? box.value : "";
  playSession.reflecting=false;
  rerenderPlayActivity();
}
function thenNowSave(){
  const text = document.getElementById("thenNowBox").value.trim();
  const t = THEN_NOW_TOPICS[playSession.topicIdx];
  if(text) state.journalEntries.push({text:`(${t.topic}: Then vs. Now) ${text}`, drawing:null, ts:Date.now()});
  awardPlayBadge("thenvsnow","Time Comparer");
  playSession.topicIdx = undefined; playSession.reflecting=false; playSession.reflectionText="";
  renderPlayComplete(document.getElementById("playBody"), PLAY_ACTIVITIES.find(x=>x.id==="thenvsnow"), "Time Comparer",
    "Nice comparison! Your reflection was saved to your Time Traveler's Journal too.");
}

};

go("home");
