      // Character Avatars SVG Generator

      };

      // Sound Effect Synthesizer via Web Audio API
      const playAudioFeedback = (type) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          
          if (type === 'correct') {
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start();
            osc2.start(ctx.currentTime + 0.1);
            osc1.stop(ctx.currentTime + 0.4);
            osc2.stop(ctx.currentTime + 0.4);
          } else if (type === 'tryAgain') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.setValueAtTime(196, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {
          console.log("Audio synthesis notice:", e);
        }
      };

      function LearnLandApp() {
        const [activeScreen, setActiveScreen] = useState('home');
        const [muted, setMuted] = useState(false);
        const [stars, setStars] = useState(12);
        const [equippedHat, setEquippedHat] = useState('none');
        const [equippedGlasses, setEquippedGlasses] = useState(false);
        const [characterType, setCharacterType] = useState('owl');
        const [characterName, setCharacterName] = useState('Barnaby');

        // Quest & Activity States
        const [currentQuest, setCurrentQuest] = useState(null);
        const [roundIndex, setRoundIndex] = useState(0);
        const [questScore, setQuestScore] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [feedback, setFeedback] = useState(null);

        // Word Blending State
        const [tappedPhonemes, setTappedPhonemes] = useState([]);

        // Sentence Builder State
        const [assembledWords, setAssembledWords] = useState([]);

        // Learner Gallery State
        const [drawings, setDrawings] = useState([
          { id: 1, title: 'My Red Ball', date: '2026-09-20', sentence: 'The red ball can bounce high.' }
        ]);
        const [currentSentence, setCurrentSentence] = useState('The cat sat on the mat.');
        const isCanvasDrawing = useRef(false);

        // Skill Mastery Tracking State
        const [skills, setSkills] = useState([
          { id: 'phonics', name: 'Letter Sounds & Phonics', score: 85, level: 'Level 3 - Mastered' },
          { id: 'sight', name: 'Grade Level Sight Words', score: 70, level: 'Level 2 - Practicing' },
          { id: 'blending', name: 'Sound Blending (CVC)', score: 60, level: 'Level 2 - Practicing' },
          { id: 'story', name: 'Story Characters & Setting', score: 90, level: 'Level 4 - Advanced' },
          { id: 'sentence', name: 'Sentence Construction', score: 75, level: 'Level 3 - Mastered' }
        ]);

        // Auto-Speech Engine calibrated to warm, human-like cadence
        const speakText = (text, force = false) => {
          if (muted && !force) return;
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Clear queue prior to speaking
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.98;
            utterance.pitch = 1.18;
            
            const voices = window.speechSynthesis.getVoices();
            const naturalVoice = voices.find(v => 
              v.name.includes('Google US English') || 
              v.name.includes('Samantha') || 
              v.name.includes('Victoria') ||
              v.name.includes('Karen') ||
              v.lang.startsWith('en')
            );
            if (naturalVoice) utterance.voice = naturalVoice;
            window.speechSynthesis.speak(utterance);
          }
        };

        // Auto-speak instructions on screen change
        useEffect(() => {
          if (activeScreen === 'home') {
            speakText("Welcome to LearnLand! Choose where to begin or tap Literacy Isles to start learning through play.");
          } else if (activeScreen === 'progress') {
            speakText("Here is your progress map! Look at all the stars and badges you have earned.");
          } else if (activeScreen === 'about') {
            speakText("About LearnLand. Designed for Kindergarten through Second Grade literacy practice.");
          }
        }, [activeScreen]);

        // Sample Quest Data
        const questData = {
          phonics: {
            title: 'Phonics Isle',
            subtitle: 'Letter Sounds & Initial Phonemes',
            rounds: [
              {
                prompt: 'B! Ball! Ball starts with B! Which picture starts with B?',
                spokenPrompt: 'B. Ball. Ball starts with B! Which picture starts with B?',
                options: [
                  { id: 'ball', label: 'Ball', icon: '⚽', correct: true },
                  { id: 'cat', label: 'Cat', icon: '🐱', correct: false },
                  { id: 'sun', label: 'Sun', icon: '☀️', correct: false }
                ]
              },
              {
                prompt: 'M! Monkey! Which word begins with M?',
                spokenPrompt: 'M. Monkey. Which word begins with M?',
                options: [
                  { id: 'milk', label: 'Milk', icon: '🥛', correct: true },
                  { id: 'tree', label: 'Tree', icon: '🌳', correct: false },
                  { id: 'duck', label: 'Duck', icon: '🦆', correct: false }
                ]
              },
              {
                prompt: 'S! Sun! Find the word that starts with S!',
                spokenPrompt: 'S. Sun. Find the word that starts with S!',
                options: [
                  { id: 'star', label: 'Star', icon: '⭐', correct: true },
                  { id: 'fish', label: 'Fish', icon: '🐟', correct: false },
                  { id: 'apple', label: 'Apple', icon: '🍎', correct: false }
                ]
              }
            ]
          },
          sight: {
            title: 'Sight Word Cave',
            subtitle: 'High Frequency Words',
            rounds: [
              {
                prompt: 'Can you find the sight word: THE?',
                spokenPrompt: 'Can you find the sight word: THE?',
                options: [
                  { id: 'the', label: 'THE', icon: '💬', correct: true },
                  { id: 'and', label: 'AND', icon: '💬', correct: false },
                  { id: 'you', label: 'YOU', icon: '💬', correct: false }
                ]
              },
              {
                prompt: 'Tap the word: PLAY!',
                spokenPrompt: 'Tap the sight word: PLAY!',
                options: [
                  { id: 'play', label: 'PLAY', icon: '🎮', correct: true },
                  { id: 'like', label: 'LIKE', icon: '❤️', correct: false },
                  { id: 'see', label: 'SEE', icon: '👀', correct: false }
                ]
              }
            ]
          },
          blending: {
            title: 'Blending Forest',
            subtitle: 'Tap each sound, then blend the word!',
            rounds: [
              {
                word: 'CAT',
                phonemes: [
                  { sound: '/c/', text: 'C', example: 'C like Cat' },
                  { sound: '/a/', text: 'A', example: 'A like Apple' },
                  { sound: '/t/', text: 'T', example: 'T like Top' }
                ],
                prompt: 'Tap each letter sound, then blend them together!',
                spokenPrompt: 'Tap each letter sound: /c/ /a/ /t/, then blend them to read CAT!'
              }
            ]
          },
          story: {
            title: 'Story Kingdom',
            subtitle: 'Character, Setting & Event Clues',
            rounds: [
              {
                story: 'Pip the Bunny hopped into the sunny garden. He saw a shiny golden apple under the big oak tree.',
                prompt: 'Who is the main character in this story?',
                spokenPrompt: 'Pip the Bunny hopped into the sunny garden. Who is the main character in this story?',
                options: [
                  { id: 'pip', label: 'Pip the Bunny', icon: '🐰', correct: true },
                  { id: 'leo', label: 'Leo the Lion', icon: '🦁', correct: false },
                  { id: 'dragon', label: 'Dino Dragon', icon: '🐲', correct: false }
                ]
              }
            ]
          },
          sentence: {
            title: 'Sentence Builder Studio',
            subtitle: 'Put the word blocks in order to construct a sentence!',
            rounds: [
              {
                targetSentence: ['The', 'happy', 'dog', 'can', 'run.'],
                scrambled: ['can', 'The', 'run.', 'dog', 'happy'],
                prompt: 'Construct the sentence: "The happy dog can run."'
              }
            ]
          }
        };

        const startQuest = (questKey) => {
          setCurrentQuest(questKey);
          setRoundIndex(0);
          setQuestScore(0);
          setSelectedOption(null);
          setFeedback(null);
          setTappedPhonemes([]);
          setAssembledWords([]);
          setActiveScreen('activity');
          
          const q = questData[questKey];
          if (q && q.rounds && q.rounds[0]) {
            const r = q.rounds[0];
            speakText(r.spokenPrompt || r.prompt || `Welcome to ${q.title}!`);
          }
        };

        const handleAnswerOption = (option) => {
          setSelectedOption(option.id);
          if (option.correct) {
            playAudioFeedback('correct');
            setFeedback({ success: true, text: 'Yay! You got it right!' });
            speakText("Yay! You got it right! Awesome job!");
            setQuestScore(prev => prev + 1);
            setStars(prev => prev + 2);
            if (window.confetti) {
              window.confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
            }
          } else {
            playAudioFeedback('tryAgain');
            setFeedback({ success: false, text: 'Nice try! Give it another shot!' });
            speakText("Nice try! Give it another shot!");
          }
        };

        const nextRound = () => {
          const q = questData[currentQuest];
          if (roundIndex + 1 < q.rounds.length) {
            setRoundIndex(prev => prev + 1);
            setSelectedOption(null);
            setFeedback(null);
            const nextR = q.rounds[roundIndex + 1];
            speakText(nextR.spokenPrompt || nextR.prompt);
          } else {
            // Quest Completed
            setFeedback({ completed: true, text: 'Quest Complete! You earned 5 Stars!' });
            speakText("Congratulations! You completed the quest and earned 5 gold stars!");
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
            }
          }
        };

        return (
          <div className="flex flex-col min-h-screen">
            {/* Accessibility Header */}
            <header className="bg-sky-600 text-white shadow-md sticky top-0 z-30 px-4 py-3">
              <div className="max-w-5xl mx-auto flex items-center justify-between">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveScreen('home')}>
                  <div className="bg-white text-sky-600 rounded-2xl p-2 font-bold text-xl flex items-center justify-center w-10 h-10 shadow">
                    LL
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold tracking-wide font-display">LearnLand</h1>
                    <p className="text-xs text-sky-100 font-medium">Early Literacy Adventure</p>

                {/* Status Controls */}

                      if (muted) speakText("Audio enabled", true);

                      muted ? 'bg-amber-500 text-white' : 'bg-sky-500 hover:bg-sky-400 text-white'

                    {muted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}

                </div>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 pb-24">
              {/* SCREEN 1: HOME */}
              {activeScreen === 'home' && (
                <div className="space-y-6">

                    <div className="z-10 max-w-lg text-center md:text-left space-y-3">
                      <span className="bg-sky-900/30 text-sky-100 font-semibold px-3 py-1 rounded-full text-xs inline-block">
                        Pre-K to 2nd Grade ELA
                      </span>
                      <h2 className="text-3xl md:text-4xl font-bold font-display leading-tight">
                        Welcome back to Literacy Isles!
                      </h2>
                      <p className="text-sky-50 text-base md:text-lg">
                        Choose an adventure island to practice letter sounds, sight words, sound blending, and story reading!
                      </p>
                      <div className="pt-2 flex flex-wrap gap-3 justify-center md:justify-start">
                        <button
                          onClick={() => {
                            speakText("Let's begin your Literacy Isles adventure!");
                            setActiveScreen('map');
                          }}
                          className="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-6 py-3.5 rounded-2xl shadow-md text-lg flex items-center space-x-2 transition transform active:scale-95 focus:ring-4 focus:ring-amber-200"
                        >
                          <Sparkles className="w-6 h-6 text-slate-900" />

                        </button>
                        <button
                          onClick={() => speakText("Welcome to LearnLand! Choose where to begin or tap Literacy Isles to start learning through play.")}
                          className="bg-white/20 hover:bg-white/30 text-white font-semibold px-4 py-3.5 rounded-2xl flex items-center space-x-2 transition"
                          aria-label="Listen to directions"
                        >
                          <Volume2 className="w-5 h-5" />
                          <span>Hear Directions</span>
                        </button>
                      </div>
                    </div>

                    {/* Companion Avatar Preview */}
                    <div className="mt-6 md:mt-0 flex flex-col items-center bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20">
                      <CharacterAvatar type={characterType} size="lg" hat={equippedHat} glasses={equippedGlasses} />
                      <div className="mt-2 text-center">
                        <span className="font-bold text-lg font-display">{characterName}</span>
                        <p className="text-xs text-sky-100">Your Learning Companion</p>
                      </div>
                    </div>
                  </div>

                  {/* Literacy Isles Quick Access Map Grid */}
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="text-2xl font-bold font-display text-slate-800">Literacy Isles Quests</h3>
                      <button 
                        onClick={() => setActiveScreen('map')} 
                        className="text-sky-600 hover:text-sky-700 font-bold flex items-center text-sm"
                      >
                        <span>View Full Map</span>
                        <ArrowRight className="w-4 h-4 ml-1" />
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {/* Phonics Isle */}
                      <div 
                        onClick={() => startQuest('phonics')}
                        className="bg-white hover:border-sky-400 border-2 border-slate-100 rounded-3xl p-5 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                      >
                        <div className="flex items-start justify-between">
                          <div className="p-3 bg-sky-100 text-sky-600 rounded-2xl">
                            <Volume2 className="w-8 h-8" />
                          </div>
                          <span className="bg-sky-50 text-sky-700 font-bold text-xs px-2.5 py-1 rounded-full">Round 1-3</span>
                        </div>
                        <div className="mt-4">
                          <h4 className="text-xl font-bold font-display group-hover:text-sky-600 transition">Phonics Isle</h4>
                          <p className="text-sm text-slate-500 mt-1">Master letter sounds & initial phonemes like B, M, and S.</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600 font-medium">
                          <span>3 Activity Rounds</span>
                          <span className="text-emerald-600 font-bold flex items-center"><CheckCircle2 className="w-3.5 h-3.5 mr-1"/> Ready</span>
                        </div>
                      </div>

                      {/* Sight Word Cave */}
                      <div 
                        onClick={() => startQuest('sight')}
                        className="bg-white hover:border-teal-400 border-2 border-slate-100 rounded-3xl p-5 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                      >
                        <div className="flex items-start justify-between">
                          <div className="p-3 bg-teal-100 text-teal-600 rounded-2xl">
                            <BookOpen className="w-8 h-8" />
                          </div>
                          <span className="bg-teal-50 text-teal-700 font-bold text-xs px-2.5 py-1 rounded-full">Round 1-2</span>
                        </div>
                        <div className="mt-4">
                          <h4 className="text-xl font-bold font-display group-hover:text-teal-600 transition">Sight Word Cave</h4>
                          <p className="text-sm text-slate-500 mt-1">Recognize high-frequency words instantly (THE, PLAY, LIKE).</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600 font-medium">
                          <span>2 Activity Rounds</span>
                          <span className="text-emerald-600 font-bold flex items-center"><CheckCircle2 className="w-3.5 h-3.5 mr-1"/> Ready</span>
                        </div>
                      </div>

                      {/* Blending Forest */}
                      <div 
                        onClick={() => startQuest('blending')}
                        className="bg-white hover:border-amber-400 border-2 border-slate-100 rounded-3xl p-5 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                      >
                        <div className="flex items-start justify-between">
                          <div className="p-3 bg-amber-100 text-amber-600 rounded-2xl">
                            <Sparkles className="w-8 h-8" />
                          </div>
                          <span className="bg-amber-50 text-amber-700 font-bold text-xs px-2.5 py-1 rounded-full">Interactive</span>
                        </div>
                        <div className="mt-4">
                          <h4 className="text-xl font-bold font-display group-hover:text-amber-600 transition">Blending Forest</h4>
                          <p className="text-sm text-slate-500 mt-1">Tap individual letter sounds to blend CVC words like CAT.</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600 font-medium">
                          <span>Phoneme Sound Tiles</span>
                          <span className="text-emerald-600 font-bold flex items-center"><CheckCircle2 className="w-3.5 h-3.5 mr-1"/> Ready</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* SCREEN 2: FULL LITERACY MAP */}
              {activeScreen === 'map' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-3xl font-bold font-display text-slate-800">Literacy Isles Map</h2>
                      <p className="text-slate-600 text-sm">Tap any island to begin your learning challenge!</p>
                    </div>
                    <button
                      onClick={() => setActiveScreen('home')}
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm"
                    >
                      Back to Home
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Map Node 1 */}
                    <div className="bg-white p-6 rounded-3xl border-2 border-sky-100 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-3xl">🏝️</span>
                        <span className="bg-sky-100 text-sky-800 font-bold text-xs px-3 py-1 rounded-full">Goal: Letter Sounds</span>
                      </div>
                      <h3 className="text-2xl font-bold font-display text-slate-800">Phonics Isle</h3>
                      <p className="text-slate-600 text-sm">Listen to character letter prompts and match initial sounds with fun visual icons.</p>
                      <button
                        onClick={() => startQuest('phonics')}
                        className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-2xl flex items-center justify-center space-x-2 shadow"
                      >
                        <span>Start Phonics Quest</span>
                        <ArrowRight className="w-5 h-5" />
                      </button>
                    </div>

                    {/* Map Node 2 */}
                    <div className="bg-white p-6 rounded-3xl border-2 border-teal-100 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-3xl">⛰️</span>
                        <span className="bg-teal-100 text-teal-800 font-bold text-xs px-3 py-1 rounded-full">Goal: Sight Words</span>
                      </div>
                      <h3 className="text-2xl font-bold font-display text-slate-800">Sight Word Cave</h3>
                      <p className="text-slate-600 text-sm">Identify high-frequency sight words to unlock golden cave treasures.</p>
                      <button
                        onClick={() => startQuest('sight')}
                        className="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-2xl flex items-center justify-center space-x-2 shadow"
                      >
                        <span>Start Sight Words Quest</span>
                        <ArrowRight className="w-5 h-5" />
                      </button>
                    </div>

                    {/* Map Node 3 */}
                    <div className="bg-white p-6 rounded-3xl border-2 border-emerald-100 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-3xl">🌲</span>
                        <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-3 py-1 rounded-full">Goal: Sound Blending</span>
                      </div>
                      <h3 className="text-2xl font-bold font-display text-slate-800">Blending Forest</h3>
                      <p className="text-slate-600 text-sm">Tap individual phonemes to assemble and read simple CVC words.</p>
                      <button
                        onClick={() => startQuest('blending')}
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-2xl flex items-center justify-center space-x-2 shadow"
                      >
                        <span>Start Blending Quest</span>
                        <ArrowRight className="w-5 h-5" />
                      </button>
                    </div>

                    {/* Map Node 4 */}
                    <div className="bg-white p-6 rounded-3xl border-2 border-indigo-100 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-3xl">🏰</span>
                        <span className="bg-indigo-100 text-indigo-800 font-bold text-xs px-3 py-1 rounded-full">Goal: Story Comprehension</span>
                      </div>
                      <h3 className="text-2xl font-bold font-display text-slate-800">Story Kingdom</h3>
                      <p className="text-slate-600 text-sm">Listen to short passages and identify characters, settings, and main story events.</p>
                      <button
                        onClick={() => startQuest('story')}
                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl flex items-center justify-center space-x-2 shadow"
                      >
                        <span>Start Story Quest</span>
                        <ArrowRight className="w-5 h-5" />
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* SCREEN 3: GUIDED ACTIVITY QUEST ENGINE */}
              {activeScreen === 'activity' && currentQuest && (
                <div className="bg-white rounded-3xl border-2 border-sky-100 p-6 md:p-8 shadow-sm space-y-6 max-w-3xl mx-auto">
                  {/* Quest Header Navigation */}
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                    <button
                      onClick={() => setActiveScreen('map')}
                      className="text-slate-500 hover:text-slate-700 font-bold text-sm flex items-center"
                    >
                      ← Exit Quest
                    </button>

                    <div className="flex items-center space-x-2">
                      <span className="font-bold text-sm text-sky-700 font-display">
                        {questData[currentQuest].title}
                      </span>
                      <span className="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full">
                        Round {roundIndex + 1} of {questData[currentQuest].rounds.length}
                      </span>
                    </div>
                  </div>

                  {/* Standard Option Challenge */}
                  {(currentQuest === 'phonics' || currentQuest === 'sight' || currentQuest === 'story') && (
                    <div className="space-y-6">
                      <div className="bg-sky-50 p-6 rounded-2xl border border-sky-200 relative">
                        <button
                          onClick={() => speakText(questData[currentQuest].rounds[roundIndex].spokenPrompt || questData[currentQuest].rounds[roundIndex].prompt)}
                          className="absolute top-4 right-4 bg-sky-600 text-white p-2.5 rounded-full hover:bg-sky-500 shadow"
                          aria-label="Replay Spoken Direction"
                        >
                          <Volume2 className="w-5 h-5" />
                        </button>
                        <p className="text-xl md:text-2xl font-bold font-display text-slate-800 pr-12">
                          {questData[currentQuest].rounds[roundIndex].prompt}
                        </p>
                      </div>

                      {/* Options Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        {questData[currentQuest].rounds[roundIndex].options.map(option => (
                          <button
                            key={option.id}
                            onClick={() => handleAnswerOption(option)}
                            className={`p-6 rounded-3xl border-3 text-center transition flex flex-col items-center justify-center space-y-3 shadow-sm focus:ring-4 focus:ring-sky-300 ${
                              selectedOption === option.id
                                ? option.correct
                                  ? 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-4 ring-emerald-200'
                                  : 'bg-rose-50 border-rose-400 text-rose-900'
                                : 'bg-white border-slate-200 hover:border-sky-400 hover:bg-sky-50/50'
                            }`}
                          >
                            <span className="text-5xl">{option.icon}</span>
                            <span className="font-bold text-xl font-display">{option.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Interactive Word Blending Challenge */}
                  {currentQuest === 'blending' && (
                    <div className="space-y-6 text-center">
                      <div className="bg-amber-50 p-6 rounded-2xl border border-amber-200">
                        <p className="text-xl font-bold font-display text-amber-900">
                          Tap each sound block to hear the phonemes, then blend them to read CAT!
                        </p>
                      </div>

                      {/* Interactive Phoneme Tiles */}
                      <div className="flex justify-center space-x-4 my-6">
                        {questData.blending.rounds[0].phonemes.map((ph, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              speakText(ph.example);
                              setTappedPhonemes(prev => [...prev, idx]);
                            }}
                            className={`w-24 h-28 rounded-3xl border-4 font-bold text-4xl flex flex-col items-center justify-center shadow-md transition transform active:scale-95 ${
                              tappedPhonemes.includes(idx)
                                ? 'bg-amber-400 border-amber-500 text-slate-900'
                                : 'bg-white border-sky-300 text-sky-700 hover:border-sky-500'
                            }`}
                          >
                            <span>{ph.text}</span>
                            <span className="text-xs font-semibold text-slate-500 mt-1">{ph.sound}</span>
                          </button>
                        ))}
                      </div>

                      <button
                        onClick={() => {
                          playAudioFeedback('correct');
                          speakText("Awesome word blending! C A T spells CAT!");
                          setFeedback({ success: true, text: 'Fantastic Blending! C-A-T = CAT!' });
                          if (window.confetti) window.confetti({ particleCount: 50 });
                        }}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-2xl text-xl shadow-lg flex items-center justify-center space-x-2 mx-auto"
                      >
                        <Volume2 className="w-6 h-6" />
                        <span>Blend & Read "CAT"</span>
                      </button>
                    </div>
                  )}

                  {/* Feedback Banner */}
                  {feedback && (
                    <div className={`p-5 rounded-2xl flex items-center justify-between border ${
                      feedback.success !== false
                        ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                        : 'bg-rose-50 border-rose-300 text-rose-900'
                    }`}>
                      <div className="flex items-center space-x-3">
                        <span className="text-3xl">{feedback.success !== false ? '🎉' : '💡'}</span>
                        <span className="font-bold text-lg font-display">{feedback.text}</span>
                      </div>

                      {feedback.success && (
                        <button
                          onClick={nextRound}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl shadow"
                        >
                          Next Challenge →
                        </button>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* SCREEN 4: MY PROGRESS & PARENT DASHBOARD */}
              {activeScreen === 'progress' && (
                <div className="space-y-6">
                  <div className="bg-white p-6 md:p-8 rounded-3xl border-2 border-sky-100 shadow-sm space-y-6">
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-slate-100 pb-6">
                      <div>
                        <h2 className="text-3xl font-bold font-display text-slate-800">Learner Growth & Progress</h2>
                        <p className="text-slate-600 text-sm">Real-time skill mastery evidence for parents and educators.</p>
                      </div>

                      <button
                        onClick={() => window.print()}
                        className="bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold px-4 py-2.5 rounded-xl flex items-center space-x-2 text-sm"
                      >
                        <Printer className="w-4 h-4" />
                        <span>Print Parent Summary</span>
                      </button>
                    </div>

                    {/* Skill Breakdown Grid */}
                    <div className="space-y-4">
                      <h3 className="text-xl font-bold font-display text-slate-800">Skill Mastery Breakdown</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {skills.map(skill => (
                          <div key={skill.id} className="bg-sky-50/60 p-4 rounded-2xl border border-sky-100 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-slate-800 font-display">{skill.name}</span>
                              <span className="font-bold text-sky-700 text-sm">{skill.score}%</span>
                            </div>
                            <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                              <div className="bg-sky-500 h-full rounded-full transition-all duration-500" style={{ width: `${skill.score}%` }}></div>
                            </div>
                            <span className="text-xs text-slate-500 font-medium block">{skill.level}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Character Closet & Unlocks */}
                    <div className="pt-4 border-t border-slate-100 space-y-4">
                      <h3 className="text-xl font-bold font-display text-slate-800">Earned Accessory Unlocks</h3>
                      <div className="flex flex-wrap gap-4">
                        <button
                          onClick={() => setEquippedHat(equippedHat === 'crown' ? 'none' : 'crown')}
                          className={`p-4 rounded-2xl border-2 flex items-center space-x-3 transition ${
                            equippedHat === 'crown' ? 'bg-amber-100 border-amber-400' : 'bg-white border-slate-200'
                          }`}
                        >
                          <span className="text-3xl">👑</span>
                          <div className="text-left">
                            <span className="font-bold block text-sm">Golden Crown</span>
                            <span className="text-xs text-slate-500">Unlocked at 10 Stars</span>
                          </div>
                        </button>

                        <button
                          onClick={() => setEquippedHat(equippedHat === 'captain' ? 'none' : 'captain')}
                          className={`p-4 rounded-2xl border-2 flex items-center space-x-3 transition ${
                            equippedHat === 'captain' ? 'bg-sky-100 border-sky-400' : 'bg-white border-slate-200'
                          }`}
                        >
                          <span className="text-3xl">⚓</span>
                          <div className="text-left">
                            <span className="font-bold block text-sm">Captain Hat</span>
                            <span className="text-xs text-slate-500">Unlocked at 5 Quests</span>
                          </div>
                        </button>

                        <button
                          onClick={() => setEquippedGlasses(!equippedGlasses)}
                          className={`p-4 rounded-2xl border-2 flex items-center space-x-3 transition ${
                            equippedGlasses ? 'bg-teal-100 border-teal-400' : 'bg-white border-slate-200'
                          }`}
                        >
                          <span className="text-3xl">👓</span>
                          <div className="text-left">
                            <span className="font-bold block text-sm">Star Glasses</span>
                            <span className="text-xs text-slate-500">Unlocked in Blending</span>
                          </div>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* SCREEN 5: ABOUT & EDUCATOR GUIDE */}
              {activeScreen === 'about' && (
                <div className="bg-white p-6 md:p-8 rounded-3xl border-2 border-sky-100 shadow-sm space-y-6 max-w-3xl mx-auto">
                  <div className="space-y-2 border-b border-slate-100 pb-4">
                    <h2 className="text-3xl font-bold font-display text-slate-800">About LearnLand</h2>
                    <p className="text-slate-600 text-sm">Educational Purpose & Pedagogical Rationale</p>
                  </div>

                  <div className="space-y-4 text-slate-700 leading-relaxed text-sm md:text-base">
                    <p>
                      <strong>LearnLand</strong> is designed specifically for Kindergarten through 2nd Grade learners to develop fluency, reading comprehension, vocabulary, and sentence construction through play-based adventure quests.
                    </p>
                    <div className="bg-sky-50 p-4 rounded-2xl border border-sky-200 space-y-2">
                      <h4 className="font-bold font-display text-sky-900">Core Educational Goals:</h4>
                      <ul className="list-disc pl-5 space-y-1 text-sm text-sky-950">
                        <li>Know initial phoneme sounds to every letter.</li>
                        <li>Master grade-level high frequency sight words.</li>
                        <li>Blend CVC phonemes to decode unfamiliar words.</li>
                        <li>Identify story characters, settings, and main events.</li>
                        <li>Construct simple sentences using word tiles.</li>
                      </ul>
                    </div>
                    <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 flex items-center space-x-3">
                      <Shield className="w-8 h-8 text-emerald-600 flex-shrink-0" />
                      <p className="text-xs text-emerald-900">
                        <strong>Privacy & Scope Safety:</strong> LearnLand uses sample fictional profiles and collects zero sensitive student data, health records, or financial information.
                      </p>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Bottom Navigation Bar */}
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-30 px-4 py-2">
              <div className="max-w-2xl mx-auto flex items-center justify-around">
                <button
                  onClick={() => setActiveScreen('home')}
                  className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                    activeScreen === 'home' ? 'text-sky-600 font-bold bg-sky-50' : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  <MapPin className="w-6 h-6" />
                  <span className="text-xs font-display mt-0.5">Home</span>
                </button>

                <button
                  onClick={() => setActiveScreen('map')}
                  className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                    activeScreen === 'map' || activeScreen === 'activity' ? 'text-sky-600 font-bold bg-sky-50' : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  <Sparkles className="w-6 h-6" />
                  <span className="text-xs font-display mt-0.5">Quests</span>
                </button>

                <button
                  onClick={() => setActiveScreen('progress')}
                  className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                    activeScreen === 'progress' ? 'text-sky-600 font-bold bg-sky-50' : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  <Award className="w-6 h-6" />
                  <span className="text-xs font-display mt-0.5">Progress</span>
                </button>

                <button
                  onClick={() => setActiveScreen('about')}
                  className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${
                    activeScreen === 'about' ? 'text-sky-600 font-bold bg-sky-50' : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  <BookOpen className="w-6 h-6" />
                  <span className="text-xs font-display mt-0.5">About</span>
                </button>
              </div>
            </nav>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<LearnLandApp />);
    </script>
</body>
</html>
