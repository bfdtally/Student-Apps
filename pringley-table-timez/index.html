<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Timez</title>
<style>
:root{--plum:#5b2d5f;--plum2:#7b467f;--gold:#e7b84b;--cream:#fff9ef;--ink:#302334;--muted:#756979;--green:#3f9b67;--yellow:#e5b93f;--red:#d85a5a;--line:#eadde8}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:var(--cream);color:var(--ink)}
button,input{font:inherit} button{cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--plum);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:1.35rem;letter-spacing:.3px}.brand span{color:var(--gold)}
.profile{display:flex;align-items:center;gap:10px}.avatar-mini{width:40px;height:40px;border-radius:50%;background:#f0c39c;display:grid;place-items:center;font-size:1.35rem;border:3px solid var(--gold)}
.layout{display:flex;flex:1}.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.nav{display:grid;gap:8px}.nav button{background:transparent;text-align:left;padding:12px 14px;border-radius:14px;color:var(--ink);font-weight:800}.nav button.active,.nav button:hover{background:#f3e7f3;color:var(--plum)}
main{width:min(1120px,100%);margin:0 auto;padding:26px 24px 48px}.hero{background:linear-gradient(135deg,#6b356f,#8d558e);color:white;border-radius:26px;padding:30px;display:flex;justify-content:space-between;gap:25px;align-items:center;box-shadow:0 8px 24px #5b2d5f20}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);margin:0 0 8px}.hero p{margin:0 0 18px;max-width:650px;line-height:1.5}.cta,.gold{background:var(--gold);color:#3c2a10;padding:12px 18px;border-radius:14px;font-weight:900}.ghost{background:white;color:var(--plum);padding:11px 16px;border-radius:13px;font-weight:800}
.hero-art{font-size:5rem;min-width:150px;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 16px #3d243b0b}.card h3{margin:8px 0}.card p{color:var(--muted);line-height:1.45}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.section-title h2{margin:0}.progressbar{height:12px;background:#eee1ec;border-radius:99px;overflow:hidden}.progressbar>div{height:100%;background:var(--gold);border-radius:99px}.journey{display:grid;gap:12px}.journey-item{display:flex;align-items:center;gap:15px;background:white;padding:16px;border-radius:18px;border:1px solid var(--line)}.bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f3e7f3;font-weight:900;color:var(--plum)}.locked{opacity:.55}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#f4eaf4;color:var(--plum);font-size:.8rem;font-weight:800}
.fact{font-size:3rem;font-weight:900;text-align:center;margin:20px}.answer-row{display:flex;gap:10px;justify-content:center}.answer-row input{width:150px;padding:13px;border:2px solid #d8c9d7;border-radius:13px;text-align:center;font-size:1.3rem}.feedback{text-align:center;font-weight:900;min-height:30px;margin:14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:500px;margin:auto}.choice{background:#f5edf5;padding:15px;border-radius:15px;font-weight:900}.choice:hover{background:#ead9ea}.table-wrap{overflow:auto}.mult-table{border-collapse:separate;border-spacing:5px;margin:auto}.mult-table th{padding:7px;color:var(--plum)}.mult-table td{min-width:42px;height:42px;text-align:center;border-radius:9px;font-weight:900}.blank{background:#f1edf0;color:#aaa}.red{background:#f3b0b0}.yellow{background:#f7e29a}.green{background:#a8dbbc}.legend{display:flex;gap:15px;flex-wrap:wrap;margin:14px 0}.legend span{display:flex;align-items:center;gap:6px}.dot{width:16px;height:16px;border-radius:4px}.avatar-builder{display:grid;grid-template-columns:1fr 1fr;gap:18px}.preview{background:#f3e7f3;border-radius:20px;display:grid;place-items:center;min-height:260px}.big-avatar{font-size:7rem}.option-row{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f7eff7;padding:10px 12px;border-radius:12px}.opt.selected{outline:3px solid var(--gold)}.achievement{display:flex;align-items:center;gap:14px}.badge{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#fff0bf;font-size:1.5rem}.timer{font-size:2rem;font-weight:900;text-align:center;color:var(--plum)}.center{text-align:center}.hidden{display:none!important}.notice{background:#fff5cf;border:1px solid #ecd99c;padding:12px 15px;border-radius:14px;margin:12px 0}.footer-note{color:var(--muted);font-size:.9rem;margin-top:25px}
@media(max-width:800px){.side{width:76px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:1.3rem}.grid{grid-template-columns:1fr}.hero{align-items:flex-start}.hero-art{display:none}.avatar-builder{grid-template-columns:1fr}}
@media(max-width:560px){header{padding:11px 14px}.side{display:none}main{padding:18px 14px}.hero{padding:22px}.choices{grid-template-columns:1fr}.fact{font-size:2.4rem}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">Table <span>Timez</span> ✨</div><div class="profile"><span id="studentLabel">Learner</span><div class="avatar-mini" id="miniAvatar">🙂</div></div></header>
<div class="layout">
<aside class="side"><nav class="nav" aria-label="Main navigation">
<button data-page="home">🏠 Home</button><button data-page="learn">🧠 Learn it</button><button data-page="practice">🎮 Practice it</button><button data-page="achievements">🏆 Achievements</button><button data-page="table">📊 My Table</button><button data-page="help">❓ About & Help</button>
</nav></aside>
<main id="main"></main>
</div>
</div>
<script>
const facts = Array.from({length:12},(_,a)=>Array.from({length:12},(_,b)=>({a:a+1,b:b+1,state:'blank'}))).flat();
const state = {page:'home', learned:0, correct:0, wrong:0, streak:0, avatar:{skin:'🧑🏻',hair:'✨',outfit:'👕',accessory:'⭐'}, test:null};
const saved=localStorage.getItem('tableTimezState'); if(saved) Object.assign(state,JSON.parse(saved));
function save(){localStorage.setItem('tableTimezState',JSON.stringify(state))}
function nav(page){state.page=page; save(); render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function avatar(){return state.avatar.skin}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 const pages={home:home,learn:learn,practice:practice,achievements:achievements,table:table,help:help}; document.getElementById('main').innerHTML=pages[state.page]();
 document.getElementById('miniAvatar').textContent=avatar();
 wire();
}
function home(){let p=Math.min(100,Math.round(state.learned/30*100));return `<section class="hero"><div><h1>Ready to level up?</h1><p>Build your multiplication confidence one fact at a time. Learn new facts, practice, and see your table turn from blank to yellow to green.</p><button class="cta" data-go="learn">Start learning →</button></div><div class="hero-art">✖️➗</div></section>
<div class="section-title"><h2>Your journey</h2><span class="pill">${state.learned}/30 facts learned</span></div><div class="progressbar"><div style="width:${p}%"></div></div>
<div class="grid"><div class="card"><div>🧠</div><h3>Learn it</h3><p>Learn five facts at a time with quick challenges.</p><button class="gold" data-go="learn">Learn facts</button></div><div class="card"><div>🎮</div><h3>Practice it</h3><p>${state.learned>=15?'Unlocked:':'Unlock at 15 facts.'} Guided practice keeps you moving.</p><button class="gold" data-go="practice" ${state.learned<15?'disabled':''}>Practice</button></div><div class="card"><div>⏱️</div><h3>Timed test</h3><p>${state.learned>=30?'Unlocked:':'Unlock at 30 facts.'} Answer as many as you can in 1, 3, or 5 minutes.</p><button class="gold" data-go="practice" ${state.learned<30?'disabled':''}>Test</button></div></div>
<div class="section-title"><h2>Customize your learner</h2></div><div class="card"><p>Pick a look before your next challenge.</p><button class="gold" data-go="help">Customize avatar</button></div>`}
function learn(){return `<div class="section-title"><h2>🧠 Learn it</h2><span class="pill">Goal: 30 facts</span></div><div class="notice">Learn five facts in this round. Think first, then check your answer. You can replay the direction with the speaker button.</div><div class="card center"><button class="ghost" id="speak" aria-label="Play spoken directions">🔊 Hear directions</button><div class="fact" id="learnFact"></div><div class="answer-row"><input id="learnAns" type="number" inputmode="numeric" aria-label="Your multiplication answer"><button class="gold" id="learnCheck">Check</button></div><div class="feedback" id="learnFeedback"></div><div id="learnNext"></div></div>`}
let currentLearn;
function startLearn(){currentLearn={a:Math.floor(Math.random()*9)+2,b:Math.floor(Math.random()*9)+2,done:false}; document.getElementById('learnFact').textContent=`${currentLearn.a} × ${currentLearn.b} = ?`;document.getElementById('learnAns').focus()}
function learnCheck(){if(currentLearn.done)return;let v=Number(document.getElementById('learnAns').value), f=document.getElementById('learnFeedback');if(v===currentLearn.a*currentLearn.b){state.correct++;state.learned=Math.min(144,state.learned+1);state.streak++;currentLearn.done=true;f.textContent='🌟 Great job! You got it right!';document.getElementById('learnNext').innerHTML='<button class="gold" id="nextLearn">Next fact →</button>';save()}else{state.wrong++;state.streak=0;f.textContent='💛 Nice try! Think about the groups and try again.'} }
function practice(){if(state.learned<15)return `<div class="card center"><h2>🎮 Practice it is locked</h2><p>Learn 15 facts to unlock guided practice. You have learned ${state.learned}.</p><button class="gold" data-go="learn">Keep learning</button></div>`;return `<div class="section-title"><h2>🎮 Practice it</h2><span class="pill">Guided skill practice</span></div><div class="grid"><div class="card"><h3>Quick Challenge</h3><p>Choose the correct answer.</p><button class="gold" id="startQuick">Start</button></div><div class="card"><h3>Timed Test</h3><p>Unlocked after 30 learned facts. Answer as many as you can in your chosen time.</p>${state.learned>=30?'<button class="gold" id="startTimer">Choose a time</button>':'<span class="pill">🔒 '+state.learned+'/30</span>'}</div><div class="card"><h3>Challenge a Friend</h3><p>Prototype mode uses fictional usernames only—no real student accounts.</p><input id="friendName" placeholder="Example: MathStar7" aria-label="Fictional player username"><button class="gold" id="challenge">Challenge</button></div></div><div id="practiceArea" class="card hidden center"></div>`}
function quickArea(){let a=Math.floor(Math.random()*10)+2,b=Math.floor(Math.random()*10)+2,ans=a*b,opts=[ans,ans+(Math.floor(Math.random()*4)+1),Math.max(1,ans-(Math.floor(Math.random()*4)+1)),ans+7].sort(()=>Math.random()-.5);document.getElementById('practiceArea').classList.remove('hidden');document.getElementById('practiceArea').innerHTML=`<div class="fact">${a} × ${b} = ?</div><div class="choices">${opts.map(x=>`<button class="choice" data-answer="${x}">${x}</button>`).join('')}</div><div class="feedback" id="qfeed"></div>`;document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{let f=document.getElementById('qfeed');if(+x.dataset.answer===ans){state.correct++;state.streak++;f.textContent='⭐ Excellent! Your multiplication fact is getting stronger.'}else{state.wrong++;state.streak=0;f.textContent='💛 Try again. Use the groups you know.'}save()})}
function timerArea(){document.getElementById('practiceArea').classList.remove('hidden');document.getElementById('practiceArea').innerHTML=`<h3>Pick your test</h3><div class="choices"><button class="choice" data-min="1">1 minute</button><button class="choice" data-min="3">3 minutes</button><button class="choice" data-min="5">5 minutes</button></div>`;document.querySelectorAll('[data-min]').forEach(x=>x.onclick=()=>runTest(+x.dataset.min))}
function runTest(min){let end=Date.now()+min*60000,score=0;function q(){let a=Math.floor(Math.random()*10)+2,b=Math.floor(Math.random()*10)+2;document.getElementById('practiceArea').innerHTML=`<div class="timer" id="clock"></div><div class="fact">${a} × ${b} = ?</div><div class="answer-row"><input id="tans" type="number" inputmode="numeric" aria-label="Timed test answer"><button class="gold" id="tcheck">Check</button></div><div class="feedback" id="tfeed">Answer as many as you can!</div>`;document.getElementById('tans').focus();let iv=setInterval(()=>{let left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000);document.getElementById('clock').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(left<=0){clearInterval(iv);document.getElementById('practiceArea').innerHTML=`<h2>⏰ Time!</h2><p>You answered <strong>${score}</strong> facts correctly.</p><button class="gold" id="startTimer">Try again</button>`;wire()}},250);document.getElementById('tcheck').onclick=()=>{let v=Number(document.getElementById('tans').value);if(v===a*b){score++;state.correct++;document.getElementById('tfeed').textContent='🌟 Correct!';}else{state.wrong++;document.getElementById('tfeed').textContent='💛 Keep going!';}save();setTimeout(()=>{if(Date.now()<end)q()},250)}}q()}
function achievements(){let badges=[['🌟','First Fact',state.learned>=1,'Learn your first multiplication fact.'],['🔥','Five Alive',state.learned>=5,'Learn five facts.'],['🎯','15 Fact Finder',state.learned>=15,'Learn 15 facts to unlock practice.'],['🏆','30 Fact Champion',state.learned>=30,'Learn 30 facts to unlock timed tests.'],['💚','Green Machine',state.learned>=50,'Keep building mastery.']];return `<div class="section-title"><h2>🏆 Achievements</h2></div><div class="grid">${badges.map(b=>`<div class="card achievement ${b[2]?'':'locked'}"><div class="badge">${b[0]}</div><div><h3>${b[1]}</h3><p>${b[3]}</p><span class="pill">${b[2]?'Earned':'Locked'}</span></div></div>`).join('')}</div>`}
function table(){let learned=state.learned;let rows='<tr><th>×</th>'+Array.from({length:12},(_,i)=>`<th>${i+1}</th>`).join('')+'</tr>';for(let a=1;a<=12;a++){rows+=`<tr><th>${a}</th>`;for(let b=1;b<=12;b++){let n=(a-1)*12+b;let cls=n<=Math.max(0,learned-5)?'green':n<=learned?'yellow':(n%7===0&&learned>5?'red':'blank');rows+=`<td class="${cls}" title="${a} × ${b}">${n<=learned?a*b:'—'}</td>`}rows+='</tr>'}return `<div class="section-title"><h2>📊 My Table</h2><span class="pill">${learned} facts explored</span></div><p>Watch your multiplication facts change as you learn them.</p><div class="legend"><span><i class="dot blank"></i> Not learned</span><span><i class="dot red"></i> Needs work</span><span><i class="dot yellow"></i> Learning</span><span><i class="dot green"></i> Mastered</span></div><div class="card table-wrap"><table class="mult-table">${rows}</table></div><p class="footer-note">This prototype uses simple progress states to make growth easy to see.</p>`}
function help(){return `<div class="section-title"><h2>❓ About & Help</h2></div><div class="grid"><div class="card"><h3>What is Table Timez?</h3><p>A friendly practice space designed to help learners solve multiplication facts off the top of their heads.</p></div><div class="card"><h3>How do I unlock levels?</h3><p>Learn 5 facts in a round, unlock My Table after 5, Practice after 15, and Timed Test after 30.</p></div><div class="card"><h3>🔊 Audio</h3><p>Spoken directions supplement the text. This prototype uses your device's built-in voice when you press a speaker button.</p><button class="gold" id="speakHelp">Play directions</button></div></div><div class="section-title"><h2>Customize avatar</h2></div><div class="card avatar-builder"><div class="preview"><div class="big-avatar" id="avatarPreview">${avatar()}</div></div><div><h3>Skin</h3><div class="option-row">${['🧑🏻','🧑🏼','🧑🏽','🧑🏾','🧑🏿'].map(x=>`<button class="opt ${state.avatar.skin===x?'selected':''}" data-avatar="skin" data-val="${x}">${x}</button>`).join('')}</div><h3>Hair</h3><div class="option-row">${['✨','🧢','🎀','🪮'].map(x=>`<button class="opt" data-avatar="hair" data-val="${x}">${x}</button>`).join('')}</div><h3>Starter accessory</h3><div class="option-row">${['⭐','🎒','🎧','📚'].map(x=>`<button class="opt" data-avatar="accessory" data-val="${x}">${x}</button>`).join('')}</div><p class="footer-note">Only fictional/local prototype data is stored in this browser.</p></div></div>`}
function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1.05;speechSynthesis.speak(u)}}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));let s=document.getElementById('speak');if(s)s.onclick=()=>speak('Welcome to Table Timez. Think first, then solve the multiplication fact. Great effort!');let sh=document.getElementById('speakHelp');if(sh)sh.onclick=()=>speak('Table Timez helps you practice multiplication facts with short challenges and encouraging feedback.');let lc=document.getElementById('learnCheck');if(lc){startLearn();lc.onclick=learnCheck;document.getElementById('learnAns').onkeydown=e=>{if(e.key==='Enter')learnCheck()}}let nl=document.getElementById('nextLearn');if(nl)nl.onclick=()=>{state.learned=Math.max(0,state.learned);save();render()};let sq=document.getElementById('startQuick');if(sq)sq.onclick=quickArea;let st=document.getElementById('startTimer');if(st)st.onclick=timerArea;let ch=document.getElementById('challenge');if(ch)ch.onclick=()=>{let n=document.getElementById('friendName').value.trim()||'MathStar7';document.getElementById('practiceArea').classList.remove('hidden');document.getElementById('practiceArea').innerHTML=`<h3>⚔️ Friendly Match Ready!</h3><p>You challenged fictional player <strong>${n.replace(/[<>&"]/g,'')}</strong>. For this static prototype, both players use sample questions on the same device.</p><button class="gold" id="startQuick">Start match round</button>`;wire()};document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{state.avatar[b.dataset.avatar]=b.dataset.val;save();render()})}
render();
</script>
</body>
</html>
