<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordy Wonders</title>
<style>
:root{--navy:#123b63;--blue:#2f80c9;--sky:#eaf6ff;--cyan:#8fd3ff;--yellow:#ffd45c;--ink:#17324d;--muted:#60788e;--white:#fff;--green:#35a66f;--red:#d95b5b;--shadow:0 12px 30px rgba(18,59,99,.10)}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"Nunito","Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f7fcff 0%,#eaf6ff 100%);min-height:100vh}
button,select{font:inherit} button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #d9eaf7}.nav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;padding:14px 20px}.brand{font-weight:900;font-size:1.35rem;color:var(--navy);display:flex;align-items:center;gap:9px;white-space:nowrap}.logo{width:42px;height:42px;border-radius:13px;background:var(--yellow);display:grid;place-items:center;font-size:1.35rem}.grade{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800}.grade select{border:2px solid #c8e4f6;border-radius:12px;padding:8px 11px;color:var(--navy);background:white;font-weight:800}.navlinks{display:flex;gap:6px;overflow:auto}.navlinks button{background:transparent;color:var(--muted);padding:9px 10px;border-radius:10px;font-weight:800}.navlinks button.active,.navlinks button:hover{background:var(--sky);color:var(--navy)}
main{max-width:1180px;margin:auto;padding:28px 20px 50px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:stretch}.heroCard,.card{background:white;border:1px solid #dbeef9;border-radius:24px;box-shadow:var(--shadow)}.heroCard{padding:36px}.eyebrow{color:var(--blue);font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(2.4rem,6vw,4.5rem);line-height:.98;margin:10px 0 16px;color:var(--navy)}.hero p{font-size:1.1rem;line-height:1.6;color:var(--muted);max-width:650px}.heroArt{min-height:310px;background:linear-gradient(145deg,#d9f1ff,#fff);display:grid;place-items:center;position:relative;overflow:hidden}.cloud{position:absolute;background:white;border-radius:999px;opacity:.8}.c1{width:180px;height:55px;top:40px;left:-30px}.c2{width:140px;height:48px;right:-20px;bottom:55px}.book{font-size:7rem;filter:drop-shadow(0 12px 10px rgba(18,59,99,.12));transform:rotate(-5deg)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.primary,.secondary,.option{border-radius:15px;padding:13px 18px;font-weight:900}.primary{background:var(--blue);color:white;box-shadow:0 6px 14px rgba(47,128,201,.25)}.primary:hover{transform:translateY(-1px)}.secondary{background:var(--sky);color:var(--navy)}.section{margin-top:28px}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.section h2{margin:0;color:var(--navy)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{padding:22px}.feature .icon{font-size:2rem}.feature h3{margin:12px 0 6px}.feature p{margin:0;color:var(--muted);line-height:1.5}.progressWrap{padding:20px}.progressTop{display:flex;justify-content:space-between;font-weight:900}.bar{height:14px;background:#e2f1fa;border-radius:999px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px;transition:.3s}.learnGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.lesson{padding:24px}.lesson .mini{font-size:2.5rem}.lesson h3{margin:10px 0}.lesson ul{padding-left:20px;color:var(--muted);line-height:1.7}.activityShell{max-width:850px;margin:auto}.activityTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.scorePill{background:white;border:1px solid #dbeef9;padding:10px 14px;border-radius:999px;font-weight:900}.question{padding:28px;text-align:center}.prompt{font-size:1.15rem;font-weight:900;color:var(--navy)}.picture{font-size:7rem;margin:12px auto}.wordBig{font-size:2.4rem;font-weight:950;color:var(--navy);margin:8px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.option{background:#f7fbfe;border:2px solid #cde8f7;color:var(--navy);font-size:1.25rem;min-height:62px}.option:hover{background:var(--sky)}.option.correct{background:#e5f7ee;border-color:#71c79c;color:#17633e}.option.wrong{background:#fff0f0;border-color:#e28a8a;color:#8f2e2e}.feedback{margin-top:18px;padding:16px;border-radius:15px;text-align:left;display:none}.feedback.show{display:block}.feedback.good{background:#e8f8ef}.feedback.bad{background:#fff2f2}.nextRow{text-align:center;margin-top:16px}.results{padding:34px;text-align:center}.trophy{font-size:5rem}.resultScore{font-size:3rem;font-weight:950;color:var(--navy)}.resourceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.resource{padding:20px}.resource .tag{display:inline-block;background:var(--sky);padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:900;color:var(--blue)}.progressGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stat{padding:22px}.statNum{font-size:2.3rem;font-weight:950;color:var(--navy)}.help{padding:25px}.faq{padding:14px 0;border-bottom:1px solid #e2edf4}.faq strong{display:block;margin-bottom:4px}.speaker{background:var(--yellow);color:var(--navy);width:42px;height:42px;border-radius:12px;font-size:1.15rem;font-weight:900;vertical-align:middle}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid,.resourceGrid{grid-template-columns:1fr}.nav{flex-wrap:wrap}.grade{margin-left:0}.navlinks{order:3;width:100%}}
@media(max-width:600px){main{padding:18px 14px 40px}.heroCard{padding:24px}.options{grid-template-columns:1fr}.learnGrid,.progressGrid{grid-template-columns:1fr}.heroArt{min-height:220px}.book{font-size:5rem}.nav{padding:10px 12px}.brand{font-size:1.15rem}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><nav class="nav" aria-label="Main navigation">
<div class="brand"><span class="logo">📚</span>Wordy Wonders</div>
<div class="navlinks" id="navlinks"></div>
<div class="grade"><label for="grade">Grade</label><select id="grade" aria-label="Choose grade level"><option value="K">Kindergarten</option><option value="1">Grade 1</option><option value="2">Grade 2</option></select></div>
</nav></header>
<main id="appMain"></main>
</div>
<script>
const state={page:"Home",grade:"K",score:0,streak:0,round:0,correct:0,lastResult:null,activity:null,progress:{K:0,1:0,2:0}};
const data={
K:{sight:[
["🧸","the",["the","cat","run"]],["🐶","dog",["dog","can","go"]],["🚗","car",["car","my","see"]],["🧢","hat",["hat","a","you"]],["🛏️","bed",["bed","to","we"]]],
rhymes:[["cat",["bat","sun","hat","dog"]],["rug",["mug","car","pig","bug"]],["dog",["log","hat","sun","frog"]]]},
1:{sight:[
["🐴","horse",["horse","house","where","because"]],["🌳","tree",["tree","three","there","they"]],["🏠","house",["house","about","could","would"]],["⭐","star",["star","start","right","again"]],["🧁","cake",["cake","make","know","were"]]],
rhymes:[["light",["night","right","book","bright"]],["play",["day","say","blue","stay"]],["mouse",["house","blouse","tree","round"]]]},
2:{sight:[
["🏫","school",["school","should","could","would"]],["🌈","rainbow",["rainbow","around","always","right"]],["📖","book",["book","before","through","every"]],["🚲","bike",["bike","because","between","which"]],["🌊","water",["water","where","while","which"]]],
rhymes:[["ground",["sound","round","found","green"]],["chair",["bear","fair","hair","book"]],["train",["brain","chain","plain","house"]]]}
};
const nav=["Home","Learn","Activity","Results","Resources","My Progress","About & Help"];
function renderNav(){document.getElementById("navlinks").innerHTML=nav.map(n=>`<button class="${state.page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join("")}
function go(p){state.page=p;if(p==="Activity"&&!state.activity) startActivity("mixed");renderNav();render();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("grade").addEventListener("change",e=>{state.grade=e.target.value;state.activity=null;render();});
function speak(text){if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}}
function home(){return `<section class="hero"><div class="heroCard"><div class="eyebrow">Reading + Literacy • K–2</div><h1>Learn words.<br>Have fun. ✨</h1><p>Welcome to Wordy Wonders! Practice sight words and rhyming words with quick, friendly challenges.</p><div class="actions"><button class="primary" onclick="go('Learn')">Start Learning →</button><button class="secondary" onclick="startActivity('mixed')">Quick Practice</button></div></div><div class="heroCard heroArt" aria-label="Books and learning illustration"><div class="cloud c1"></div><div class="cloud c2"></div><div class="book">📚</div></div></section>
<section class="section"><div class="sectionHead"><div><h2>Your learning path</h2><div class="muted">Choose a skill and practice at your grade level.</div></div></div><div class="grid"><div class="card feature"><div class="icon">🖼️</div><h3>Picture → Word</h3><p>Look at a picture and choose the matching sight word.</p></div><div class="card feature"><div class="icon">🎵</div><h3>Rhyming Words</h3><p>Find words that sound alike at the end.</p></div><div class="card feature"><div class="icon">🔀</div><h3>Mixed Practice</h3><p>Switch between sight words and rhymes.</p></div></div></section>
<section class="section card progressWrap"><div class="progressTop"><span>Progress to next level</span><span>${state.progress[state.grade]} / 100 pts</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,state.progress[state.grade])}%"></div></div><div class="muted">Get to 100 points to restart at the next difficulty level.</div></section>`}
function learn(){return `<section class="sectionHead"><div><h1>Learn</h1><div class="muted">Grade ${state.grade==="K"?"Kindergarten":state.grade} practice</div></div><button class="speaker" aria-label="Read learning choices aloud" onclick="speak('Choose picture words, rhyming words, or mixed practice.')">🔊</button></section><div class="learnGrid">
<div class="card lesson"><div class="mini">🖼️</div><h3>Picture Words</h3><p class="muted">Match a picture to the word that names it.</p><ul><li>Look carefully.</li><li>Read or listen to each choice.</li><li>Pick the word that matches.</li></ul><button class="primary" onclick="startActivity('sight')">Practice Picture Words</button></div>
<div class="card lesson"><div class="mini">🎵</div><h3>Rhyming Words</h3><p class="muted">Find words with the same ending sound.</p><ul><li>Say the focus word.</li><li>Listen for the ending sound.</li><li>Choose all the rhymes.</li></ul><button class="primary" onclick="startActivity('rhyme')">Practice Rhyming</button></div>
<div class="card lesson"><div class="mini">🔀</div><h3>Mixed Practice</h3><p class="muted">A blend of both skills in one short round.</p><button class="primary" onclick="startActivity('mixed')">Start Mixed Practice</button></div>
<div class="card lesson"><div class="mini">💡</div><h3>Helpful Tip</h3><p class="muted">Say the word out loud. Listening to the sounds can help you notice a match or a rhyme.</p><button class="secondary" onclick="speak('Say the word out loud. Listening to the sounds can help you notice a match or a rhyme.')">🔊 Hear Tip</button></div>
</div>`}
function startActivity(type){state.activity=type;state.round=0;state.correct=0;state.streak=0;state.lastResult=null;state.page="Activity";renderNav();render();}
function currentQuestion(){let type=state.activity;if(type==="mixed")type=state.round%2===0?"sight":"rhyme";if(type==="sight"){let q=data[state.grade].sight[state.round%data[state.grade].sight.length];return {type,...{emoji:q[0],answer:q[1],options:[...q[2]].sort(()=>Math.random()-.5)},prompt:"Which word matches the picture?"}}let q=data[state.grade].rhymes[state.round%data[state.grade].rhymes.length];return {type:"rhyme",answer:q[0],options:[...q[1]].sort(()=>Math.random()-.5),prompt:`Which words rhyme with “${q[0]}”?`}}
function activity(){const q=currentQuestion();const done=state.round>=5; if(done)return results();let choices=q.type==="rhyme"?q.options:q.options;return `<div class="activityShell"><div class="activityTop"><div><strong>Question ${state.round+1} of 5</strong><div class="bar" style="width:220px;margin:7px 0"><div class="fill" style="width:${state.round*20}%"></div></div></div><div class="scorePill">⭐ ${state.score} pts</div></div><div class="card question"><button class="speaker" aria-label="Read question aloud" onclick="speak(${JSON.stringify(q.prompt)})">🔊</button><div class="prompt">${q.prompt}</div>${q.type==="sight"?`<div class="picture" aria-label="Picture clue">${q.emoji}</div>`:`<div class="wordBig">${q.answer}</div>`}<div class="options">${choices.map(o=>`<button class="option" onclick="answer(${JSON.stringify(o)},${JSON.stringify(q.answer)},this)">${o}</button>`).join("")}</div><div id="feedback" class="feedback" role="status"></div><div class="nextRow" id="nextRow"></div></div></div>`}
function answer(choice,answer,btn){if(document.querySelector("#nextRow button"))return;const fb=document.getElementById("feedback");const correct=choice===answer || (state.activity!=="sight" && choice===answer);if(correct){state.correct++;state.streak++;const earned=Math.min(10,5+state.streak);state.score+=earned;state.progress[state.grade]=Math.min(100,state.progress[state.grade]+earned);btn.classList.add("correct");fb.className="feedback show good";fb.innerHTML=`<strong>Great job! 🎉 +${earned} points</strong><br>You got it right.`;speak("Great job!");}else{state.streak=0;state.score=Math.max(0,state.score-5);btn.classList.add("wrong");fb.className="feedback show bad";fb.innerHTML=`<strong>Good try!</strong><br>The correct answer is <b>${answer}</b>. Try a similar one: say “${answer}” and listen carefully to its sounds.`;speak(`Good try. The correct answer is ${answer}.`)}state.round++;document.getElementById("nextRow").innerHTML=`<button class="primary" onclick="render()">Continue →</button>`;renderNav();}
function results(){return `<div class="card results"><div class="trophy">${state.correct>=4?"🌟":"📚"}</div><h1>Round complete!</h1><p class="muted">You answered ${state.correct} out of 5 questions correctly.</p><div class="resultScore">⭐ ${state.score} points</div><p>${state.progress[state.grade]>=100?"Level complete! You reached 100 points. Your next round can use a higher difficulty.":"Keep practicing and build your streak!"}</p><div class="actions" style="justify-content:center"><button class="primary" onclick="startActivity(state.activity)">Play Again</button><button class="secondary" onclick="go('Learn')">Choose Another Activity</button></div></div>`}
function resources(){return `<section class="sectionHead"><div><h1>Resources</h1><div class="muted">Simple practice supports for learners and educators.</div></div></section><div class="resourceGrid"><div class="card resource"><span class="tag">Sight Words</span><h3>Picture Word Cards</h3><p class="muted">Use the picture clues from practice to say, read, and spell words aloud.</p><button class="secondary" onclick="speak('Picture word cards help you say, read, and spell words aloud.')">🔊 Read Aloud</button></div><div class="card resource"><span class="tag">Rhyming</span><h3>Rhyme Hunt</h3><p class="muted">Pick a focus word, then say possible matches aloud. Listen to the ending sounds.</p><button class="secondary" onclick="speak('Pick a focus word, then say possible matches aloud. Listen to the ending sounds.')">🔊 Read Aloud</button></div><div class="card resource"><span class="tag">Center Idea</span><h3>Technology Center</h3><p class="muted">A short practice round can be used during literacy centers for independent review.</p></div></div>`}
function progress(){let p=state.progress[state.grade];return `<section class="sectionHead"><div><h1>My Progress</h1><div class="muted">Practice evidence for Grade ${state.grade}.</div></div></section><div class="progressGrid"><div class="card stat"><div class="muted">Points</div><div class="statNum">${p}</div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div><div class="card stat"><div class="muted">Current streak</div><div class="statNum">${state.streak}</div><p class="muted">Correct answers in a row earn more points.</p></div><div class="card stat"><div class="muted">Last round</div><div class="statNum">${state.correct}/5</div><p class="muted">Use Results & Feedback to review your last round.</p></div><div class="card stat"><div class="muted">Next step</div><div class="statNum">${p>=100?"Level up!":"Keep going!"}</div><p class="muted">${p>=100?"Restart practice at a higher difficulty.":"Practice another 5-question round."}</p></div></div>`}
function about(){return `<section class="sectionHead"><div><h1>About & Help</h1><div class="muted">A focused literacy practice prototype.</div></div></section><div class="card help"><h2>What is Wordy Wonders?</h2><p>Wordy Wonders helps Kindergarten through Grade 2 learners practice sight-word matching and rhyming. It is designed for short, friendly practice during literacy centers.</p><div class="faq"><strong>How do points work?</strong><span class="muted">Correct answers earn points. A growing streak can earn more points. A wrong answer can never remove more than 5 points.</span></div><div class="faq"><strong>What happens when I reach 100 points?</strong><span class="muted">The progress bar reaches the level goal and the learner can restart practice at a higher difficulty.</span></div><div class="faq"><strong>Can I use it without audio?</strong><span class="muted">Yes. Audio is a supplement. All important directions and content remain visible.</span></div><div class="faq"><strong>What learner data is stored?</strong><span class="muted">This prototype uses fictional, local-in-session progress only. It does not request names, contact details, school records, or other sensitive information.</span></div></div>`}
function render(){const main=document.getElementById("appMain");let out=state.page==="Home"?home():state.page==="Learn"?learn():state.page==="Activity"?activity():state.page==="Results"?results():state.page==="Resources"?resources():state.page==="My Progress"?progress():about();main.innerHTML=out}
renderNav();render();
</script>
</body>
</html>
