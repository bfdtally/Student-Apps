<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordy Wonders</title>
<style>
:root{
  --navy:#164e63; --sky:#e0f2fe; --blue:#38bdf8; --deep:#0f766e;
  --cream:#f8fafc; --white:#fff; --ink:#16324f; --muted:#527084;
  --green:#15803d; --green-bg:#dcfce7; --red:#b91c1c; --red-bg:#fee2e2;
  --yellow:#facc15; --shadow:0 10px 30px rgba(15,76,92,.12); --radius:22px;
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e0f2fe 0%,#f8fafc 48%,#fff 100%);color:var(--ink);min-height:100vh}
button,select{font:inherit} button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.95);padding:12px 18px;border-radius:20px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy);font-size:1.25rem}.logo{width:44px;height:44px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:1.5rem}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.nav-btn{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:12px;font-weight:700}.nav-btn:hover,.nav-btn.active{background:var(--sky);color:var(--navy)}
main{padding:30px 4px 50px}.hero{background:var(--white);border-radius:30px;padding:36px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}
h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:1;margin:10px 0;color:var(--navy)}h2{font-size:2rem;margin:0 0 10px}h3{margin:8px 0}.eyebrow{color:var(--deep);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.sub{font-size:1.1rem;line-height:1.55;color:var(--muted);max-width:650px}
.hero-art{min-height:250px;border-radius:28px;background:linear-gradient(145deg,#bae6fd,#ecfeff);display:grid;place-items:center;font-size:8rem;box-shadow:inset 0 0 0 1px rgba(14,116,144,.08)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.primary,.secondary,.choice{border:0;border-radius:15px;padding:13px 18px;font-weight:800}.primary{background:var(--navy);color:#fff}.primary:hover{background:#0e7490}.secondary{background:var(--sky);color:var(--navy)}.primary:focus,.secondary:focus,.choice:focus,.nav-btn:focus,select:focus{outline:3px solid #facc15;outline-offset:2px}
.section{margin-top:26px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);border:1px solid #e2e8f0}.icon{font-size:2.2rem}.small{font-size:.92rem;color:var(--muted);line-height:1.5}
.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;background:var(--sky);border-radius:999px;font-weight:800;color:var(--navy)}
select{border:2px solid #bae6fd;border-radius:13px;padding:11px 14px;background:#fff;color:var(--ink);font-weight:700}
.page{background:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow)}.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.activity-card{border:2px solid #dbeafe;border-radius:22px;padding:24px;background:linear-gradient(180deg,#fff,#f0f9ff)}
.word-picture{font-size:7rem;text-align:center;margin:12px 0}.question{font-size:1.3rem;font-weight:800;text-align:center}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.choice{background:#f8fafc;border:2px solid #cbd5e1;color:var(--ink);min-height:58px}.choice:hover{border-color:var(--blue);background:#eff6ff}.choice.correct{background:var(--green-bg);border-color:#86efac;color:var(--green)}.choice.wrong{background:var(--red-bg);border-color:#fca5a5;color:var(--red)}
.progressbar{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progressbar>div{height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.feedback{margin-top:18px;padding:17px;border-radius:17px}.feedback.good{background:var(--green-bg);color:#166534}.feedback.bad{background:var(--red-bg);color:#991b1b}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat{background:#f0f9ff;border-radius:18px;padding:18px;text-align:center}.stat strong{display:block;font-size:1.8rem;color:var(--navy)}
.list{display:grid;gap:12px;margin-top:18px}.resource{padding:16px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}
.hidden{display:none!important}
@media(max-width:850px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.activity-grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}header{position:static}nav{width:100%;justify-content:center}.brand{width:100%;justify-content:center}}
@media(max-width:520px){.app{padding:10px}.hero,.page{padding:22px}.choices{grid-template-columns:1fr}.hero-art{min-height:180px;font-size:5.5rem}.statgrid{grid-template-columns:1fr 1fr}h1{font-size:2.7rem}}
</style>
</head>

const state=JSON.parse(localStorage.getItem("wordyWonders")||'{"grade":"K","points":0,"streak":0,"level":1,"answered":0,"correct":0,"completed":[],"q":0,"round":0,"used":{}}');
if(!state.used) state.used={};
if(state.questionBankVersion!==4){state.used={};state.questionBankVersion=4;save();}
let currentPage="home", currentActivity="mix", selectedMulti=[], currentQuestion=null;
function ensureUsed(){
  if(!state.used[state.grade]) state.used[state.grade]={sight:[],rhyme:[]};
  if(!Array.isArray(state.used[state.grade].sight)) state.used[state.grade].sight=[];
  if(!Array.isArray(state.used[state.grade].rhyme)) state.used[state.grade].rhyme=[];
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function getLastQuestion(){return currentQuestion}
function getQuestion(){
  ensureUsed();
  const grade=DATA[state.grade];
  let type=currentActivity;
  if(type==='mix') type=(state.round%2===0)?'sight':'rhyme';
  let pool=grade[type];
  let used=state.used[state.grade][type];
  // If the bank has changed, discard IDs that no longer exist.
  const validIds=new Set(pool.map(x=>x.id));
  used=used.filter(id=>validIds.has(id));
  state.used[state.grade][type]=used;
  if(used.length>=pool.length){used=[];state.used[state.grade][type]=used;}
  const remaining=pool.filter(x=>!used.includes(x.id));
  const item=remaining[Math.floor(Math.random()*remaining.length)];
  used.push(item.id);
  return item;
}
function save(){localStorage.setItem("wordyWonders",JSON.stringify(state))}

}
function home(){return `<section class="hero"><div><div class="eyebrow">Read • Match • Rhyme</div><h1>Welcome to Wordy Wonders! 🌟</h1><p class="sub">Practice sight words and rhyming words with quick, friendly challenges. Pick your grade and start learning.</p><div class="actions"><button class="primary" data-go="learn">Start Learning</button><button class="secondary" data-go="activity">Practice Now</button></div><div class="section"><label for="grade"><strong>Choose your grade</strong></label><br><select id="grade"><option ${state.grade==="K"?"selected":""}>K</option><option ${state.grade==="1"?"selected":""}>1</option><option ${state.grade==="2"?"selected":""}>2</option></select></div></div><div class="hero-art" aria-label="Books and learning">📖✨</div></section>
<div class="section cards"><div class="card"><div class="icon">🖼️</div><h3>Picture Match</h3><p class="small">Look at a picture and choose the word that matches it.</p></div><div class="card"><div class="icon">🎵</div><h3>Rhyme Time</h3><p class="small">Find words that sound alike at the end.</p></div><div class="card"><div class="icon">🧩</div><h3>Mix It Up</h3><p class="small">Practice sight words and rhyming words together.</p></div></div>`}
function learn(){return `<section class="page"><div class="topline"><div><div class="eyebrow">Learn</div><h2>Let's learn together!</h2><p class="sub">Your goal: match pictures to words and find words that rhyme.</p></div><span class="pill">Grade ${state.grade}</span></div><div class="activity-grid"><div class="activity-card"><div class="icon">🖼️</div><h3>Sight Word Match</h3><p class="small">See a picture. Pick the word that names it.</p><button class="primary" data-start="sight">Try it</button></div><div class="activity-card"><div class="icon">🎵</div><h3>Rhyme Time</h3><p class="small">See a word. Pick the words that rhyme with it.</p><button class="primary" data-start="rhyme">Try it</button></div><div class="activity-card"><div class="icon">🌈</div><h3>Mixed Practice</h3><p class="small">A little bit of both. Keep your streak going!</p><button class="primary" data-start="mix">Let's go</button></div><div class="activity-card"><div class="icon">💡</div><h3>Helpful Tip</h3><p class="small">Rhyming words have the same ending sound. Say the words out loud and listen!</p><button class="secondary" data-speak="Rhyming words have the same ending sound. Say the words out loud and listen.">🔊 Hear tip</button></div></div></section>`}
function activity(){
 let item=getQuestion();
 currentQuestion=item;
 const progress=(state.round%5)/5*100;
 if(item.type==="rhyme") return `<section class="page"><div class="topline"><div><span class="pill">Rhyme Time</span><h2>What rhymes with <strong>${item.word}</strong>?</h2></div><span class="pill">Question ${(state.round%5)+1} of 5</span></div><button class="secondary" data-speak="What rhymes with ${item.word}?">🔊 Read question</button><div class="word-picture">🎵</div><div class="choices">${item.choices.map(c=>`<button class="choice" data-rhyme="${c}" aria-label="${c}">${c}</button>`).join("")}</div><div id="feedback"></div><div class="section"><div class="progressbar"><div style="width:${progress}%"></div></div><p class="small">${state.points} points • Streak: ${state.streak}</p></div></section>`;
 const sightChoices=shuffle(item.choices);
 return `<section class="page"><div class="topline"><div><span class="pill">Sight Word Match</span><h2>Which word matches?</h2></div><span class="pill">Question ${(state.round%5)+1} of 5</span></div><button class="secondary" data-speak="Which word matches the picture?">🔊 Read question</button><div class="word-picture" aria-label="Picture clue">${item.emoji}</div><div class="choices">${sightChoices.map(c=>`<button class="choice" data-answer="${c}">${c}</button>`).join("")}</div><div id="feedback"></div><div class="section"><div class="progressbar"><div style="width:${progress}%"></div></div><p class="small">${state.points} points • Streak: ${state.streak}</p></div></section>`;
}
function results(){return `<section class="page"><div class="eyebrow">Great work!</div><h2>Round complete 🎉</h2><p class="sub">You practiced ${state.grade === "K" ? "kindergarten" : "grade "+state.grade} words. Keep practicing to build your skills.</p><div class="statgrid"><div class="stat"><strong>${state.points}</strong>Points</div><div class="stat"><strong>${state.correct}</strong>Correct</div><div class="stat"><strong>${state.streak}</strong>Streak</div><div class="stat"><strong>${state.level}</strong>Level</div></div><div class="actions"><button class="primary" data-go="activity">Play Again</button><button class="secondary" data-go="learn">Choose Activity</button></div></section>`}
function resources(){return `<section class="page"><div class="eyebrow">Resources</div><h2>Learning Helpers 📚</h2><p class="sub">Simple ideas for practice at a technology center or with a teacher.</p><div class="list"><div class="resource"><h3>🖼️ Picture + Word</h3><p class="small">Look at an object, say its name, then find the matching word.</p><button class="secondary" data-speak="Look at an object, say its name, then find the matching word.">🔊 Hear it</button></div><div class="resource"><h3>🎵 Rhyme Check</h3><p class="small">Say two words slowly. Listen for the same ending sound.</p><button class="secondary" data-speak="Say two words slowly. Listen for the same ending sound.">🔊 Hear it</button></div><div class="resource"><h3>⭐ Center Tip</h3><p class="small">Try five questions at a time. Celebrate correct answers and use mistakes as a chance to learn.</p></div></div></section>`}
function progress(){let pct=Math.min(100,state.points);return `<section class="page"><div class="topline"><div><div class="eyebrow">My Progress</div><h2>Your learning path 🌟</h2></div><span class="pill">Grade ${state.grade}</span></div><div class="statgrid"><div class="stat"><strong>${state.points}</strong>Points</div><div class="stat"><strong>${state.correct}</strong>Correct</div><div class="stat"><strong>${state.answered}</strong>Answered</div><div class="stat"><strong>${state.level}</strong>Level</div></div><div class="section"><h3>Progress to next level</h3><div class="progressbar"><div style="width:${pct}%"></div></div><p class="small">${state.points}/100 points. Reach 100 to move to the next difficulty level.</p></div><div class="section card"><h3>Next step</h3><p class="small">${state.points>=100?"Level up! Start another round at a higher difficulty.":"Keep practicing sight words and rhyming words."}</p><button class="primary" data-go="activity">Practice</button></div></section>`}
function about(){return `<section class="page"><div class="eyebrow">About & Help</div><h2>About Wordy Wonders</h2><p class="sub">Wordy Wonders is a kid-friendly literacy practice app for Kindergarten through Grade 2. It gives learners short, visual practice with sight words and rhyming words.</p><div class="cards"><div class="card"><h3>🎯 Learning goal</h3><p class="small">Identify a word from a picture and demonstrate understanding of rhyming words.</p></div><div class="card"><h3>♿ Accessibility</h3><p class="small">Large controls, clear labels, keyboard-friendly buttons, visible text, responsive layout, and optional spoken directions.</p></div><div class="card"><h3>🔒 Privacy</h3><p class="small">This prototype uses sample content only. No names, school records, or sensitive learner information are collected.</p></div></div><div class="section card"><h3>How scoring works</h3><p class="small">Correct answers earn points, streaks add a small bonus, and an incorrect answer can never remove more than five points. Progress is stored locally in this browser.</p><button class="secondary" data-reset>Reset sample progress</button></div></section>`}
function answer(correct,button){
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 const fb=document.getElementById("feedback");
 state.answered++;
 if(correct){state.correct++;state.streak++;let earned=10+Math.min(5,state.streak);state.points+=earned;button.classList.add("correct");fb.className="feedback good";fb.innerHTML=`<strong>🎉 Great job!</strong> You earned ${earned} points. <button class="secondary" data-next>Next</button>`;speak("Great job! You got it right.");}
 else{state.streak=0;state.points=Math.max(0,state.points-5);button.classList.add("wrong");document.querySelectorAll(".choice").forEach(b=>{if((b.dataset.answer||b.dataset.rhyme)===currentQuestion.answer)b.classList.add("correct")});fb.className="feedback bad";fb.innerHTML=`<strong>Almost!</strong> The correct answer is shown in green. Try a new question next. <button class="secondary" data-next>Next</button>`;speak("Almost! Let's try another one.");}
 if(state.points>=100){state.level++;state.points=0;}
 state.q++;state.round++;
 save();
}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
 const grade=document.getElementById("grade"); if(grade) grade.onchange=()=>{state.grade=grade.value;state.q=0;currentQuestion=null;save();render()};
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{currentActivity=b.dataset.start;go("activity")});
 document.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(b.dataset.speak));
 document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{const item=getLastQuestion();answer(b.dataset.answer===item.answer,b)});
 document.querySelectorAll("[data-rhyme]").forEach(b=>b.onclick=()=>{const item=getLastQuestion();answer(b.dataset.rhyme===item.answer,b)});
 document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{if(state.round%5===0)go("results");else render()});
 const feedback = document.getElementById("feedback");
 if(feedback) feedback.addEventListener("click", e=>{
   const next=e.target.closest("[data-next]");
   if(next){ if(state.round%5===0) go("results"); else render(); }
 });
 const reset=document.querySelector("[data-reset]");if(reset)reset.onclick=()=>{localStorage.removeItem("wordyWonders");location.reload()};
}
render();
</script>
</body>
</html>
